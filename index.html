  {id:109,titulo:"Los conejos y los perros",nivel:"5º-6º",tipo:"Fábula",icono:"🐰",color:"#059669",colorLight:"#D1FAE5",
   intro:"Un conejo corre perseguido por unos perros. Dos conejos discuten si son galgos o podencos... ¡sin darse cuenta del peligro!",
   texto:`Por entre unas matas,
seguido de perros,
no diré corría,
volaba un conejo.

De su madriguera
salió un compañero
y le dijo: «Tente,
amigo, ¿qué es esto?»

«¿Qué ha de ser?», responde;
«sin aliento llego…
dos pícaros galgos
me vienen siguiendo».

«Sí», replica el otro,
«por allí los veo,
pero no son galgos».
«¿Pues qué son?» «Podencos.»

«¿Qué? ¡Podencos dices!
Sí, como mi abuelo.
Galgos y muy galgos;
bien vistos los tengo.»

«Son podencos, vaya,
que no entiendes de eso.»
«Son galgos, te digo.»
«Digo que podencos.»

En esta disputa
llegando los perros,
pillan descuidados
a mis dos conejos.

Los que por cuestiones
de poco momento
dejan lo que importa,
llévense este ejemplo.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué hace el conejo al principio?",opciones:["Está comiendo hierba","Corre velozmente perseguido por perros","Descansa en su madriguera"],correcta:1},
     {tipo:"opcion",pregunta:"¿De qué discuten los dos conejos?",opciones:["De qué camino tomar para huir","De si los perros son galgos o podencos","De quién corre más rápido"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué significa «volaba un conejo» en la fábula?",opciones:["El conejo caía desde una altura","Se produjo una explosión","El conejo corría muy veloz"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué ocurre al final?",opciones:["Los conejos escapan juntos","Los perros se van aburridos","Los perros atrapan a los dos conejos descuidados"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué nos enseña esta fábula?",opciones:["Que hay que saber distinguir perros","Que hay que saber priorizar lo importante en cada momento","Que es mejor ser cazado por galgos que por podencos"],correcta:1},
     {tipo:"abierta",pregunta:"¿Alguna vez has discutido sobre algo sin importancia mientras perdías algo importante? ¿Qué pasó?"},
   ]},
  {id:110,titulo:"El plato de madera",nivel:"5º-6º",tipo:"Cuento",icono:"👴",color:"#3B82F6",colorLight:"#DBEAFE",
   intro:"Un abuelo mayor tiene dificultades para comer. ¿Cómo trata su familia a los mayores?",
   texto:`¡Pobre abuelo! Había pasado la vida trabajando de sol a sol con sus manos; la fatiga nunca había vencido su voluntad de llevar el sueldo a casa. Pero tanto trabajo se había cobrado un doloroso tributo: las manos del anciano temblaban como las hojas bajo el viento de otoño.

Durante las comidas, no acertaba a llevar la cuchara a la boca y su contenido se derramaba sobre el mantel. Para evitar que rompiera la vajilla, su yerno le mandó comer solo en un rincón con un plato de madera.

El abuelo lo aceptó en silencio, pero se le veía humillado. Un día, el yerno encontró a su hijo pequeño tallando un trozo de madera.

—¿Qué haces? —le preguntó.
—Estoy haciendo un plato de madera para cuando tú seas viejo, papá.

El padre se quedó en silencio. Comprendió su error. Desde ese día, el abuelo volvió a sentarse con la familia en la mesa.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Por qué temblaban las manos del abuelo?",opciones:["Porque estaba enfermo","Por toda una vida de duro trabajo","Porque tenía mucho frío"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué decisión tomó el yerno?",opciones:["Que comerían todos en platos de madera","Que el abuelo comería solo en un rincón con plato de madera","Que el abuelo iría a una residencia"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué se sentía humillado el abuelo?",opciones:["Porque no le gustaba la comida","Porque se sentía rechazado por los problemas de la vejez","Porque no podía ver la televisión"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué estaba haciendo el nieto?",opciones:["Jugando con madera","Tallando un plato de madera para cuando su padre fuera viejo","Haciendo los deberes"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué comprendió el padre al ver al niño?",opciones:["Que su hijo trabajaba bien la madera","Que él también sería viejo y le tratarían igual","Que hay que respetar siempre a los mayores"],correcta:2},
     {tipo:"abierta",pregunta:"¿Cómo crees que debemos tratar a los mayores? ¿Por qué?"},
   ]},
  {id:111,titulo:"El ladrón de estrellas",nivel:"5º-6º",tipo:"Cuento",icono:"⭐",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"Jaime quiere demostrarle a Claudia cuánto la quiere. Se le ocurre una idea extraordinaria: robarle estrellas del cielo.",
   texto:`Jaime tenía una gran amiga llamada Claudia a quien intentaba demostrar cuánto la quería. Cada vez que estaban juntos le hacía la misma promesa:
—Claudia, cuando sea mayor me casaré contigo.

Pero Claudia le preguntaba siempre:
—¿Qué estarías dispuesto a hacer por mí?

Un día Jaime tuvo una idea. Subió al cielo en su globo y le bajó una estrella que dejó colgada en el jardín de Claudia. Desde entonces, cada semana Claudia encontraba una estrella nueva.

Pero un día el Jardinero del Cielo le paró:
—Las estrellas que robas dejan espacios oscuros en el cielo. Además, están buscando a las que les faltan.

Jaime se quedó pensativo. El Jardinero le dijo:
—Dentro de tu corazón hay millones de estrellas. No necesitas venir al cielo a robarlas. Cada vez que sonríes, regalas una estrella. Cada beso que das es otra estrella. Cada palabra cariñosa, cada gesto de amistad, cada favor que haces a un amigo... es una estrella que regalas.

Cuando bajó a la Tierra, Jaime contó a Claudia todo y se extrañó al ver que su amiga se ponía a sonreír más que nunca.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cómo intentaba Jaime demostrar su cariño al principio?",opciones:["Con regalos caros comprados en tiendas","Robando estrellas del cielo","Escribiendo cartas de amor"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué le reprochó el Jardinero del Cielo?",opciones:["Que subía sin permiso en su globo","Que las estrellas robadas dejaban espacios oscuros y las buscaban","Que molestaba a los demás astros"],correcta:1},
     {tipo:"opcion",pregunta:"Según el Jardinero, ¿qué es una estrella que regalamos?",opciones:["Un diamante muy brillante","Cualquier gesto de cariño, amistad o amabilidad","Solo las sonrisas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué sonrió Claudia al oír la historia?",opciones:["Porque le hizo gracia la historia del globo","Porque comprendió que Jaime le daba estrellas cada día sin saberlo","Porque le gustaban los cuentos fantásticos"],correcta:1},
     {tipo:"abierta",pregunta:"¿Cuáles son las «estrellas» que tú puedes regalar a las personas que quieres?"},
     {tipo:"abierta",pregunta:"¿Crees que los mejores regalos son los que cuestan más dinero? Razona tu respuesta."},
   ]},
  {id:112,titulo:"Historia de una lata",nivel:"5º-6º",tipo:"Cuento",icono:"♻️",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"Una lata cuenta su historia: desde que salió de la fábrica hasta que fue reciclada. Un cuento sobre el reciclaje.",
   texto:`Esta es mi historia. A lo mejor te parece poco divertida, pero te aseguro que las aventuras que aquí cuento son verdaderas.

Yo era una lata sonora. Me dormí en un rincón de la calle soñando con el supermercado, la cocina, el cubo de la basura...

Me desperté al sentir que una mano me cogía. Era un hombre algo sucio y mal vestido que me utilizó para pedir limosna. Él me puso un nuevo nombre: BOTE. Me sentía muy orgullosa cuando me decía: «Hoy hemos sacado para la comida, amiga mía».

Un día me dejó en la calle, sola y triste. Una niña llamada Alba me recogió del suelo.
—¡Mamá! ¡Una lata en el suelo!
—Métela en el contenedor amarillo, Alba. Así la reciclarán.

Pasé un tiempo en el arcón amarillo llena de ilusión. Hasta que un día me llevaron a una fábrica y allí... me quedé dormida.

Al despertar, no reconocía mi nueva forma. Hasta que un señor dijo, mirándome:
—¡Oh! ¡Qué tren de hojalata tan bonito! Así eran los juguetes con los que yo jugaba...

Había vuelto a nacer. Era un juguete nuevo con una segunda vida.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Quién cuenta la historia?",opciones:["Un niño llamado Alba","Una lata desde su propio punto de vista","Un reciclador profesional"],correcta:1},
     {tipo:"opcion",pregunta:"¿Para qué utilizó la lata el hombre mal vestido?",opciones:["Para guardar tornillos","Para pedir limosna","Para regar plantas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hizo Alba con la lata?",opciones:["Se la quedó como juguete","La tiró a la basura normal","La metió en el contenedor amarillo para reciclar"],correcta:2},
     {tipo:"opcion",pregunta:"¿En qué se convirtió la lata al final?",opciones:["En un tren de hojalata","En una nueva lata de refresco","En una moneda"],correcta:0},
     {tipo:"opcion",pregunta:"¿Qué nos enseña esta historia?",opciones:["Que las latas son muy útiles para pedir limosna","Que reciclar da una segunda vida a los materiales","Que es mejor tirar las latas a la calle"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué objetos reciclas en tu casa? ¿Por qué es importante reciclar?"},
   ]},
  {id:113,titulo:"La gaviota y el pescador",nivel:"6º",tipo:"Cuento",icono:"🕊️",color:"#0369A1",colorLight:"#E0F2FE",
   intro:"Una gaviota intenta avisar a un pescador de un peligro. Pero ¿cómo puede comunicarse con él?",
   texto:`Una gaviota, desde la altura, vio de pronto cómo el muro del puerto estaba a punto de derrumbarse.

Chillando con todas sus fuerzas, la gaviota comenzó a revolotear alrededor de un pescador que allí había, tratando de llamar su atención. José no se daba cuenta de lo que quería decirle y siguió pescando. El ave voló hacia nuestro amigo y le arrebató el sombrero.

José se levantó y se fue detrás de ella. Cuando se alejaron del muro, la gaviota dejó caer el sombrero. José lo recogió de muy mal humor, regresando luego a su lugar de pesca. Al llegar, descubrió que el muro se había derrumbado justo donde él estaba.

Comprendió entonces el comportamiento de la gaviota: quitándole el sombrero había querido alejarlo del peligro.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Por qué revoloteaba la gaviota alrededor del pescador?",opciones:["Quería el pescado que tenía","Para avisarle del peligro del muro","Le había robado el sombrero antes"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué José siguió a la gaviota?",opciones:["Quería recuperar su sombrero","Quería atrapar a la gaviota","Le pareció interesante"],correcta:0},
     {tipo:"opcion",pregunta:"¿Qué descubrió José al volver?",opciones:["Que alguien le había robado el cesto","Que el muro se había derrumbado donde estaba","Que había perdido su caña de pescar"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuál es el título más adecuado para esta lectura?",opciones:["La gaviota juguetona","La sabia gaviota","El enfado de José"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué cualidad demuestra la gaviota en esta historia?",opciones:["Valentía y generosidad","Inteligencia y bondad","Rapidez y fuerza"],correcta:1},
     {tipo:"abierta",pregunta:"Haz un pequeño resumen del texto con tus propias palabras."},
   ]},
  {id:114,titulo:"Pedrito y el río",nivel:"6º",tipo:"Cuento",icono:"🚣",color:"#0891B2",colorLight:"#CFFAFE",
   intro:"Pedrito desobedece a su padre y sale a pescar en el río crecido. Las consecuencias no tardan en llegar.",
   texto:`Una mañana, el pequeño Pedrito salió a pescar a un río cercano, a pesar de que su padre se lo tenía prohibido.

En aquella época del año el río venía muy crecido y la corriente era muy peligrosa.

Pedrito echó al agua su pequeña embarcación y se adentró poco a poco en la corriente. Al instante notó que la frágil barca nada podía hacer contra las aguas.
—¡Socorro! ¡Socorro! —gritaba asustado.

Desde la orilla le echaron una cuerda que ató al barquito y de esa forma se pudo salvar. Su padre lo castigó por su desobediencia.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Por qué era peligrosa la corriente del río?",opciones:["Porque el agua estaba muy fría","Porque el río venía muy crecido","Porque había rocas en el fondo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué fue Pedrito al río?",opciones:["A bañarse con sus amigos","A pescar, aunque su padre lo tenía prohibido","A buscar a su perro"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué ocurrió cuando Pedrito se adentró en la corriente?",opciones:["Pescó muchos peces","La barca no pudo con la corriente y pidió socorro","Llegó a la orilla opuesta"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se salvó Pedrito?",opciones:["Nadando hasta la orilla","Atando al barquito una cuerda que le echaron","Su padre saltó al agua a rescatarle"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hizo el padre cuando Pedrito se salvó?",opciones:["Lo felicitó por ser valiente","Lo castigó por desobedecer","No dijo nada"],correcta:1},
     {tipo:"abierta",pregunta:"¿Por qué crees que es importante obedecer a los adultos cuando nos prohíben algo peligroso?"},
   ]},
  {id:115,titulo:"El último árbol de la ciudad",nivel:"5º-6º",tipo:"Cuento",icono:"🌆",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"En una ciudad del futuro, solo queda un árbol. Todos luchan por conservarlo. Pero un día algo lo cambia todo.",
   texto:`En la ciudad de Grisópolis, año 2120, solo quedaba un árbol. Lo llamaban el Viejo y estaba protegido por una cúpula de cristal en el centro de la Plaza Mayor.

La gente hacía cola para pasar cinco minutos junto a él. Los niños nunca habían visto otro árbol en su vida.

Un día, una grieta apareció en la cúpula. El Viejo empezó a secarse.

La científica Elena Ríos presentó un plan desesperado ante el consejo de la ciudad: usar las últimas semillas guardadas en el banco de biodiversidad subterráneo para iniciar un proceso de reforestación masiva.

—Tardaremos cien años en ver resultados —dijo alguien.
—Exactamente —respondió Elena—. ¿A qué estábamos esperando?

La votación fue unánime. Ese mismo año, en cada grieta de asfalto, en cada terraza, en cada parque abandonado, comenzaron a crecer árboles.

El Viejo murió. Pero dejó miles de herederos.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuántos árboles quedaban en Grisópolis?",opciones:["Unos pocos en parques","Solo uno, llamado el Viejo","Ninguno, todos habían desaparecido"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué propuso la científica Elena Ríos?",opciones:["Importar árboles de otros países","Un plan de reforestación con semillas del banco de biodiversidad","Evacuar la ciudad"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuánto tiempo tardarían en ver resultados?",opciones:["Diez años","Cincuenta años","Cien años"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cómo respondió Elena a quien objetó el tiempo que tardaría?",opciones:["Que se podría hacer más rápido","«¿A qué estábamos esperando?»","Que no había alternativa"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué simboliza la muerte del Viejo al final?",opciones:["El fracaso de la humanidad","El fin de una era y el inicio de algo nuevo con miles de herederos","La indiferencia de las personas"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué te dice este cuento sobre cómo tratamos el medioambiente hoy? ¿Qué podemos aprender?"},
   ]},
  {id:116,titulo:"El efecto invernadero",nivel:"5º",tipo:"Texto informativo",icono:"🌡️",color:"#DC2626",colorLight:"#FEE2E2",
   intro:"¿Sabes cómo funciona el efecto invernadero y por qué se ha convertido en uno de los mayores retos del planeta?",
   texto:`El efecto invernadero es un fenómeno natural y necesario: la atmósfera actúa como el cristal de un invernadero, reteniendo parte del calor del sol y manteniendo el planeta a una temperatura habitable. Sin él, la temperatura media sería de −18 °C.

El problema es que la actividad humana —especialmente la quema de combustibles fósiles y la deforestación— ha aumentado enormemente la cantidad de gases de efecto invernadero (CO₂, metano...) en la atmósfera.

Esto hace que se retenga más calor del necesario y la temperatura media global sube: es el cambio climático.

Las consecuencias ya visibles son: deshielo de los polos, aumento del nivel del mar, fenómenos meteorológicos extremos más frecuentes y alteración de los ecosistemas.

Para frenar el cambio climático se necesita reducir las emisiones de CO₂, apostar por energías renovables y proteger los bosques.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuál sería la temperatura media de la Tierra sin el efecto invernadero?",opciones:["0 °C","−18 °C","−50 °C"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué actividad humana aumenta los gases de efecto invernadero?",opciones:["La agricultura ecológica","La quema de combustibles fósiles y la deforestación","El uso de energías renovables"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuáles son consecuencias ya visibles del cambio climático?",opciones:["Mayor diversidad animal","Deshielo de los polos y subida del nivel del mar","Más lluvias en los desiertos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué es el CO₂?",opciones:["Un gas de efecto invernadero","Un tipo de energía renovable","Un componente del petróleo"],correcta:0},
     {tipo:"opcion",pregunta:"¿Qué medidas ayudan a frenar el cambio climático?",opciones:["Quemar más carbón de forma controlada","Reducir emisiones, energías renovables y proteger bosques","Construir más presas"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué cambios en tu vida cotidiana podrías hacer para reducir tu huella de carbono?"},
   ]},
  {id:117,titulo:"La conquista del Everest",nivel:"5º-6º",tipo:"Texto informativo",icono:"⛰️",color:"#0D9488",colorLight:"#CCFBF1",
   intro:"El 29 de mayo de 1953, dos hombres llegaron por primera vez a la cima más alta del mundo.",
   texto:`El Everest, con 8.849 metros de altitud, es la montaña más alta del mundo. Se encuentra en la cordillera del Himalaya, entre Nepal y el Tíbet.

El 29 de mayo de 1953, el neozelandés Edmund Hillary y el sherpa nepalés Tenzing Norgay se convirtieron en los primeros seres humanos en llegar a su cima.

Llegaron a la cumbre a las 11:30 de la mañana, permanecieron allí 15 minutos y regresaron con éxito.

Los sherpas son montañeses del Himalaya conocidos por su excepcional capacidad para moverse a gran altitud. Tenzing fue igualmente fundamental para el éxito de la expedición.

A partir de entonces, miles de alpinistas han intentado escalar el Everest. Hoy en día, más de 300 personas no han regresado de ese intento.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuántos metros de altitud tiene el Everest?",opciones:["7.849 metros","8.849 metros","9.200 metros"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuándo llegaron por primera vez a la cima?",opciones:["29 de mayo de 1943","29 de mayo de 1953","8 de junio de 1953"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuántos minutos permanecieron en la cima?",opciones:["5 minutos","15 minutos","30 minutos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué son los sherpas?",opciones:["Guías turísticos europeos","Montañeses del Himalaya con gran capacidad a gran altitud","Equipos de rescate de montaña"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuántas personas no han regresado de intentar escalar el Everest?",opciones:["Más de 100","Más de 200","Más de 300"],correcta:2},
     {tipo:"abierta",pregunta:"¿Qué crees que motiva a las personas a arriesgar su vida por llegar a la cima de una montaña?"},
   ]},
  {id:118,titulo:"El esclavo que se liberó con palabras",nivel:"5º-6º",tipo:"Texto informativo",icono:"✊",color:"#1E293B",colorLight:"#F1F5F9",
   intro:"Frederick Douglass nació como esclavo en EE.UU. Aprendió a leer en secreto y usó las palabras para luchar por la libertad.",
   texto:`Frederick Douglass nació en 1818 en Maryland (Estados Unidos) como esclavo. En aquel tiempo, enseñar a leer a los esclavos era ilegal: los amos temían que el conocimiento los hiciera libres.

A los nueve años, la esposa de su amo comenzó a enseñarle el abecedario sin saber que era ilegal. Cuando su marido lo descubrió, lo prohibió. Pero Douglass siguió aprendiendo en secreto con niños blancos del barrio.

Con doce años ya leía periódicos y libros de política. En ellos descubrió la palabra «abolicionismo»: el movimiento que quería acabar con la esclavitud.

Con veinte años escapó al norte, donde la esclavitud era ilegal. Se convirtió en uno de los oradores más brillantes de su época. Sus discursos y su autobiografía cambiaron la opinión de millones de personas.

«Una vez que aprendes a leer, siempre serás libre», dijo una vez.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Por qué era ilegal enseñar a leer a los esclavos?",opciones:["Era una ley para proteger la educación pública","Los amos temían que el conocimiento los liberara","No había escuelas suficientes"],correcta:1},
     {tipo:"opcion",pregunta:"¿Quién comenzó a enseñarle a leer?",opciones:["Un maestro abolicionista","La esposa de su amo","Un grupo de esclavos que ya sabían leer"],correcta:1},
     {tipo:"opcion",pregunta:"¿Con qué edad escapó al norte?",opciones:["Con doce años","Con dieciséis","Con veinte años"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cómo contribuyó Douglass a la lucha abolicionista?",opciones:["Liderando batallas armadas","Con sus discursos y su autobiografía","Organizando escapes de esclavos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué frase célebre recoge el texto?",opciones:["«La libertad tiene un precio»","«Una vez que aprendes a leer, siempre serás libre»","«El conocimiento es un arma»"],correcta:1},
     {tipo:"abierta",pregunta:"¿Por qué crees que quienes tenían el poder temían que los esclavos aprendieran a leer?"},
   ]},
  {id:119,titulo:"La sinfonía inacabada",nivel:"5º-6º",tipo:"Cuento",icono:"🎻",color:"#8B5CF6",colorLight:"#EDE9FE",
   intro:"La pianista Nora lleva años componiendo una sinfonía que nunca termina. La noche antes del gran concierto, su alumno le da una lección inesperada.",
   texto:`Nora llevaba quince años componiendo su gran sinfonía. Cada vez que creía que estaba terminada, encontraba algo que mejorar y comenzaba de nuevo.

La noche antes del concierto más importante de su vida, seguía encerrada en su estudio, tachando y reescribiendo.

Su alumno Lucas entró a las once de la noche.
—¿Cuándo estará terminada?
—Cuando sea perfecta —respondió Nora sin levantar la vista.
—¿Y qué es perfecto? —preguntó Lucas.

Nora no contestó.

Lucas cogió las partituras del primer movimiento y las miró:
—Maestra, esto ya es hermoso. La perfección que busca no existe. Pero esta música, tal como está, puede emocionar a alguien esta noche.

A la mañana siguiente, Nora dio el concierto. La sinfonía nunca estuvo «terminada». Pero fue la más bella que jamás interpretó.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuántos años llevaba Nora componiendo su sinfonía?",opciones:["Cinco","Diez","Quince"],correcta:2},
     {tipo:"opcion",pregunta:"¿Por qué Nora no la terminaba nunca?",opciones:["Le faltaban instrumentos","Siempre encontraba algo que mejorar buscando la perfección","No le gustaba la música compuesta"],correcta:1},

  {id:120,titulo:"El rey Midas",nivel:"5º",tipo:"Cuento",icono:"✨",color:"#D97706",colorLight:"#FEF9C3",
   intro:"El rey Midas pidió al dios Dioniso que todo lo que tocara se convirtiera en oro. Pronto descubrió que los deseos tienen consecuencias.",
   texto:`El rey Midas era el monarca más codicioso de Frigia. Un día encontró al sátiro Sileno, seguidor del dios Dioniso, perdido en su jardín, y lo trató con hospitalidad.

Agradecido, Dioniso le ofreció concederle un deseo.
—Quiero que todo lo que toque se convierta en oro.

Dioniso lo concedió con una mirada de advertencia.

Al principio Midas estaba encantado: tocó una rosa y se volvió de oro, tocó una piedra y relució. Pero cuando quiso comer, la comida se convirtió en oro entre sus dientes.

Cuando su hija corrió a abrazarle, también se convirtió en una estatua de oro.

Midas rogó a Dioniso que le quitara ese don terrible.
—Báñate en el río Pactolo —le dijo el dios.

Lo hizo y el poder se fue con el agua. Midas aprendió que no todo lo que brilla es bueno, y que a veces los mayores deseos se convierten en las peores trampas.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿A quién encontró el rey Midas en su jardín?",opciones:["Al dios Zeus","Al sátiro Sileno","Al dios Apolo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué don le concedió Dioniso?",opciones:["Vivir eternamente","Que todo lo que tocara se convirtiera en oro","Ser el hombre más fuerte del mundo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué problema inmediato le causó el don?",opciones:["Se le cayó el pelo","La comida se convertía en oro y no podía comer","Su palacio se derrumbó"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué le ocurrió a su hija?",opciones:["Huyó asustada","Se convirtió en estatua de oro al abrazarle","Descubrió cómo romper el hechizo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se deshizo del don?",opciones:["Rogó a Zeus que lo eliminara","Bañándose en el río Pactolo","Durmiendo siete noches seguidas"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué nos enseña la historia del rey Midas sobre la codicia? ¿Puedes pensar en un ejemplo actual?"},
   ]},
  {id:121,titulo:"Ada Lovelace: la primera programadora",nivel:"5º-6º",tipo:"Texto informativo",icono:"💻",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"En 1843, mucho antes de que existieran los ordenadores, Ada Lovelace escribió el primer programa de la historia.",
   texto:`Ada Lovelace nació en Londres en 1815. Era hija del famoso poeta Lord Byron. Desde pequeña mostró un extraordinario talento para las matemáticas.

En 1833 conoció al inventor Charles Babbage, que construía una «máquina analítica», un artefacto mecánico para hacer cálculos complejos. Aunque la máquina nunca se completó por falta de financiación, Ada comprendió su potencial mejor que nadie.

Cuando tradujo un artículo sobre la máquina, añadió sus propias notas, tres veces más largas que el artículo original. En ellas describió cómo la máquina podría calcular la sucesión de Bernoulli.

Ese algoritmo es considerado hoy el primer programa informático de la historia.

Ada también intuyó algo visionario: las máquinas podrían manejar no solo números, sino cualquier tipo de información representable en símbolos.

Murió en 1852 con solo 36 años. En su honor, el lenguaje de programación Ada fue nombrado así en los años 70.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿En qué año nació Ada Lovelace?",opciones:["1800","1815","1833"],correcta:1},
     {tipo:"opcion",pregunta:"¿Quién era Charles Babbage?",opciones:["El marido de Ada","Un poeta contemporáneo","Un inventor que construía una máquina analítica"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué hizo Ada al traducir el artículo sobre la máquina?",opciones:["Lo rechazó por incompleto","Añadió notas tres veces más largas con el primer algoritmo de la historia","Lo publicó en un libro de texto"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué visión tuvo Ada sobre las máquinas del futuro?",opciones:["Que solo harían sumas básicas","Que podrían manejar cualquier tipo de información representable en símbolos","Que sustituirían a todos los matemáticos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Con cuántos años murió Ada Lovelace?",opciones:["26","36","46"],correcta:1},
     {tipo:"abierta",pregunta:"Ada imaginó posibilidades que nadie más veía en su época. ¿Por qué crees que es importante tener pensamiento visionario e innovador?"},
   ]},
  {id:122,titulo:"El comercio justo",nivel:"5º-6º",tipo:"Texto informativo",icono:"🤝",color:"#0D9488",colorLight:"#CCFBF1",
   intro:"¿Sabes cuánto cobra el agricultor que cultiva el cacao de tu chocolate? El comercio justo intenta cambiar esa realidad.",
   texto:`Cuando compras una tableta de chocolate, ¿sabes cuánto recibe el agricultor que cultivó el cacao?

En el sistema comercial habitual, los países productores —a menudo en África o Latinoamérica— venden sus materias primas a precios muy bajos. Las empresas multinacionales las transforman y las venden a precios muy altos. Los agricultores reciben una mínima parte del precio final.

El comercio justo es un movimiento que busca garantizar precios justos a los productores, condiciones laborales dignas y respeto al medioambiente.

Los productos de comercio justo llevan un sello que certifica que los agricultores han recibido un precio mínimo por su trabajo, independientemente de la fluctuación del mercado.

En España, el consumo de productos de comercio justo ha crecido en los últimos años, aunque todavía representa una pequeña fracción del mercado total.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué ocurre con los países productores en el sistema comercial habitual?",opciones:["Obtienen la mayor parte de los beneficios","Venden sus materias primas a precios muy bajos","Controlan el precio final del producto"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué garantiza el comercio justo?",opciones:["El precio más bajo para el consumidor","Precios justos, condiciones dignas y respeto ambiental para los productores","Que los productos lleguen más rápido"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué indica el sello de comercio justo?",opciones:["Que el producto es ecológico","Que los agricultores recibieron un precio mínimo independiente del mercado","Que el producto fue fabricado en Europa"],correcta:1},
     {tipo:"opcion",pregunta:"¿En qué regiones suelen estar los países productores?",opciones:["Europa y Asia oriental","África o Latinoamérica","América del Norte y Australia"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué ha pasado con el consumo de comercio justo en España?",opciones:["Ha disminuido","Ha crecido pero sigue siendo una pequeña fracción","Se ha mantenido igual"],correcta:1},
     {tipo:"abierta",pregunta:"¿Cambiarías tus hábitos de consumo para apoyar el comercio justo aunque los productos fueran algo más caros? Razona tu respuesta."},
   ]},
  {id:123,titulo:"La vuelta al mundo de Magallanes",nivel:"5º-6º",tipo:"Texto informativo",icono:"⛵",color:"#0369A1",colorLight:"#E0F2FE",
   intro:"En 1519, Fernando de Magallanes partió con cinco naves para dar la primera vuelta al mundo. Solo una regresó.",
   texto:`El 20 de septiembre de 1519, el navegante Fernando de Magallanes partió del puerto de Sanlúcar de Barrameda (España) con cinco barcos y 265 hombres para dar la primera vuelta al mundo.

El viaje fue tremendamente duro. Cruzaron el Atlántico, navegaron por la costa de América del Sur y encontraron el estrecho que lleva el nombre de Magallanes, en el extremo sur de Argentina, que los condujo al océano Pacífico.

En Filipinas, Magallanes fue asesinado en una batalla en 1521.

Su lugarteniente, Juan Sebastián Elcano, tomó el mando y el 6 de septiembre de 1522 llegó de vuelta a Sanlúcar con una sola nave, la Victoria, y solo 18 supervivientes.

Habían demostrado que la Tierra era redonda y que era posible circunnavegar el globo. El viaje duró casi tres años.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Desde qué puerto partió Magallanes?",opciones:["Cádiz","Palos de la Frontera","Sanlúcar de Barrameda"],correcta:2},
     {tipo:"opcion",pregunta:"¿Con cuántos hombres y barcos partió la expedición?",opciones:["Tres barcos y 100 hombres","Cinco barcos y 265 hombres","Siete barcos y 400 hombres"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué le ocurrió a Magallanes?",opciones:["Murió de enfermedad en el mar","Fue asesinado en una batalla en Filipinas","Regresó antes por una tormenta"],correcta:1},
     {tipo:"opcion",pregunta:"¿Quién llevó el viaje hasta el final?",opciones:["El virrey de Nueva España","Juan Sebastián Elcano","Francisco Pizarro"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuántos supervivientes regresaron en la Victoria?",opciones:["18","50","100"],correcta:0},
     {tipo:"abierta",pregunta:"¿Qué crees que motivó a esos hombres a emprender un viaje tan peligroso? ¿Habrías participado?"},
   ]},
  {id:124,titulo:"El dilema del tranvía",nivel:"5º-6º",tipo:"Texto informativo",icono:"🚋",color:"#64748B",colorLight:"#F1F5F9",
   intro:"Un famoso experimento mental de filosofía que plantea una pregunta difícil: ¿está bien hacer daño a alguien para salvar a otros?",
   texto:`El «dilema del tranvía» es uno de los experimentos mentales más famosos de la filosofía. Fue planteado por la filósofa Philippa Foot en 1967.

El escenario: un tranvía sin frenos se dirige hacia cinco personas atadas a las vías. Tú estás junto a una palanca. Si la accionas, el tranvía cambiará de vía... hacia donde está atada una sola persona.

¿Accionarías la palanca? ¿Está bien sacrificar a una persona para salvar a cinco?

La mayoría de las personas dice que sí. Pero la misma filósofa propone una variante: estás en un puente sobre las vías y la única forma de detener el tranvía es empujar a alguien al carril. ¿Lo harías? La mayoría dice que no.

¿Por qué nos parece diferente si el resultado matemático es el mismo (salvar cinco a costa de uno)?

Este dilema pone de manifiesto la diferencia entre actuar para causar daño y permitir que ocurra, y nos obliga a reflexionar sobre los fundamentos de la moral.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Quién formuló el dilema del tranvía?",opciones:["Aristóteles","Immanuel Kant","Philippa Foot"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cuántas personas hay atadas en la vía principal?",opciones:["Tres","Cinco","Siete"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuántas personas hay en la vía alternativa?",opciones:["Una","Dos","Tres"],correcta:0},
     {tipo:"opcion",pregunta:"¿Qué diferencia hay entre la variante del puente y la de la palanca?",opciones:["El número de personas afectadas","La diferencia entre actuar para causar daño directamente y desviar","El tipo de vehículo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Para qué sirven los dilemas filosóficos como este?",opciones:["Para encontrar la respuesta correcta a problemas morales","Para reflexionar sobre los fundamentos de la moral","Para entrenar la mente matemática"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué harías tú ante el dilema de la palanca? ¿Y ante el del puente? ¿Por qué te parece diferente?"},
   ]},
  {id:125,titulo:"La historia del dinero",nivel:"5º",tipo:"Texto informativo",icono:"💰",color:"#D97706",colorLight:"#FEF9C3",
   intro:"El dinero no siempre fue billetes y monedas. ¿Cómo pasamos del trueque a las criptomonedas?",
   texto:`Antes de que existiera el dinero, las personas usaban el trueque: intercambiaban directamente bienes y servicios. El trueque tenía un problema: no siempre encontrabas a alguien que tuviera lo que necesitabas y quisiera lo que ofrecías.

Las primeras monedas aparecieron en Lidia (actual Turquía) hacia el año 600 a.C. Estaban hechas de electro, una mezcla natural de oro y plata.

El papel moneda fue inventado en China durante la dinastía Tang (siglo VII d.C.) y tardó siglos en llegar a Europa.

En el siglo XX, la mayoría de países adoptaron el dinero fiduciario: billetes y monedas que no tienen valor intrínseco, sino que lo tienen porque el Estado garantiza su valor.

Hoy, la mayor parte del dinero no existe en forma física: son números en ordenadores. Y han aparecido las criptomonedas, como el Bitcoin, que funcionan de forma descentralizada sin control de ningún estado.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué es el trueque?",opciones:["El primer tipo de moneda metálica","El intercambio directo de bienes sin dinero","Un tipo de préstamo entre vecinos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Dónde aparecieron las primeras monedas?",opciones:["En Egipto","En Grecia","En Lidia (actual Turquía)"],correcta:2},
     {tipo:"opcion",pregunta:"¿Quién inventó el papel moneda?",opciones:["Los romanos","Los chinos durante la dinastía Tang","Los árabes en el siglo IX"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué es el dinero fiduciario?",opciones:["Monedas de oro y plata","Dinero sin valor intrínseco cuyo valor garantiza el Estado","Las criptomonedas modernas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué caracteriza a las criptomonedas?",opciones:["Son monedas de metal muy valioso","Funcionan de forma descentralizada sin control estatal","Las emite el Banco Central Europeo"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué ventajas y desventajas crees que tiene que la mayor parte del dinero exista solo en ordenadores?"},
   ]},
  {id:126,titulo:"Los derechos humanos",nivel:"5º-6º",tipo:"Texto informativo",icono:"🕊️",color:"#0369A1",colorLight:"#E0F2FE",
   intro:"En 1948, tras la Segunda Guerra Mundial, el mundo acordó una lista de derechos básicos para todas las personas. ¿Cuáles son y por qué importan?",
   texto:`El 10 de diciembre de 1948, la Asamblea General de la ONU proclamó la Declaración Universal de los Derechos Humanos. Nació como respuesta a los horrores de la Segunda Guerra Mundial y el Holocausto.

La declaración reconoce que todos los seres humanos, por el simple hecho de serlo, tienen derechos que no pueden quitárseles.

Entre sus 30 artículos destacan:
• Artículo 1: Todos los seres humanos nacen libres e iguales en dignidad.
• Artículo 3: Todo individuo tiene derecho a la vida, a la libertad y a la seguridad.
• Artículo 18: Derecho a la libertad de pensamiento y religión.
• Artículo 26: Derecho a la educación.

Sin embargo, en muchas partes del mundo estos derechos son sistemáticamente violados. Organizaciones como Amnistía Internacional trabajan para denunciar estas violaciones.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuándo se proclamó la Declaración Universal de los Derechos Humanos?",opciones:["En 1945","El 10 de diciembre de 1948","El 1 de enero de 1950"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué nació la Declaración?",opciones:["Para regular el comercio internacional","Como respuesta a los horrores de la Segunda Guerra Mundial","Para crear un gobierno mundial"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuántos artículos tiene la Declaración?",opciones:["18","24","30"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué establece el Artículo 1?",opciones:["Que todos tienen derecho a la educación","Que todos los seres humanos nacen libres e iguales en dignidad","Que está prohibida la esclavitud"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hacen organizaciones como Amnistía Internacional?",opciones:["Hacen cumplir las leyes internacionales","Denuncian las violaciones de derechos humanos","Ayudan a los refugiados económicamente"],correcta:1},
     {tipo:"abierta",pregunta:"¿Cuál de los derechos humanos te parece más fundamental? ¿Hay alguno que creas que falta en la lista?"},
   ]},
  {id:127,titulo:"Frankenstein y la responsabilidad científica",nivel:"5º-6º",tipo:"Cuento",icono:"⚡",color:"#1E293B",colorLight:"#F1F5F9",
   intro:"Víctor Frankenstein logra crear vida en el laboratorio. Pero cuando ve lo que ha hecho, huye. ¿Qué nos dice eso sobre la ciencia?",
   texto:`Víctor Frankenstein era un joven científico obsesionado con una pregunta: ¿puede la ciencia crear vida?

Trabajó durante años. Usó materiales de cementerios, experimentó con electricidad y finalmente lo logró: su criatura abrió los ojos.

Pero en ese momento, Víctor huyó horrorizado por lo que había creado. Abandonó a la criatura sin nombre, sin familia y sin ninguna explicación sobre su propia existencia.

La criatura, sola y rechazada por todos los que la veían, se fue volviendo violenta.

Antes de morir, la criatura le dijo a Víctor:
—Tú me creaste, pero nunca asumiste la responsabilidad de lo que hiciste. Ese es tu verdadero crimen.

Mary Shelley escribió esta historia en 1818, con solo 20 años. En ella plantea una pregunta que sigue vigente: ¿qué responsabilidades tiene el científico ante lo que crea?`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuál era la obsesión de Víctor Frankenstein?",opciones:["Ser inmortal","Crear vida artificialmente","Descubrir el origen del universo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hizo Víctor cuando la criatura abrió los ojos?",opciones:["La nombró y la aceptó","Huyó horrorizado y la abandonó","La presentó al mundo científico"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué se volvió violenta la criatura?",opciones:["Era malvada por naturaleza","Por estar sola, sin nombre ni familia, y ser rechazada por todos","Así la programó Frankenstein"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuál fue el «verdadero crimen» de Víctor según la criatura?",opciones:["Haberla creado","No haberla destruido a tiempo","No haber asumido la responsabilidad de lo que creó"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué reflexión propone la novela sobre la ciencia?",opciones:["Que la ciencia es siempre peligrosa","Que el científico tiene responsabilidades ante lo que crea","Que crear vida es imposible"],correcta:1},
     {tipo:"abierta",pregunta:"¿Crees que los científicos e inventores tienen responsabilidad sobre cómo se usa lo que crean? Pon un ejemplo actual."},
   ]},
  {id:128,titulo:"El jardín de las palabras olvidadas",nivel:"5º-6º",tipo:"Cuento",icono:"🌺",color:"#DB2777",colorLight:"#FCE7F3",
   intro:"En un jardín mágico crecen las palabras que la gente ha dejado de usar. Una niña llega allí por accidente.",
   texto:`El jardín no aparecía en ningún mapa. Clara llegó a él por error, siguiendo a un gato por un callejón que no recordaba haber visto antes.

Las flores eran palabras: «vericueto», «alborada», «quimera», «menestral», «añoranza»...

Un anciano regaba con una regadera de plata.
—¿Qué lugar es este? —preguntó Clara.
—El jardín de las palabras olvidadas. Cuando las personas dejan de usar una palabra, viene a morir aquí.
—¿Y si alguien la usa de nuevo?
—Vuelve a florecer.

Clara cogió un puñado de semillas del suelo: «crepúsculo», «efímero», «bienandanza»...

Al día siguiente, en clase de lengua, Clara usó cada una de esas palabras. Sus compañeros preguntaron qué significaban.

Y en el jardín del anciano, aquella mañana, florecieron tres flores nuevas.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cómo llegó Clara al jardín?",opciones:["Siguiendo a un gato por un callejón","Por un mapa que encontró en casa","Se lo dijo su abuela"],correcta:0},
     {tipo:"opcion",pregunta:"¿Qué representaban las flores del jardín?",opciones:["Nombres de personas fallecidas","Palabras que la gente había dejado de usar","Recuerdos de momentos felices"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué ocurría cuando alguien dejaba de usar una palabra?",opciones:["Desaparecía para siempre","Venía al jardín a morir","Se convertía en otra palabra"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo hizo florecer Clara tres flores?",opciones:["Regando las flores con agua especial","Usando palabras olvidadas en clase","Plantando semillas que le dio el anciano"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué nos enseña este cuento sobre el lenguaje?",opciones:["Que hay demasiadas palabras en español","Que debemos cuidar el idioma usando las palabras que se van olvidando","Que las palabras nuevas son mejores que las antiguas"],correcta:1},
     {tipo:"abierta",pregunta:"¿Conoces alguna palabra poco usada que te parezca bonita o interesante? ¿Qué significa?"},
   ]},
  {id:129,titulo:"La inteligencia artificial",nivel:"6º",tipo:"Texto informativo",icono:"🧠",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"¿Qué es la inteligencia artificial? ¿Cómo funciona? ¿Cuáles son sus riesgos y oportunidades?",
   texto:`La inteligencia artificial (IA) es la capacidad de las máquinas para realizar tareas que normalmente requieren inteligencia humana: reconocer imágenes, traducir idiomas, escribir textos o tomar decisiones.

La IA funciona aprendiendo de grandes cantidades de datos. Así como un niño aprende qué es un «gato» viendo miles de fotos de gatos, un sistema de IA «aprende» analizando millones de ejemplos.

Las aplicaciones de la IA son enormes. En medicina ayuda a detectar enfermedades en radiografías. En transporte, desarrolla vehículos autónomos. En educación, puede adaptar las actividades al nivel de cada alumno.

Pero la IA también genera preocupaciones: puede perpetuar sesgos si los datos con que aprende contienen prejuicios, puede eliminar empleos de forma masiva, y puede ser usada para crear desinformación.

El desafío de nuestra generación es desarrollar una IA que sea útil, segura y justa para toda la humanidad.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué es la inteligencia artificial?",opciones:["Robots con forma humana","La capacidad de las máquinas de realizar tareas que requieren inteligencia humana","Ordenadores más rápidos que los normales"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo aprende un sistema de IA?",opciones:["Le programamos cada respuesta manualmente","Analizando millones de ejemplos y datos","Copiando directamente el cerebro humano"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué aplicación tiene la IA en medicina?",opciones:["Operar a pacientes de forma autónoma","Detectar enfermedades en radiografías","Fabricar medicamentos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué riesgo plantea el texto sobre los sesgos?",opciones:["Que aprende demasiado rápido","Puede perpetuar prejuicios si los datos de entrenamiento los contienen","Es demasiado cara de desarrollar"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué desafío plantea el texto para nuestra generación?",opciones:["Conseguir que la IA supere a los humanos","Desarrollar IA útil, segura y justa para toda la humanidad","Hacer que la IA sea completamente autónoma"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué te parece más interesante y qué más preocupante de la inteligencia artificial? Razona tu respuesta."},
