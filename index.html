  {id:130,titulo:"El discurso de Gettysburg",nivel:"6º",tipo:"Texto informativo",icono:"🎙️",color:"#1E293B",colorLight:"#F1F5F9",
   intro:"El 19 de noviembre de 1863, Abraham Lincoln pronunció un discurso de dos minutos que cambió la historia de Estados Unidos.",
   texto:`El 19 de noviembre de 1863, el presidente Abraham Lincoln pronunció un breve discurso en el cementerio nacional de Gettysburg (Pensilvania), donde acababa de librarse una de las batallas más sangrientas de la Guerra Civil americana.

El discurso duró apenas dos minutos y contenía 272 palabras. Sin embargo, es considerado uno de los más importantes de la historia, porque redefinió el propósito de la guerra: ya no era solo preservar la Unión, sino erradicar la esclavitud y avanzar hacia una democracia real.

Lincoln comenzó con la famosa frase: «Hace ochenta y siete años, nuestros padres fundaron en este continente una nueva nación, concebida en la libertad y dedicada al principio de que todos los hombres son creados iguales».

Y terminó con un llamamiento que resonó durante décadas: que el gobierno del pueblo, por el pueblo y para el pueblo no desaparecerá de la Tierra.

Irónicamente, el discurso principal de ese día lo dio el orador Edward Everett, que habló durante dos horas. Es completamente olvidado hoy.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Dónde pronunció Lincoln el discurso?",opciones:["En el Capitolio de Washington","En el cementerio nacional de Gettysburg","En la Casa Blanca"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuánto duró el discurso?",opciones:["Veinte minutos","Dos horas","Aproximadamente dos minutos"],correcta:2},
     {tipo:"opcion",pregunta:"¿Por qué es considerado tan importante el discurso?",opciones:["Por su duración récord","Porque redefinió el propósito de la guerra incluyendo el fin de la esclavitud","Porque fue televisado en directo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué frase final del discurso se hizo célebre?",opciones:["«La guerra ha terminado»","El gobierno del pueblo, por el pueblo y para el pueblo","«Todos los hombres son libres»"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué pasó con el discurso del orador principal Edward Everett?",opciones:["También se hizo muy famoso","Fue criticado duramente","Es completamente olvidado hoy"],correcta:2},
     {tipo:"abierta",pregunta:"¿Por qué crees que un discurso de dos minutos puede ser más recordado que uno de dos horas? ¿Qué hace poderoso a un discurso?"},
   ]},
  {id:131,titulo:"Las migraciones humanas",nivel:"6º",tipo:"Texto informativo",icono:"🌍",color:"#0891B2",colorLight:"#CFFAFE",
   intro:"Desde siempre, los seres humanos se han desplazado buscando mejores condiciones de vida. ¿Por qué migran las personas hoy?",
   texto:`La migración —el desplazamiento de personas de un lugar a otro para establecerse en él— es tan antigua como la humanidad misma. Los primeros Homo sapiens emigraron desde África hace unos 70.000 años y colonizaron todos los continentes.

Hoy existen dos grandes tipos de migración: la voluntaria (por trabajo, estudios o calidad de vida) y la forzada (por guerras, persecuciones o catástrofes naturales). Las personas que huyen de persecuciones o conflictos y piden protección en otro país se llaman refugiados.

Según la ONU, en 2023 había más de 110 millones de personas desplazadas por la fuerza en el mundo, la cifra más alta de la historia.

Las migraciones generan retos y oportunidades. Los migrantes aportan trabajo, diversidad cultural y talento a los países de destino. Pero también pueden sufrir discriminación, dificultades de integración y pérdida de sus raíces.

España ha pasado de ser un país de emigración (miles de españoles emigraron a Europa y América en el siglo XX) a ser un país de inmigración.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Desde cuándo llevan migrando los seres humanos?",opciones:["Desde hace 200 años","Desde hace unos 70.000 años","Desde hace 5.000 años"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se llaman las personas que huyen de persecuciones y piden protección en otro país?",opciones:["Inmigrantes económicos","Refugiados","Expatriados"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuántas personas desplazadas por la fuerza había en 2023?",opciones:["Más de 10 millones","Más de 50 millones","Más de 110 millones"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué aportaciones hacen los migrantes a los países de destino?",opciones:["Solo mano de obra barata","Trabajo, diversidad cultural y talento","Problemas de integración únicamente"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuál ha sido la evolución de España respecto a la migración?",opciones:["Siempre ha sido un país receptor","Ha pasado de ser país de emigración a país de inmigración","Siempre ha tenido saldo migratorio neutro"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué crees que siente una persona que tiene que dejar su país, su familia y su idioma para empezar de cero en otro lugar?"},
   ]},
  {id:132,titulo:"El poder de la propaganda",nivel:"6º",tipo:"Texto informativo",icono:"📢",color:"#DC2626",colorLight:"#FEE2E2",
   intro:"La propaganda es una herramienta poderosa para influir en lo que la gente piensa. Aprender a reconocerla es una habilidad fundamental.",
   texto:`La propaganda es el uso sistemático de mensajes —imágenes, textos, discursos— para influir en las opiniones, actitudes y comportamientos de las personas, generalmente en beneficio de quien la emite.

Se diferencia de la publicidad en que suele ocultar su intención persuasiva y presentarse como información objetiva o neutral.

Las técnicas más comunes de propaganda incluyen: la repetición (repetir un mensaje hasta que parezca verdad), la apelación al miedo (exagerar amenazas para que la gente acepte ciertas medidas), la simplificación excesiva (reducir problemas complejos a enemigos simples) y el uso de símbolos emocionales.

La propaganda fue usada masivamente por regímenes totalitarios del siglo XX como el nazismo. Pero también existe en democracias, en política, en publicidad comercial y hoy en día en las redes sociales.

La mejor defensa contra la propaganda es el pensamiento crítico: preguntarse quién emite el mensaje, qué intereses tiene, qué datos ofrece y qué oculta.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿En qué se diferencia la propaganda de la publicidad convencional?",opciones:["La propaganda es más cara","Suele ocultar su intención persuasiva y presentarse como información objetiva","La publicidad no busca persuadir"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué técnica consiste en repetir un mensaje hasta que parezca verdad?",opciones:["Apelación al miedo","La simplificación excesiva","La repetición"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué busca la técnica de «apelación al miedo»?",opciones:["Hacer reír al público","Exagerar amenazas para que la gente acepte ciertas medidas","Mostrar datos estadísticos convincentes"],correcta:1},
     {tipo:"opcion",pregunta:"¿Solo existe la propaganda en regímenes totalitarios?",opciones:["Sí, solo en dictaduras","No, también en democracias, política y redes sociales","Solo en tiempos de guerra"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuál es la mejor defensa contra la propaganda?",opciones:["No leer ni ver noticias","El pensamiento crítico: preguntarse quién emite, qué intereses tiene y qué oculta","Confiar solo en medios oficiales"],correcta:1},
     {tipo:"abierta",pregunta:"¿Puedes pensar en algún ejemplo de mensaje que hayas visto y que usara alguna de estas técnicas? ¿Cómo lo detectarías?"},
   ]},
  {id:133,titulo:"El origen del universo",nivel:"6º",tipo:"Texto informativo",icono:"🌌",color:"#1D4ED8",colorLight:"#DBEAFE",
   intro:"¿Cómo empezó todo? La teoría del Big Bang explica el origen del universo hace 13.800 millones de años.",
   texto:`La teoría más aceptada sobre el origen del universo es el Big Bang: hace unos 13.800 millones de años, toda la materia y energía del universo estaba concentrada en un punto infinitamente pequeño y caliente. En una fracción de segundo, se expandió explosivamente.

En los primeros minutos se formaron los primeros átomos simples: hidrógeno y helio. Durante millones de años, el universo fue oscuro y lleno de gas. Luego, la gravedad agrupó ese gas y formó las primeras estrellas y galaxias.

Las estrellas actúan como hornos nucleares: en su interior fusionan átomos simples y crean elementos más complejos como carbono, oxígeno y hierro. Cuando una estrella explota (supernova), dispersa esos elementos por el espacio.

Todos los átomos que forman tu cuerpo —el carbono de tus células, el hierro de tu sangre, el oxígeno que respiras— fueron forjados en el interior de estrellas que murieron antes de que naciera el Sol.

Somos, literalmente, polvo de estrellas.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Hace cuánto tiempo ocurrió el Big Bang?",opciones:["4.500 millones de años","13.800 millones de años","100.000 millones de años"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué primeros átomos se formaron tras el Big Bang?",opciones:["Carbono y oxígeno","Hierro y nitrógeno","Hidrógeno y helio"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué son las supernovas?",opciones:["Galaxias muy brillantes","Explosiones de estrellas que dispersan elementos por el espacio","Agujeros negros enormes"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué elemento de tu cuerpo proviene de las estrellas?",opciones:["Solo el hierro de la sangre","Todos los átomos: carbono, hierro, oxígeno...","Solo el oxígeno que respiras"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué significa la afirmación «somos polvo de estrellas»?",opciones:["Que somos muy pequeños en el universo","Que los átomos de nuestro cuerpo se forjaron en estrellas antiguas","Que las estrellas son sucias"],correcta:1},
     {tipo:"abierta",pregunta:"¿Cómo te hace sentir saber que los átomos de tu cuerpo fueron creados en el interior de estrellas que murieron hace miles de millones de años?"},
   ]},
  {id:134,titulo:"El juicio de Sócrates",nivel:"6º",tipo:"Texto informativo",icono:"🏛️",color:"#92400E",colorLight:"#FEF3C7",
   intro:"En el año 399 a.C., el filósofo Sócrates fue juzgado en Atenas. Podría haberse salvado, pero eligió morir por sus ideas.",
   texto:`En el año 399 a.C., el filósofo Sócrates fue juzgado en Atenas acusado de corromper a la juventud y no creer en los dioses de la ciudad. Tenía 70 años.

El jurado, formado por 501 ciudadanos atenienses, lo declaró culpable por una pequeña mayoría y lo condenó a muerte.

Sócrates podría haberse salvado: sus amigos organizaron su huida, y sus jueces esperaban que pidiera el exilio. Pero él se negó.

—Si me voy —argumentó— traicionaría las leyes de Atenas, que me han dado todo. Y seguiría enseñando en otro lugar, lo que demuestra que no me arrepiento. Prefiero morir siendo fiel a mí mismo que vivir siendo un cobarde.

Bebió la cicuta —un veneno— y murió rodeado de sus discípulos, entre ellos Platón, que recogió sus enseñanzas.

Hoy Sócrates es símbolo de la integridad intelectual y del valor de anteponer los propios principios a la supervivencia.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿De qué acusaron a Sócrates?",opciones:["De robar dinero público","De corromper a la juventud y no creer en los dioses de la ciudad","De espiar para Persia"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuántos ciudadanos formaban el jurado?",opciones:["12","100","501"],correcta:2},
     {tipo:"opcion",pregunta:"¿Por qué Sócrates se negó a huir?",opciones:["Porque no tenía adónde ir","Porque traicionaría las leyes de Atenas y prefería morir siendo fiel a sí mismo","Porque estaba demasiado enfermo para viajar"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo murió Sócrates?",opciones:["Fue ejecutado en público","Bebió cicuta, un veneno","Murió de vejez en prisión"],correcta:1},
     {tipo:"opcion",pregunta:"¿Quién fue el discípulo que recogió sus enseñanzas?",opciones:["Aristóteles","Platón","Pitágoras"],correcta:1},
     {tipo:"abierta",pregunta:"¿Crees que Sócrates tomó la decisión correcta al no huir? ¿Habrías hecho lo mismo?"},
   ]},
  {id:135,titulo:"La Revolución Industrial",nivel:"6º",tipo:"Texto informativo",icono:"🏭",color:"#475569",colorLight:"#F1F5F9",
   intro:"A finales del siglo XVIII, una serie de inventos transformaron para siempre la forma de trabajar, vivir y relacionarse de los seres humanos.",
   texto:`La Revolución Industrial comenzó en Gran Bretaña hacia 1760 y se extendió por Europa y América durante el siglo XIX. Transformó radicalmente la sociedad: se pasó de una economía agraria y artesanal a una industrial y urbana.

El motor de vapor, perfeccionado por James Watt en 1769, fue su símbolo. Permitió mover máquinas, trenes y barcos con una eficiencia nunca vista.

Las consecuencias fueron profundas. Por un lado, aumentó enormemente la producción y la riqueza. Por otro, las condiciones de los trabajadores eran durísimas: jornadas de 14 horas, trabajo infantil, salarios de miseria y ciudades insalubres.

Esta situación dio lugar al movimiento obrero, que luchó por derechos laborales básicos que hoy damos por sentados: la jornada de 8 horas, el descanso dominical, el salario mínimo y la prohibición del trabajo infantil.

La Revolución Industrial también aceleró la contaminación y el consumo de combustibles fósiles que hoy están en el origen del cambio climático.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Dónde comenzó la Revolución Industrial?",opciones:["Francia","Estados Unidos","Gran Bretaña"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué invento fue el símbolo de la Revolución Industrial?",opciones:["La imprenta","El motor de vapor","El telégrafo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo eran las condiciones de los trabajadores?",opciones:["Muy buenas, con salarios altos","Durísimas: jornadas de 14 horas, trabajo infantil y salarios de miseria","Variables según el tipo de fábrica"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué logró el movimiento obrero?",opciones:["Derribar los gobiernos de la época","Derechos como la jornada de 8 horas, el descanso dominical y el salario mínimo","La desaparición de las fábricas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué consecuencia medioambiental tuvo la Revolución Industrial?",opciones:["Mejoró el medioambiente al reducir la agricultura","Aceleró la contaminación y el consumo de combustibles fósiles","No tuvo consecuencias medioambientales"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué derechos laborales que tenemos hoy crees que no existirían sin la lucha del movimiento obrero?"},
   ]},
  {id:136,titulo:"El experimento de Milgram",nivel:"6º",tipo:"Texto informativo",icono:"⚗️",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"En 1961, el psicólogo Stanley Milgram diseñó un experimento perturbador para entender cómo personas normales pueden obedecer órdenes crueles.",
   texto:`En 1961, el psicólogo Stanley Milgram realizó un experimento en la Universidad de Yale (Estados Unidos) que sacudió al mundo.

Se reclutaron voluntarios que creían participar en un estudio sobre el aprendizaje. Un experimentador con bata blanca les pedía que administraran descargas eléctricas a otra persona (que en realidad era un actor) cada vez que se equivocara. Las descargas supuestamente iban aumentando hasta niveles peligrosos.

El resultado fue inquietante: el 65% de los participantes llegaron al nivel máximo de descarga, obedeciendo al experimentador aunque la «víctima» gritara y pidiera que pararan.

Nadie que participó en el experimento era una persona cruel. Sin embargo, la autoridad de la bata blanca y el entorno institucional hicieron que actuaran de forma que nunca habrían elegido de otro modo.

El experimento se realizó justo después del juicio a Adolf Eichmann, uno de los organizadores del Holocausto, quien argumentó en su defensa que simplemente «cumplía órdenes».

Milgram quiso demostrar que cualquier persona normal puede cometer actos terribles cuando obedece a una autoridad sin cuestionarla.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué creían los voluntarios que estaban estudiando?",opciones:["El comportamiento de los psicólogos","El aprendizaje y la memoria","La resistencia al dolor"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué porcentaje llegó al nivel máximo de descarga obedeciendo?",opciones:["El 20%","El 65%","El 90%"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué elemento institucional influyó más en la obediencia?",opciones:["El salario prometido","La bata blanca del experimentador y el entorno universitario","Las instrucciones escritas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué Milgram diseñó este experimento?",opciones:["Para estudiar el dolor","Para entender cómo personas normales obedecen órdenes crueles sin cuestionarlas","Para mejorar los métodos de enseñanza"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué argumento usó Eichmann en su defensa?",opciones:["Que no sabía lo que estaba haciendo","Que «simplemente cumplía órdenes»","Que actuaba por miedo"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué aprendemos del experimento de Milgram sobre la importancia de pensar críticamente antes de obedecer una orden?"},
   ]},
  {id:137,titulo:"El periodismo de investigación",nivel:"6º",tipo:"Texto informativo",icono:"🗞️",color:"#0D9488",colorLight:"#CCFBF1",
   intro:"Algunos periodistas arriesgan su libertad —y su vida— para sacar a la luz verdades que los poderosos quieren ocultar.",
   texto:`El periodismo de investigación consiste en indagar durante meses o años en asuntos que alguien quiere mantener oculto: corrupción política, crímenes medioambientales, abusos de poder.

A diferencia de la información de actualidad, que cubre hechos del día, el periodismo de investigación requiere acceder a documentos confidenciales, proteger fuentes anónimas y resistir presiones legales o amenazas.

Uno de los casos más famosos fue el escándalo Watergate (1972): los periodistas Bob Woodward y Carl Bernstein descubrieron que el presidente Nixon había ordenado el espionaje a sus rivales políticos. Su investigación obligó a Nixon a dimitir.

Otro ejemplo fue la filtración de los Papeles de Panamá (2016): 11,5 millones de documentos secretos revelaron cómo políticos, empresarios y deportistas de todo el mundo ocultaban dinero en paraísos fiscales.

En muchos países, los periodistas de investigación son encarcelados, amenazados o asesinados. La organización Reporteros Sin Fronteras documenta estas violaciones cada año.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿En qué se diferencia el periodismo de investigación del periodismo de actualidad?",opciones:["El de investigación es más rápido","Requiere meses o años de trabajo en asuntos que alguien quiere ocultar","Solo investiga crímenes"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué descubrieron Woodward y Bernstein en el caso Watergate?",opciones:["Que Nixon había robado documentos secretos","Que Nixon ordenó el espionaje a sus rivales políticos","Que Nixon mentía sobre la guerra de Vietnam"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuántos documentos se filtraron en los Papeles de Panamá?",opciones:["115.000","11,5 millones","1.150"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué revelaron los Papeles de Panamá?",opciones:["Fraudes en elecciones municipales","Cómo políticos y empresarios ocultaban dinero en paraísos fiscales","Casos de corrupción en el deporte"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué organización documenta las agresiones a periodistas?",opciones:["Amnistía Internacional","Reporteros Sin Fronteras","La ONU"],correcta:1},
     {tipo:"abierta",pregunta:"¿Por qué crees que es importante que existan periodistas dispuestos a investigar y publicar verdades incómodas para el poder?"},
   ]},
  {id:138,titulo:"Distopía: 1984",nivel:"6º",tipo:"Cuento",icono:"👁️",color:"#1E293B",colorLight:"#F1F5F9",
   intro:"En la novela 1984 de George Orwell, el Estado lo controla todo: lo que dices, lo que piensas y hasta los recuerdos del pasado.",
   texto:`En la novela 1984, publicada en 1949 por George Orwell, el mundo está dividido en superestados totalitarios gobernados por partidos que controlan absolutamente todo.

El protagonista, Winston Smith, trabaja en el Ministerio de la Verdad, donde su trabajo consiste en reescribir los periódicos históricos para que el pasado siempre coincida con lo que el Partido dice hoy.

El Gran Hermano —el líder supremo— lo vigila todo a través de telepantallas instaladas en cada habitación. Hay una Policía del Pensamiento que persigue cualquier idea contraria al régimen.

Incluso existe el «pensocrim»: el crimen de tener pensamientos prohibidos.

Winston empieza a rebelarse en secreto, escribiendo en un diario y enamorándose de Julia. Sabe que los atraparán. Y así es.

Al final, Winston es torturado hasta que no solo confiesa, sino que sinceramente ya no cree en nada que no sea el Partido.

Orwell escribió esta novela como advertencia: los totalitarismos no controlan solo los cuerpos, sino las mentes.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿En qué trabaja Winston Smith?",opciones:["En la Policía del Pensamiento","En el Ministerio de la Verdad, reescribiendo la historia","En el ejército del Gran Hermano"],correcta:1},
     {tipo:"opcion",pregunta:"¿Para qué sirven las telepantallas?",opciones:["Para entretener a los ciudadanos","Para que el Gran Hermano vigile a todo el mundo","Para transmitir las órdenes del Partido"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué es el «pensocrim»?",opciones:["Un periódico del régimen","El crimen de tener pensamientos prohibidos","El nombre de la prisión del Estado"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo termina la rebelión de Winston?",opciones:["Consigue escapar con Julia","Es ejecutado como mártir","Es torturado hasta creer sinceramente en el Partido"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cuál era la advertencia de Orwell con esta novela?",opciones:["Que la tecnología es peligrosa","Que los totalitarismos controlan no solo los cuerpos sino también las mentes","Que el amor siempre fracasa en las dictaduras"],correcta:1},
     {tipo:"abierta",pregunta:"¿Crees que algunos elementos de 1984 (vigilancia masiva, manipulación de la información) existen hoy en el mundo real? Razona tu respuesta."},
   ]},
  {id:139,titulo:"La energía nuclear",nivel:"6º",tipo:"Texto informativo",icono:"⚛️",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"La energía nuclear puede generar electricidad limpia, pero también armas devastadoras. ¿Es una solución o un problema?",
   texto:`La energía nuclear se obtiene de la fisión del átomo: al dividir el núcleo de un átomo de uranio se libera una enorme cantidad de energía en forma de calor, que se usa para generar electricidad.

Sus defensores señalan que no emite CO₂ durante su funcionamiento, por lo que podría ayudar a combatir el cambio climático. Una central nuclear produce mucha electricidad en poco espacio.

Sus críticos señalan tres problemas graves. Primero, los accidentes: Chernóbil (1986, URSS) y Fukushima (2011, Japón) mostraron que los fallos pueden ser catastróficos para personas y medioambiente. Segundo, los residuos radiactivos son peligrosos durante miles de años y no existe una solución definitiva para almacenarlos. Tercero, la tecnología puede usarse para fabricar armas nucleares.

Actualmente, varios países debaten si construir nuevas centrales nucleares para reducir su dependencia de los combustibles fósiles.

La fusión nuclear —que une átomos en lugar de dividirlos, como hace el Sol— podría ser una fuente de energía prácticamente ilimitada y limpia, pero aún está en fase experimental.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cómo se obtiene la energía nuclear?",opciones:["Quemando uranio como un combustible","Dividiendo el núcleo de átomos de uranio (fisión)","Uniendo átomos de hidrógeno (fusión)"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué ventaja señalan sus defensores frente al cambio climático?",opciones:["Que es baratísima","Que no emite CO₂ durante su funcionamiento","Que no produce ningún tipo de residuo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué accidente nuclear ocurrió en Japón en 2011?",opciones:["Three Mile Island","Chernóbil","Fukushima"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué problema plantean los residuos radiactivos?",opciones:["Que son caros de producir","Son peligrosos durante miles de años y no hay solución definitiva para almacenarlos","Solo son peligrosos en los primeros años"],correcta:1},
     {tipo:"opcion",pregunta:"¿En qué se diferencia la fusión de la fisión nuclear?",opciones:["La fusión es más peligrosa","La fusión une átomos como hace el Sol; la fisión los divide","Solo se diferencian en el tamaño del reactor"],correcta:1},
     {tipo:"abierta",pregunta:"¿Crees que la energía nuclear debería usarse para combatir el cambio climático a pesar de sus riesgos? Argumenta tu posición."},
   ]},
  {id:140,titulo:"El arte de argumentar",nivel:"6º",tipo:"Texto informativo",icono:"💬",color:"#8B5CF6",colorLight:"#EDE9FE",
   intro:"Argumentar bien no es imponer tu opinión a gritos. Es una habilidad que se aprende y que transforma debates en diálogos.",
   texto:`Argumentar es dar razones para defender una postura o persuadir a alguien. Es una de las habilidades más importantes que puede desarrollar una persona.

Un buen argumento tiene tres partes: la tesis (lo que defiendes), los argumentos (las razones que lo apoyan) y la conclusión (el resumen de tu postura).

Existen también las falacias: razonamientos que parecen válidos pero que tienen trampa. Las más comunes son:

• Ad hominem: atacar a la persona en lugar de a su argumento («Lo que dice es falso porque él es un ignorante»).
• Falsa dicotomía: presentar solo dos opciones cuando hay más («O estás conmigo o estás contra mí»).
• Apelación a la mayoría: algo es verdad porque lo cree mucha gente («Todo el mundo lo hace, así que está bien»).
• Hombre de paja: distorsionar el argumento del otro para atacar una versión más débil.

Reconocer falacias en los discursos políticos, en los medios de comunicación y en el día a día es una forma de protegerse de la manipulación.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué es una tesis en un argumento?",opciones:["Las razones que apoyan tu postura","La postura que defiendes","El resumen de tu argumento"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué es una falacia?",opciones:["Un argumento muy técnico","Un razonamiento que parece válido pero tiene trampa","Un tipo de debate formal"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué falacia consiste en atacar a la persona y no a su argumento?",opciones:["Falsa dicotomía","Apelación a la mayoría","Ad hominem"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué es la «falsa dicotomía»?",opciones:["Presentar solo dos opciones cuando hay más","Inventar estadísticas falsas","Usar palabras difíciles para confundir"],correcta:0},
     {tipo:"opcion",pregunta:"¿Por qué es útil reconocer falacias?",opciones:["Para ganar discusiones en clase","Para protegerse de la manipulación en discursos y medios","Para hablar más rápido en debates"],correcta:1},
     {tipo:"abierta",pregunta:"Elige una de las falacias explicadas y pon un ejemplo que hayas escuchado tú en la vida real."},
   ]},
  {id:141,titulo:"El colapso del Imperio Romano",nivel:"6º",tipo:"Texto informativo",icono:"🏛️",color:"#B45309",colorLight:"#FEF3C7",
   intro:"El Imperio Romano dominó el mundo conocido durante siglos. ¿Qué causó su caída en el año 476?",
   texto:`El Imperio Romano de Occidente cayó en el año 476 d.C., cuando el jefe germano Odoacro depuso al último emperador romano, Rómulo Augústulo. Pero la caída no fue un evento repentino: fue el resultado de siglos de debilitamiento.

Los historiadores señalan varias causas. La primera es la expansión excesiva: el Imperio se extendió tanto que se hizo imposible de gobernar y defender. La segunda son las invasiones bárbaras: visigodos, hunos, vándalos y otros pueblos presionaban las fronteras constantemente.

A esto se sumaron la corrupción política (en los últimos 50 años hubo más de 20 emperadores, la mayoría asesinados), la crisis económica (devaluación de la moneda, aumento de impuestos), las epidemias y el colapso del ejército.

Lo llamativo es que el Imperio Romano de Oriente —conocido como Imperio Bizantino— no cayó hasta 1453, casi mil años después.

El fin del Imperio Romano marcó el inicio de la Edad Media y transformó para siempre la historia de Europa.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿En qué año cayó el Imperio Romano de Occidente?",opciones:["376 d.C.","476 d.C.","576 d.C."],correcta:1},
     {tipo:"opcion",pregunta:"¿Quién depuso al último emperador romano?",opciones:["Atila, rey de los hunos","Odoacro, jefe germano","Alarico, rey visigodo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuántos emperadores hubo en los últimos 50 años del Imperio?",opciones:["Más de 20, la mayoría asesinados","Solo 5 o 6","Ninguno, era una república"],correcta:0},
     {tipo:"opcion",pregunta:"¿Cuándo cayó el Imperio Romano de Oriente (Bizancio)?",opciones:["En el año 476","En el año 1000","En el año 1453"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué período histórico comenzó tras la caída de Roma?",opciones:["El Renacimiento","La Edad Media","La Edad Moderna"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué causas de la caída del Imperio Romano te parecen más relevantes? ¿Crees que alguna tiene paralelismos con el mundo actual?"},
   ]},
  {id:142,titulo:"La crisis climática: datos y soluciones",nivel:"6º",tipo:"Texto informativo",icono:"🌡️",color:"#059669",colorLight:"#D1FAE5",
   intro:"Los datos científicos sobre el cambio climático son contundentes. ¿Qué está pasando exactamente y qué podemos hacer?",
   texto:`Según el Panel Intergubernamental de Expertos sobre el Cambio Climático (IPCC), la temperatura media de la Tierra ha aumentado 1,1 °C desde la era preindustrial. Si llega a los 1,5 °C, se producirán daños irreversibles en muchos ecosistemas.

Los datos son preocupantes: los últimos diez años han sido la década más calurosa registrada. Los glaciares retroceden en todo el mundo. Los incendios forestales son más frecuentes e intensos. Las especies se extinguen a un ritmo cien veces superior al natural.

Las principales fuentes de emisiones de gases de efecto invernadero son: la producción de energía (34%), la agricultura y ganadería (24%), la industria (21%) y el transporte (14%).

Las soluciones existen. A escala global: transición a energías renovables, reforestación masiva y agricultura sostenible. A escala individual: reducir el consumo de carne, usar transporte público, comprar menos y mejor, y reducir residuos.

El informe del IPCC de 2023 afirma que aún es posible limitar el calentamiento, pero el margen se estrecha cada año que pasa sin actuar.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuánto ha aumentado la temperatura media de la Tierra?",opciones:["0,5 °C","1,1 °C","2,5 °C"],correcta:1},
     {tipo:"opcion",pregunta:"¿A qué ritmo se extinguen las especies en comparación con lo natural?",opciones:["Al doble","Diez veces más rápido","Cien veces más rápido"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué sector produce más emisiones de gases de efecto invernadero?",opciones:["El transporte","La industria","La producción de energía"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué solución individual menciona el texto?",opciones:["Instalar paneles solares en todas las casas","Reducir el consumo de carne y usar transporte público","No tener hijos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué dice el informe del IPCC de 2023?",opciones:["Que ya es demasiado tarde para actuar","Que aún es posible limitar el calentamiento, pero el margen se estrecha","Que el calentamiento no es tan grave como se pensaba"],correcta:1},
     {tipo:"abierta",pregunta:"¿Cuál de las soluciones mencionadas crees que es más difícil de llevar a cabo? ¿Y la más fácil? ¿Por qué?"},
   ]},
  {id:143,titulo:"El origen de las lenguas",nivel:"6º",tipo:"Texto informativo",icono:"🗣️",color:"#0891B2",colorLight:"#CFFAFE",
   intro:"En el mundo existen unas 7.000 lenguas. ¿De dónde vienen? ¿Por qué unas desaparecen y otras se extienden?",
   texto:`Se calcula que en el mundo existen entre 6.000 y 7.000 lenguas vivas. La mitad de la población mundial habla solo 23 de ellas. Las otras 6.977 las hablan el otro 50%.

Todas las lenguas evolucionan y cambian con el tiempo. El español que hablamos hoy es irreconocible comparado con el latín vulgar del que procede. Y el inglés de Shakespeare es muy diferente del inglés actual.

Muchas lenguas comparten un ancestro común. El español, el francés, el italiano, el portugués, el rumano y el catalán son todas lenguas romances: descienden del latín. El inglés, el alemán y el holandés son lenguas germánicas.

Una lengua muere cuando sus últimos hablantes mueren o dejan de usarla. Actualmente, se estima que una lengua desaparece cada dos semanas.

El español es la segunda lengua del mundo por número de hablantes nativos (más de 500 millones), solo superada por el chino mandarín. Es también la segunda lengua más usada en internet.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuántas lenguas existen aproximadamente en el mundo?",opciones:["Unas 500","Entre 6.000 y 7.000","Más de 20.000"],correcta:1},
     {tipo:"opcion",pregunta:"¿De qué lengua desciende el español?",opciones:["Del griego antiguo","Del latín vulgar","Del árabe"],correcta:1},
     {tipo:"opcion",pregunta:"¿Con qué frecuencia desaparece una lengua?",opciones:["Una al año","Una cada dos semanas","Una cada siglo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué lenguas forman la familia romance junto al español?",opciones:["Alemán, holandés e inglés","Francés, italiano, portugués, rumano y catalán","Ruso, polaco y checo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué posición ocupa el español por número de hablantes nativos?",opciones:["Primera","Segunda, tras el chino mandarín","Tercera"],correcta:1},
     {tipo:"abierta",pregunta:"¿Por qué crees que es importante preservar las lenguas en peligro de extinción aunque solo las hablen unas pocas personas?"},
   ]},
  {id:144,titulo:"El caso del cuadro robado",nivel:"6º",tipo:"Cuento",icono:"🖼️",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"Durante la inauguración de una exposición de arte en Granada, uno de los cuadros más valiosos desaparece. La detective Valeria tiene 24 horas para resolverlo.",
   texto:`La detective Valeria Montero llegó al museo a las siete de la mañana. El cuadro —un óleo del siglo XVII valorado en tres millones de euros— había desaparecido durante la noche.

Las cámaras de seguridad mostraban un corte de cuarenta minutos entre las 2:00 y las 2:40. Alguien sabía dónde estaban las cámaras.

Los tres sospechosos eran el conservador del museo, el técnico de seguridad y la directora de la galería patrocinadora.

Valeria revisó las grabaciones de los días anteriores. Vio al conservador estudiando los ángulos de las cámaras con un bloc de notas. Pero eso no era suficiente.

Luego encontró algo decisivo: el sistema eléctrico del museo tenía un fallo conocido. Solo alguien con acceso al cuadro de mandos podía haberlo activado de forma remota. Solo el técnico tenía ese acceso.

Cuando Valeria presentó las pruebas a la policía, el técnico confesó. El cuadro apareció en un almacén a las afueras de la ciudad.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuánto tiempo duró el corte en las cámaras de seguridad?",opciones:["20 minutos","40 minutos","1 hora"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuántos sospechosos había?",opciones:["Dos","Tres","Cuatro"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hacía el conservador en las grabaciones previas que llamó la atención de Valeria?",opciones:["Miraba el cuadro durante horas","Estudiaba los ángulos de las cámaras con un bloc","Hablaba por teléfono cerca del cuadro"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué prueba decisiva encontró Valeria contra el técnico?",opciones:["Sus huellas en el marco del cuadro","Solo él tenía acceso remoto al cuadro de mandos eléctrico con el fallo conocido","Un testigo que lo vio salir de madrugada"],correcta:1},
     {tipo:"opcion",pregunta:"¿Dónde apareció el cuadro?",opciones:["En el domicilio del técnico","En el aeropuerto","En un almacén a las afueras"],correcta:2},
     {tipo:"abierta",pregunta:"¿Qué método usa Valeria para resolver el caso? ¿Qué importancia tienen las pruebas frente a las sospechas?"},
   ]},
  {id:145,titulo:"El sistema democrático",nivel:"6º",tipo:"Texto informativo",icono:"🗳️",color:"#1D4ED8",colorLight:"#DBEAFE",
   intro:"La democracia es el sistema político que rige en España y muchos países del mundo. ¿Cómo funciona y cuáles son sus pilares?",
   texto:`La democracia (del griego demos, pueblo, y kratos, gobierno) es el sistema político en el que el poder reside en la ciudadanía, que lo ejerce directamente o a través de representantes elegidos mediante elecciones libres.

Los pilares fundamentales de una democracia son: la separación de poderes (legislativo, ejecutivo y judicial), el respeto a los derechos fundamentales, la celebración de elecciones periódicas y libres, y la existencia de una prensa libre.

En España, la Constitución de 1978 estableció el sistema democrático actual tras cuarenta años de dictadura franquista. El Rey es jefe de Estado, pero el poder político real lo ejercen el Parlamento y el Gobierno.

Las democracias actuales enfrentan riesgos: la desinformación y las noticias falsas que manipulan al electorado, la concentración del poder en pocas manos y la abstención de ciudadanos que no participan.

La democracia no es perfecta, pero como dijo Winston Churchill: «Es el peor sistema de gobierno, excepto todos los demás que se han probado».`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué significa etimológicamente la palabra «democracia»?",opciones:["Gobierno de los sabios","Gobierno del pueblo","Gobierno de las leyes"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuáles son los tres poderes en una democracia?",opciones:["Rey, Gobierno y Ejército","Legislativo, ejecutivo y judicial","Estatal, regional y local"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuándo se estableció la democracia actual en España?",opciones:["En 1936","Con la Constitución de 1978","En 1975, con la muerte de Franco"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué riesgo plantea la desinformación para la democracia?",opciones:["Que las elecciones sean más caras","Manipular al electorado con noticias falsas","Que disminuya el número de partidos"],correcta:1},
     {tipo:"opcion",pregunta:"¿A qué hace referencia la frase de Churchill sobre la democracia?",opciones:["Que debe ser mejorada urgentemente","Que es imperfecta pero mejor que todos los demás sistemas conocidos","Que debería ser sustituida por una tecnocracia"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué pueden hacer los jóvenes para participar en la democracia antes de tener edad para votar?"},
   ]},
  {id:146,titulo:"Carta a mi yo del futuro",nivel:"6º",tipo:"Texto funcional",icono:"✉️",color:"#EC4899",colorLight:"#FCE7F3",
   intro:"Un texto creativo y reflexivo: una carta que una alumna de 6º escribe a su versión adulta. ¿Qué le diría?",
   texto:`Santa Fe, 10 de enero de 2025

Querida yo del futuro:

Te escribo desde los 12 años, con la letra un poco torcida y llena de dudas sobre lo que quiero ser.

Ahora mismo me preocupa el examen de matemáticas del jueves y si me va a gustar el instituto. Supongo que tú ya sabes cómo salió todo eso.

Quiero preguntarte: ¿seguimos siendo amigos con Lucía? ¿Acabamos estudiando lo que queríamos? ¿Aprendimos a no rendirse cuando algo se pone difícil?

Espero que hayas viajado. Que hayas aprendido otro idioma. Que sigas queriendo a las mismas personas.

Y si algo salió mal, confío en que supiste levantarte. Porque ahora mismo soy bastante testaruda y no me rindo fácilmente. Espero que eso no haya cambiado.

Te mando un abrazo raro y un poco vergonzoso.

La tú de 12 años`,

     {tipo:"opcion",pregunta:"¿Qué dos preocupaciones inmediatas tiene la autora?",opciones:["La ropa y el viaje de fin de curso","El examen de matemáticas y el instituto","Las notas de inglés y la amistad con Lucía"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué deseos expresa para su futuro?",opciones:["Tener mucho dinero y una casa grande","Haber viajado, aprendido otro idioma y seguir queriendo a las mismas personas","Ser famosa y trabajar en el extranjero"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué rasgo de su personalidad espera que no haya cambiado?",opciones:["Su simpatía y su humor","Su testarudez y que no se rinde fácilmente","Su inteligencia para las matemáticas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué tipo de texto es este?",opciones:["Una redacción de opinión","Una carta formal a una autoridad","Una carta personal y reflexiva a sí misma en el futuro"],correcta:2},
     {tipo:"abierta",pregunta:"Escribe dos o tres líneas de tu propia carta a tu yo del futuro. ¿Qué le preguntarías o le pedirías?"},
   ]},
  {id:147,titulo:"Los agujeros negros",nivel:"6º",tipo:"Texto informativo",icono:"🕳️",color:"#1D4ED8",colorLight:"#DBEAFE",
   intro:"Los agujeros negros son uno de los objetos más misteriosos del universo. ¿Qué son exactamente y qué pasa si te acercas a uno?",
   texto:`Un agujero negro es una región del espacio donde la gravedad es tan intensa que nada —ni siquiera la luz— puede escapar de ella. Se forman cuando una estrella masiva colapsa sobre sí misma al final de su vida.

El límite de un agujero negro se llama horizonte de sucesos. Todo lo que cruza ese límite no puede regresar. Si un astronauta se acercara demasiado, experimentaría un efecto llamado «espaguetificación»: las fuerzas gravitacionales estirarían su cuerpo como un espagueti antes de que ninguna señal de socorro pudiera escapar.

Durante mucho tiempo, los agujeros negros solo existieron en la teoría. La primera imagen directa de un agujero negro fue capturada en 2019 por el Telescopio de Horizonte de Sucesos: era el agujero negro supermasivo del centro de la galaxia M87, a 55 millones de años luz de la Tierra.

En el centro de la Vía Láctea —nuestra galaxia— existe un agujero negro supermasivo llamado Sagitario A*, que tiene una masa cuatro millones de veces mayor que el Sol. Su imagen fue captada en 2022.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cómo se forma un agujero negro?",opciones:["Por la explosión de una supernova","Cuando una estrella masiva colapsa sobre sí misma al final de su vida","Por la colisión de dos planetas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué es el «horizonte de sucesos»?",opciones:["El borde del universo observable","El límite de un agujero negro del que nada puede escapar","La zona más caliente alrededor del agujero"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué es la «espaguetificación»?",opciones:["Un tipo de pasta italiana con forma de agujero","El efecto gravitacional que estiraría un cuerpo como un espagueti","El nombre del primer agujero negro descubierto"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuándo se captó la primera imagen directa de un agujero negro?",opciones:["En 2012","En 2019","En 2022"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se llama el agujero negro del centro de la Vía Láctea?",opciones:["M87","Orión A","Sagitario A*"],correcta:2},
     {tipo:"abierta",pregunta:"¿Qué es lo que más te fascina o te resulta más difícil de entender sobre los agujeros negros?"},
   ]},
  {id:148,titulo:"El precio de las modas",nivel:"6º",tipo:"Texto informativo",icono:"👕",color:"#EC4899",colorLight:"#FCE7F3",
   intro:"Compramos ropa muy barata sin preguntarnos quién la hace y en qué condiciones. El fenómeno de la «moda rápida» tiene un coste humano y ambiental enorme.",
   texto:`La «moda rápida» o fast fashion es un modelo de negocio basado en producir ropa muy barata en grandes cantidades, con colecciones que se renuevan cada pocas semanas. Empresas como Zara, H&M o Shein son sus máximos exponentes.

El precio humano es alto. La mayor parte de la ropa se fabrica en países como Bangladesh, Camboya o Etiopía, donde los trabajadores —en su mayoría mujeres— trabajan en condiciones precarias con salarios muy bajos. En 2013, el derrumbe del edificio Rana Plaza en Bangladesh mató a 1.138 trabajadores de la industria textil.

El precio ambiental también es enorme. La industria de la moda es responsable del 10% de las emisiones globales de CO₂ y usa enormes cantidades de agua: fabricar una sola camiseta de algodón consume 2.700 litros de agua.

Alternativas más sostenibles incluyen comprar ropa de segunda mano, comprar menos pero de mejor calidad y reparar en lugar de tirar.

Preguntarse «¿quién hizo mi ropa?» es el primer paso para consumir de forma más consciente.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué es la «moda rápida»?",opciones:["Ropa deportiva de alta tecnología","Un modelo de negocio de ropa barata con colecciones frecuentes","Moda diseñada por robots en tiempo récord"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué ocurrió en el edificio Rana Plaza en 2013?",opciones:["Una huelga de trabajadores","Un incendio en una fábrica textil","Un derrumbe que mató a 1.138 trabajadores"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué porcentaje de las emisiones globales de CO₂ produce la industria de la moda?",opciones:["El 2%","El 10%","El 25%"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuántos litros de agua se necesitan para fabricar una camiseta de algodón?",opciones:["270 litros","2.700 litros","27.000 litros"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuál de estas es una alternativa sostenible a la moda rápida?",opciones:["Comprar más ropa pero más barata","Comprar ropa de segunda mano y reparar en lugar de tirar","Seguir todas las tendencias de la temporada"],correcta:1},
     {tipo:"abierta",pregunta:"¿Cambiarías tus hábitos de consumo de ropa al saber este tipo de información? ¿Qué harías diferente?"},

  {id:149,titulo:"El discurso de Malala",nivel:"6º",tipo:"Texto informativo",icono:"📚",color:"#D97706",colorLight:"#FEF9C3",

   texto:`Malala Yousafzai nació en 1997 en el Valle de Swat, Pakistán. Desde pequeña, su padre —maestro y activista— le inculcó el amor por el conocimiento.

En 2014, con 17 años, recibió el Premio Nobel de la Paz, convirtiéndose en la persona más joven en recibirlo.

«Un niño, un maestro, un libro y un bolígrafo pueden cambiar el mundo», dijo.`,
