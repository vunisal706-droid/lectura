*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#FEF6E8;min-height:100vh;overflow-x:hidden}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(0.85);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

button:active{transform:scale(0.96)}
textarea,input{font-family:'Nunito',sans-serif}

::-webkit-scrollbar-track{background:#F1F5F9}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}

const LECTURAS_1C = [
  {id:1,titulo:"El asno y el hielo",nivel:"1º",tipo:"Cuento",icono:"🐴",color:"#3B82F6",colorLight:"#DBEAFE",
   intro:"Un burro cansado decide no moverse... ¡pero está sobre un lago helado! ¿Qué pasará?",
   texto:`Era invierno, hacía mucho frío y todos los caminos estaban helados. El asno, que estaba cansado, no se encontraba con ganas para caminar hasta el establo.

—¡Ea, aquí me quedo, ya no quiero andar más! —se dijo, dejándose caer al suelo.

Un hambriento gorrioncillo fue a posarse cerca de su oreja y le dijo:
—Asno, buen amigo, ten cuidado; no estás en el camino, sino en un lago helado.

—¡Déjame, tengo sueño! Y con un largo bostezo, se quedó dormido.

Poco a poco, el calor de su cuerpo comenzó a fundir el hielo hasta que, de pronto, se rompió con un gran chasquido.

El asno despertó al caer al agua y empezó a pedir socorro, pero nadie pudo ayudarlo, aunque el gorrión quiso, pero no pudo.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿En qué época del año ocurrió esta historia?",opciones:["En primavera","En verano","En otoño","En invierno"],correcta:3},
     {tipo:"opcion",pregunta:"¿Por qué todos los caminos estaban helados?",opciones:["Hacía mucho frío","Estaba nevando","Estaba lloviendo"],correcta:0},
     {tipo:"opcion",pregunta:"¿Dónde se quedó dormido el asno?",opciones:["En el camino","En un lago helado","Debajo de un árbol"],correcta:1},
     {tipo:"abierta",pregunta:"¿Por qué el asno no quiso ir a dormir al establo?"},
     {tipo:"opcion",pregunta:"¿Por qué le ocurrió eso al asno?",opciones:["Porque fue caprichoso","Porque fue perezoso","Porque fue dormilón"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué hubieras hecho tú si fueras el gorrión?"},
   ]},
  {id:2,titulo:"Sofía disimula",nivel:"1º",tipo:"Cuento",icono:"⚽",color:"#EC4899",colorLight:"#FCE7F3",
   intro:"A Sofía no se le da bien la gimnasia y decide inventar una excusa. ¿Lo conseguirá?",
   texto:`A Sofía no se le da muy bien la gimnasia. Los juegos de pelota son los que menos le gustan. Casi todos los niños de la clase son más altos y más fuertes que ella. Y siempre lleva las de perder.

Cada vez que toca el balón, le gritan:
—Eres un desastre, Sofía.

Lo de ser un desastre a Sofía no le gusta nada. Así que trama algo.

Antes de la clase de gimnasia se acerca a la señora Ana, que es la profesora, le enseña la pierna, más bien flaca, y le dice:
—No puedo jugar. Me duele aquí.

—¿Te duele mucho? —le pregunta la señora Ana.

Sofía dice que sí con la cabeza, la mar de convencida.
—Entonces será mejor que te quedes en el banquillo.

Sofía está encantada de lo bien que le ha salido. Y desde entonces, a la hora de gimnasia, suele dolerle la pierna. Pero la señora Ana no se lo ha creído del todo.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué clase le gusta menos a Sofía?",opciones:["Matemáticas","Música","Gimnasia"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué juegos son los que menos le gustan?",opciones:["Saltos","Pelotas","Carreras"],correcta:1},
     {tipo:"abierta",pregunta:"¿Por qué crees que los niños le dicen «eres un desastre» a Sofía?"},
     {tipo:"abierta",pregunta:"¿Qué inventa Sofía antes de la clase de gimnasia?"},
     {tipo:"opcion",pregunta:"¿Crees que es verdad que le duele la pierna?",opciones:["Sí, le duele de verdad","No, lo inventa para no jugar","No se sabe"],correcta:1},
     {tipo:"abierta",pregunta:"¿Crees que está bien lo que ha hecho Sofía? ¿Por qué?"},
   ]},
  {id:3,titulo:"El perrito y el hueso",nivel:"1º",tipo:"Cuento",icono:"🐶",color:"#F59E0B",colorLight:"#FEF3C7",
   intro:"Dos perros grandes pelean por un hueso mientras el más pequeño espera su momento.",
   texto:`Érase una vez un perrito que encontró un hueso. Enseguida llegó un perro más grande, que le gruñó, le enseñó los dientes, lo miró con ojos amenazadores y le quitó el hueso. El perro grande quería comerse el hueso. Pero entonces llegó otro perro grande que también quería el hueso.

Los dos perros grandes se pelearon gruñendo, se enseñaron los dientes y se miraron con ojos amenazadores. Se movían en círculo alrededor del hueso y cada uno quería echarle la boca al otro.

Entonces el perrito se metió entre los dos perros grandes, cogió el hueso y salió corriendo. Los dos perros grandes no se dieron cuenta de nada. Seguían corriendo en círculo, gruñendo, enseñándose los dientes y mirándose con ojos amenazadores. ¡Pero ya no había ningún hueso! Porque, a esas alturas, ya se lo había comido el perrito.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué encontró el perrito?",opciones:["Un coche","Un hueso","Un palo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué quería el perro más grande?",opciones:["Comerse el hueso","Jugar con el perrito","Pasear por el parque"],correcta:0},
     {tipo:"opcion",pregunta:"Cuando llegó el segundo perro grande, ¿qué hicieron?",opciones:["Compartieron el hueso","Se retaron gruñendo","No hicieron nada"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué hizo el perrito mientras los dos perros grandes peleaban?"},
     {tipo:"opcion",pregunta:"¿Quién fue más listo en esta historia?",opciones:["El primer perro grande","El segundo perro grande","El perrito pequeño"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cómo hay que resolver los conflictos?",opciones:["Como quiera el más fuerte","Dialogando y con calma","Peleando hasta ganar"],correcta:1},
   ]},
  {id:4,titulo:"El honrado leñador",nivel:"1º",tipo:"Cuento",icono:"🪓",color:"#10B981",colorLight:"#D1FAE5",
   intro:"Un leñador pierde su herramienta en el río. ¿Será honrado cuando la ninfa le ofrezca algo mejor?",
   texto:`Había una vez un pobre leñador que regresaba a su casa después de una jornada de duro trabajo. Al cruzar un puentecillo sobre el río, se le cayó el hacha al agua. Entonces empezó a quejarse tristemente:
—¿Cómo me ganaré el sustento ahora que no tengo hacha?

Al instante, ¡oh, maravilla! una bella ninfa aparecía sobre las aguas y dijo al leñador:
—Espera, buen hombre, traeré tu hacha.

Se hundió en la corriente y poco después aparecía con un hacha de oro entre las manos. El leñador dijo que aquella no era la suya.

Por segunda vez se sumergió la ninfa, para aparecer después con otra hacha de plata.
—Tampoco es la mía —dijo el triste leñador.

Por tercera vez la ninfa buscó bajo el agua. Al aparecer llevaba un hacha de hierro.
—¡Oh, gracias, gracias! ¡Esa es la mía!

—Pero, por decir la verdad, yo te regalo las otras dos. Has preferido ser pobre y no mentir y te mereces un premio.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué trabajo hace un leñador?",opciones:["Cortar árboles","Reparar muebles","Arreglar grifos"],correcta:0},
     {tipo:"opcion",pregunta:"¿Con qué corta los árboles?",opciones:["Con un destornillador","Con un martillo","Con un hacha"],correcta:2},
     {tipo:"abierta",pregunta:"¿Qué le ocurrió al leñador cuando cruzaba el puente?"},
     {tipo:"opcion",pregunta:"¿Cuál era el hacha del leñador?",opciones:["La de oro","La de plata","La de hierro"],correcta:2},
     {tipo:"opcion",pregunta:"¿Mintió el leñador?",opciones:["Sí, dijo que era suya la de oro","No, siempre dijo la verdad","A veces sí y a veces no"],correcta:1},
     {tipo:"abierta",pregunta:"¿Por qué crees que la ninfa le regaló las otras dos hachas?"},
   ]},
  {id:5,titulo:"La señora Luna",nivel:"1º",tipo:"Poema",icono:"🌙",color:"#8B5CF6",colorLight:"#EDE9FE",

bufanda y sombrero.`,

     {tipo:"opcion",pregunta:"¿Hace frío o calor? ¿Cómo lo sabes?",opciones:["Hace frío, porque lleva bufanda","Hace calor, porque sonríe","No se puede saber"],correcta:0},

  {id:6,titulo:"María y Sara",nivel:"1º",tipo:"Texto",icono:"🏊",color:"#06B6D4",colorLight:"#CFFAFE",
   intro:"Dos amigas se reúnen cada mañana de verano a disfrutar juntas.",
   texto:`En verano María y Sara se reúnen en el río todas las mañanas. Las dos amigas nadan, corren, juegan y se ríen mucho. ¡Lo pasan de maravilla!`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Dónde se reúnen María y Sara?",opciones:["En la piscina","En la playa","En el río"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cuándo están juntas?",opciones:["Todo el día","Por las tardes","Por las mañanas"],correcta:2},
     {tipo:"opcion",pregunta:"¿En qué estación están?",opciones:["Primavera","Verano","Otoño","Invierno"],correcta:1},
     {tipo:"opcion",pregunta:"¿Saben nadar María y Sara?",opciones:["Sí","No","Solo una de ellas"],correcta:0},
     {tipo:"opcion",pregunta:"María y Sara son...",opciones:["Una madre y su hija","Dos amigas","Dos hermanas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo pasan el tiempo?",opciones:["Muy aburridas","Muy divertidas","Normal"],correcta:1},
   ]},
  {id:7,titulo:"El tique del supermercado",nivel:"1º",tipo:"Texto funcional",icono:"🛒",color:"#84CC16",colorLight:"#ECFCCB",
   intro:"Un texto funcional diferente: el tique de compra de un supermercado. ¡Atención a todos los datos!",
   texto:`SUPERMERCADO AHORROTODO

   preguntas:[
     {tipo:"opcion",pregunta:"¿A qué corresponde este documento?",opciones:["Es una lista de la compra","Es la cuenta de un restaurante","Es un tique de supermercado","Son ingredientes de una receta"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué producto es el más caro?",opciones:["El queso (3€)","El pescado (5€)","El pollo (4€)"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuáles son los productos más baratos?",opciones:["El queso y los tomates","Los yogures y los huevos (2€ cada uno)","El pollo y el pescado"],correcta:1},

     {tipo:"abierta",pregunta:"¿Cuánto cuestan los tomates? ¿Y los yogures?"},

  {id:8,titulo:"La pastora flautista",nivel:"2º",tipo:"Cuento",icono:"🎶",color:"#EC4899",colorLight:"#FCE7F3",
   intro:"Una pastora encuentra una flauta mágica. ¿La usará para bien o para mal?",
   texto:`Había una vez una joven pastora. Un día se encontró una flauta. Era una flauta mágica que hacía bailar a todo el mundo.

Una tarde, el herrero del pueblo oyó la música de la flauta y empezó a bailar sin poder parar. Se enfadó tanto que dijo a los vecinos que la pastora era una bruja. Entonces, todos decidieron echar del pueblo a la joven.

Pero, antes de irse, la pastora les pidió que le dejaran tocar la flauta. Y en cuanto la oyeron, todos se pusieron a bailar. Los vecinos se lo pasaron tan bien que decidieron que la pastora se quedara en el pueblo con ellos.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cómo era la pastora?",opciones:["Vieja","Joven"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué se encontró la pastora?",opciones:["Una varita mágica","Una flauta mágica","Una trompeta"],correcta:1},
     {tipo:"opcion",pregunta:"¿En qué consistía la magia de la flauta?",opciones:["Paraba los relojes","Dormía a la gente","Hacía bailar a todo el mundo"],correcta:2},
     {tipo:"opcion",pregunta:"¿Por qué se enfadó el herrero?",opciones:["No podía dejar de bailar","Porque era tímido","Porque no le gustaba la música"],correcta:0},
     {tipo:"opcion",pregunta:"¿Qué decidieron los vecinos al final?",opciones:["Que se fuera del pueblo","Que se quedara en el pueblo","Que le quitaran la flauta"],correcta:1},
     {tipo:"abierta",pregunta:"¿Conoces algún otro cuento en el que haya algo mágico? ¿Cuál?"},
   ]},
  {id:9,titulo:"Dámaso el gato",nivel:"2º",tipo:"Cuento",icono:"🐱",color:"#6366F1",colorLight:"#E0E7FF",
   intro:"Un gato de ciudad abandona sus comodidades para buscar aventuras en el campo.",
   texto:`Me llamo Dámaso y soy un gato que abandonó la ciudad. Allí vivía en una bonita casa llena de lujos y comodidades. Tenía una cesta para dormir, leche templada y la mejor comida para gatos. Pero mis dueños me dejaban solo mucho tiempo. Y, la verdad, me aburría un poco. Así que me fui.

Ahora vivo en el campo; aquí la vida es mucho más emocionante. Nunca sé qué voy a comer, pero tengo muchos amigos y… ¡soy libre!`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cómo se llama el gato?",opciones:["Didí","Dámaso","Diligente"],correcta:1},
     {tipo:"opcion",pregunta:"¿Dónde vivía antes el gato?",opciones:["En una casa lujosa y cómoda","Cerca de un contenedor","En los tejados"],correcta:0},
     {tipo:"opcion",pregunta:"¿Qué tenía para dormir?",opciones:["Una cama","Una caja","Una cesta"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cómo era la vida en el campo?",opciones:["Aburrida","Emocionante","Normal"],correcta:1},
     {tipo:"opcion",pregunta:"¿Lo que más le gustaba era...?",opciones:["Comer bien","Estar cómodo","Tener amigos y ser libre"],correcta:2},
     {tipo:"abierta",pregunta:"¿Qué prefieres tú: tener muchas cosas pero estar solo, o tener amigos? ¿Por qué?"},
   ]},
  {id:10,titulo:"El viento y el sol",nivel:"1º-2º",tipo:"Fábula",icono:"☀️",color:"#F59E0B",colorLight:"#FEF3C7",
   intro:"El sol y el viento discuten: ¿quién es más fuerte? Una fábula de Esopo (600 AC).",
   texto:`El sol y el viento discutían para ver quién era el más fuerte. El viento decía:
—¿Ves aquel anciano envuelto en una capa? Te apuesto a que le haré quitar la capa más rápido que tú.

Se ocultó el sol tras una nube y comenzó a soplar el viento, cada vez con más fuerza, hasta ser casi un ciclón. Pero cuanto más soplaba, tanto más se envolvía el hombre en la capa.

Por fin el viento se calmó y se declaró vencido. Y entonces salió el sol y sonrió dulcemente al anciano. No pasó mucho tiempo hasta que el anciano, acalorado, se quitó la capa.

El sol demostró entonces al viento que la suavidad y el amor de los abrazos son más poderosos que la furia y la fuerza.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Quiénes discutían?",opciones:["El viento y el anciano","El anciano y el sol","El viento y el sol"],correcta:2},
     {tipo:"opcion",pregunta:"¿Por qué discutían?",opciones:["Para ver quién era más rápido","Para ver quién era más fuerte","Para ver quién era más alto"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué se quitó la capa el anciano?",opciones:["Tenía fiebre","Se la daba a un amigo","Tenía calor por el sol"],correcta:2},
     {tipo:"opcion",pregunta:"¿Quién fue más listo?",opciones:["El sol","El viento","El anciano"],correcta:0},
     {tipo:"opcion",pregunta:"¿Cómo se sintió el viento al final?",opciones:["Derrotado","Cansado","Asustado"],correcta:0},
     {tipo:"abierta",pregunta:"¿Cuál es la enseñanza de esta fábula?"},
   ]},
  {id:11,titulo:"Los dos amigos y el oso",nivel:"1º-2º",tipo:"Fábula",icono:"🐻",color:"#92400E",colorLight:"#FEF3C7",
   intro:"Una fábula sobre lo que significa ser un verdadero amigo cuando hay peligro.",
   texto:`Érase una vez dos amigos que paseaban por el bosque. De pronto, apareció un oso que quería atacarlos. Uno de ellos se encaramó a un árbol y se escondió, mientras que el otro se quedó en el camino, se dejó caer al suelo y simuló que estaba muerto.

El oso se acercó y lo olfateó, pero él aguantó la respiración, así que el animal pensó que estaba muerto y se fue.

Cuando el oso se alejó, bajó del árbol y preguntó riendo a su compañero:
—¿Qué te decía el oso al oído?

—Me decía que quien abandona a un amigo cuando hay peligro es un cobarde.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Por dónde paseaban los dos amigos?",opciones:["Por el parque","Por la calle","Por el bosque"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué hizo uno de ellos al ver al oso?",opciones:["Salir corriendo","Taparse los ojos","Subirse a un árbol"],correcta:2},
     {tipo:"opcion",pregunta:"¿Y el otro amigo, qué hizo?",opciones:["No hizo nada","Engañó al oso haciéndose el muerto","Se puso a llorar"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se portó el que subió al árbol?",opciones:["Fue un buen amigo","Fue muy valiente","Se portó como un cobarde"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué nos quiere enseñar esta fábula?",opciones:["Que a los amigos no se abandonan","Que el oso es un animal cariñoso","Que los niños no deben ir al bosque"],correcta:0},
     {tipo:"abierta",pregunta:"¿Qué harías tú si un amigo estuviera en peligro?"},
   ]},
  {id:12,titulo:"El pastor mentiroso",nivel:"1º",tipo:"Cuento",icono:"🐑",color:"#059669",colorLight:"#D1FAE5",
   intro:"Pedro es un pastor que miente mucho. ¿Qué pasará cuando nadie le crea?",
   texto:`Pedro era un joven pastor al que le gustaba mucho decir mentiras.

Una mañana, los vecinos oyeron gritar a Pedro:
—¡Socorro! ¡Socorro! ¡El lobo!

Todos corrieron a ayudarlo. Pero cuando llegaron, se lo encontraron riendo a carcajadas.
—Os lo habéis creído. ¡Qué bueno!

Sin embargo, un día el lobo apareció de verdad. Pedro pidió ayuda. Y nadie le hizo caso. Por suerte, el lobo se marchó. Pero, desde entonces, Pedro decidió no volver a mentir más.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué le gustaba hacer a Pedro?",opciones:["Cantar canciones","Decir mentiras","Jugar con los perros"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué gritó Pedro la primera vez?",opciones:["¡Fuego! ¡Fuego!","¡Socorro! ¡El lobo!","¡Un ladrón!"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hicieron los vecinos cuando el lobo apareció de verdad?",opciones:["Fueron a ayudarle","No le hicieron caso","Llamaron a la policía"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué decidió Pedro al final?",opciones:["Seguir mintiendo","No volver a mentir","Irse del pueblo"],correcta:1},
     {tipo:"abierta",pregunta:"¿Por qué los vecinos no le hicieron caso cuando el lobo apareció de verdad?"},
     {tipo:"abierta",pregunta:"¿Has mentido alguna vez? ¿Qué pasó?"},
   ]},
  {id:13,titulo:"El helado de chocolate",nivel:"1º",tipo:"Cuento",icono:"🍦",color:"#D97706",colorLight:"#FEF3C7",
   intro:"A María le encantan los helados de chocolate. Pero hay cosas que no se deben exagerar.",
   texto:`A María le gustan mucho los helados y sus preferidos son los de chocolate. El otro día pasamos por una heladería y se tomó dos tarrinas de las grandes. Por la noche le dolió tanto la barriga que no le quedaron ganas de tomar más helados de chocolate.`,
   preguntas:[
     {tipo:"abierta",pregunta:"¿Quién es la protagonista de la historia?"},
