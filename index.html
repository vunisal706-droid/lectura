  {id:53,titulo:"El vendedor de gorras",nivel:"3º-4º",tipo:"Cuento",icono:"🧢",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"Un vendedor ambulante descansa bajo un árbol y se queda dormido. Cuando despierta, las gorras han desaparecido...",
   texto:`Un vendedor ambulante cargaba sobre su cabeza una gran torre de gorras de todos los colores. Era un día caluroso y, al llegar a un frondoso árbol, decidió descansar a su sombra.

Se quedó dormido. Al despertar, la torre de gorras había desaparecido. Miró a su alrededor sin entender nada. Entonces levantó la vista... ¡y vio a docenas de monos en las ramas, cada uno con una gorra puesta!

El vendedor intentó de todo para recuperarlas. Gritó, agitó los brazos, les señaló con el dedo... Los monos le imitaban en todo.

De pronto, furioso, el vendedor se quitó su propia gorra y la lanzó al suelo. Los monos, como siempre, lo imitaron: se quitaron todas las gorras y las tiraron al suelo.

El vendedor recogió sus gorras, sonrió y continuó su camino.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Por qué se quedó dormido el vendedor?",opciones:["Era muy perezoso","Hacía calor y se sentó a descansar a la sombra","Alguien le puso algo en la comida"],correcta:1},
     {tipo:"opcion",pregunta:"¿Quiénes se habían llevado las gorras?",opciones:["Unos niños del pueblo","Los monos del árbol","El viento las había esparcido"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hacían los monos cuando el vendedor gesticulaba?",opciones:["Se escapaban más lejos","Le ignoraban","Le imitaban en todo"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cómo recuperó sus gorras el vendedor?",opciones:["Trepando al árbol","Tirando su propia gorra al suelo para que los monos le imitaran","Pidiendo ayuda a unos aldeanos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué cualidad demostró el vendedor al final?",opciones:["Fuerza física","Ingenio y astucia","Rapidez"],correcta:1},
     {tipo:"abierta",pregunta:"¿Se te ocurre otra solución para recuperar las gorras sin usar el truco de la imitación?"},
   ]},
  {id:54,titulo:"La cigüeña y el zorro",nivel:"3º",tipo:"Fábula",icono:"🦩",color:"#EC4899",colorLight:"#FCE7F3",
   intro:"El zorro invita a cenar a la cigüeña... pero le prepara una trampa. La cigüeña no se quedará sin vengarse.",
   texto:`Un día, el zorro invitó a cenar a la cigüeña. Preparó una sabrosa sopa y la sirvió en un plato llano. Él la tomó sin dificultad, pero la cigüeña, con su largo pico, no pudo comer ni una gota. El zorro se reía por lo bajo.

Unos días después, la cigüeña invitó al zorro a cenar. Preparó una deliciosa comida y la sirvió en una jarra de cuello muy largo y estrecho. La cigüeña comió tranquilamente con su pico largo, pero el zorro no pudo meter el hocico y se fue a casa con el estómago vacío.

Así aprendió el zorro que quien hace trampas, tarde o temprano las recibe de vuelta.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué trampa le hizo el zorro a la cigüeña?",opciones:["Le sirvió comida envenenada","Le sirvió sopa en un plato llano que ella no podía comer","No la dejó entrar en su casa"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se vengó la cigüeña?",opciones:["Diciéndoselo a todos los animales","Sirviéndole la comida en una jarra de cuello largo","No quiso vengarse"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué no pudo comer el zorro en casa de la cigüeña?",opciones:["No le gustaba la comida","No cabía en la silla","Su hocico no cabía en la jarra de cuello estrecho"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cómo se sintió el zorro la primera vez?",opciones:["Avergonzado","Triste y hambriento","Satisfecho y burlón"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cuál es la moraleja?",opciones:["Hay que ser muy hábil con el pico","Quien hace trampas, tarde o temprano las recibe de vuelta","Los zorros son muy inteligentes"],correcta:1},
     {tipo:"abierta",pregunta:"¿Has vivido alguna situación en la que alguien haya recibido «lo mismo que dio»? ¿Qué pasó?"},
   ]},
  {id:55,titulo:"El elefante encadenado",nivel:"4º",tipo:"Cuento",icono:"🐘",color:"#6366F1",colorLight:"#E0E7FF",
   intro:"Un elefante enorme está atado a una pequeña estaca. ¿Por qué no se escapa si puede hacerlo fácilmente?",
   texto:`En un circo había un elefante enorme atado con una cadena a una pequeña estaca clavada en el suelo. Cualquiera podía ver que el animal era capaz de arrancarla con un solo movimiento, pero no lo hacía.

Un niño le preguntó a su padre:
—Papá, ¿por qué ese elefante tan grande no se escapa?

El padre respondió:
—Cuando era pequeño, lo ataron con esa misma cadena. Entonces era débil y, por más que lo intentó, no pudo soltarse. Con el tiempo dejó de intentarlo. Ahora cree que la cadena puede con él, aunque ya no sea así.

El niño se quedó pensativo. El elefante no estaba preso por la cadena, sino por el recuerdo de cuando no podía. Su verdadera cadena estaba en su mente.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Por qué no se escapaba el elefante?",opciones:["Porque le encantaba el circo","Porque creía que seguía sin poder, aunque ya era fuerte","Porque tenía miedo del domador"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuándo lo encadenaron por primera vez?",opciones:["Cuando ya era adulto y grande","Cuando era pequeño y débil","Nunca estuvo encadenado antes"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué significaba realmente la cadena?",opciones:["Una limitación física real","Una creencia en su mente de que no podía liberarse","Una cadena de oro muy valiosa"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué le explica el padre al niño?",opciones:["Que los elefantes son tontos","Que el elefante está preso por su propio recuerdo de fracaso","Que las estacas son muy resistentes"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué nos enseña este cuento?",opciones:["Que los elefantes no deben ir al circo","Que nuestras creencias pueden limitarnos aunque no sean reales","Que las cadenas son muy fuertes"],correcta:1},
     {tipo:"abierta",pregunta:"¿Tienes alguna «cadena» en tu mente, algo que crees que no puedes hacer aunque quizás sí podrías? Cuéntalo."},
   ]},
  {id:56,titulo:"El gigante egoísta",nivel:"4º",tipo:"Cuento",icono:"🌸",color:"#0891B2",colorLight:"#CFFAFE",
   intro:"Un gigante tiene un jardín precioso, pero no deja entrar a los niños. Las consecuencias son inesperadas.",
   texto:`Había una vez un gigante que tenía el jardín más hermoso del mundo. Cuando regresó de un largo viaje, encontró a los niños del pueblo jugando en él.

—¡Mi jardín es mío! ¡Fuera de aquí! —rugió.

Construyó un enorme muro y puso un cartel: PROHIBIDO ENTRAR. Llegó la primavera y las flores brotaron en todos los jardines del pueblo, pero en el del gigante continuaba el invierno. Los pájaros no cantaban allí. La nieve cubría el césped y el hielo adornaba los árboles.

Un día, el gigante vio por la ventana que los niños habían encontrado un agujero en el muro y habían entrado. Donde ellos jugaban, los árboles florecían.

Entonces el gigante comprendió su error. Derribó el muro y, desde aquel día, el jardín fue de todos. La primavera volvió para siempre.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Por qué construyó el muro el gigante?",opciones:["Para proteger las flores","Para no dejar entrar a los niños","Para que el viento no lo estropeara"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué le pasó al jardín cuando el gigante echó a los niños?",opciones:["Floreció más que nunca","Se quedó en un eterno invierno","Se llenó de malas hierbas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué pasó donde los niños jugaban?",opciones:["Los árboles se rompían","Los árboles florecían","Crecía la nieve"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hizo el gigante cuando comprendió su error?",opciones:["Hizo el muro más alto","Vendió el jardín","Derribó el muro y lo compartió con todos"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué nos enseña este cuento?",opciones:["Los jardines necesitan mucho cuidado","La alegría y la generosidad traen vida a nuestro alrededor","Los gigantes son malos"],correcta:1},
     {tipo:"abierta",pregunta:"¿Conoces a alguien que sea como el gigante al principio? ¿Cómo cambiarías esa situación?"},
   ]},
  {id:57,titulo:"Las hormigas",nivel:"3º",tipo:"Texto informativo",icono:"🐜",color:"#D97706",colorLight:"#FEF9C3",
   intro:"Las hormigas son animales sorprendentes. Descubre su increíble organización y sus curiosidades.",
   texto:`Las hormigas son insectos que viven en colonias formadas por miles o incluso millones de individuos. Cada hormiga tiene una función dentro de la colonia.

La reina es la única que pone huevos. Las obreras construyen el hormiguero, buscan comida y cuidan las larvas. Los machos solo viven unos días y su única función es fecundar a la reina.

Las hormigas se comunican mediante sustancias químicas llamadas feromonas. Por eso, cuando una hormiga encuentra comida, las demás siguen el rastro que ha dejado.

Son capaces de cargar objetos que pesan hasta cincuenta veces más que ellas. Si un ser humano tuviera esa fuerza, podría levantar un coche con una sola mano.

Las hormigas llevan más de cien millones de años en la Tierra y han sobrevivido a las mismas condiciones que extinguieron a los dinosaurios.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué función tiene la reina en la colonia?",opciones:["Buscar comida","Construir el hormiguero","Poner huevos"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cómo se comunican las hormigas entre sí?",opciones:["Con sonidos","Con feromonas","Con gestos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuánto peso pueden cargar las hormigas en proporción a su cuerpo?",opciones:["El doble de su peso","Diez veces su peso","Hasta cincuenta veces su peso"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cuánto tiempo llevan las hormigas en la Tierra?",opciones:["Un millón de años","Más de cien millones de años","Diez mil años"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué tienen en común las hormigas y los humanos?",opciones:["Que son insectos","Que organizan la sociedad con diferentes funciones","Que también ponen huevos"],correcta:1},
     {tipo:"abierta",pregunta:"¿Cuál de los datos sobre las hormigas te ha parecido más sorprendente? ¿Por qué?"},
   ]},
  {id:58,titulo:"El molinero, su hijo y el asno",nivel:"4º",tipo:"Fábula",icono:"🫏",color:"#F59E0B",colorLight:"#FEF3C7",
   intro:"Un padre y su hijo salen con su asno al mercado. Pero todos los que se encuentran tienen una opinión diferente...",
   texto:`Un molinero y su hijo llevaban su asno al mercado. Al poco de salir se cruzaron con unas mujeres que exclamaron:
—¡Qué tontería llevar el asno sin montarlo!

El padre montó al niño en el asno. Más adelante, un grupo de hombres les gritó:
—¡Sinvergüenza de chico! ¡Su pobre padre a pie y él tan cómodo!

El padre bajó al niño y montó él. Después, unos aldeanos les dijeron:
—¡Qué hombre tan cruel! El niño va andando y él tan tranquilo.

Entonces los dos montaron juntos. Y una mujer les reprendió:
—¡Miren qué pena de animal, cargando con los dos!

El padre y el hijo se bajaron y siguieron a pie. La gente se rió de ellos:
—¡Mirad a ese par de tontos! ¡Tienen un asno y van a pie!

El molinero miró a su hijo y le dijo:
—¿Ves, hijo? Si tratas de complacer a todo el mundo, no complacerás a nadie. Haz lo que tu conciencia te dicte.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Con quién iban al mercado el molinero y su hijo?",opciones:["Con un caballo","Con un burro/asno","Con un carro de bueyes"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuántas opiniones diferentes recibieron por el camino?",opciones:["Dos","Tres","Cuatro"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué consiguieron haciendo caso a todo el mundo?",opciones:["Que todos estuvieran contentos","Que nadie estuviera contento","Que llegaran antes al mercado"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué consejo le dio el padre al hijo?",opciones:["Que no hablara con desconocidos","Que hiciera lo que su conciencia le dictara","Que montara siempre en el asno"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué nos enseña esta fábula?",opciones:["Que es mejor ir siempre a pie","Que no se puede complacer a todo el mundo; hay que escuchar la propia conciencia","Que los burros son muy útiles"],correcta:1},
     {tipo:"abierta",pregunta:"¿Alguna vez has cambiado de opinión por presión de los demás? ¿Cómo te sentiste?"},
   ]},
  {id:59,titulo:"La paloma y la hormiga",nivel:"3º",tipo:"Fábula",icono:"🕊️",color:"#0D9488",colorLight:"#CCFBF1",
   intro:"Una hormiga a punto de ahogarse y una paloma que la salva. ¿Cómo pagará la hormiga ese favor?",
   texto:`Una hormiga tenía mucha sed y bajó a beber a un arroyo. La corriente era tan fuerte que la arrastró y estuvo a punto de ahogarse.

Una paloma que descansaba en un árbol cercano la vio en peligro. Arrancó una hoja y la dejó caer al agua. La hormiga trepó a ella y se salvó.

Poco tiempo después, un cazador apuntaba con su escopeta a la paloma. La hormiga, que lo vio, le picó con fuerza en el pie. El cazador dio un grito de dolor y el disparo falló. La paloma escapó volando.

La buena acción siempre se ve recompensada.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué le ocurrió a la hormiga en el arroyo?",opciones:["Se cayó y estuvo a punto de ahogarse","Encontró mucha comida","Se perdió y no encontraba su camino"],correcta:0},
     {tipo:"opcion",pregunta:"¿Cómo salvó la paloma a la hormiga?",opciones:["Cogiéndola con el pico","Tirándole una hoja para que se subiera","Avisando a otros animales"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué iba a hacer el cazador?",opciones:["Atrapar a la hormiga","Disparar a la paloma","Pescar en el arroyo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo devolvió el favor la hormiga?",opciones:["Guardando comida para la paloma","Picando al cazador en el pie para que fallara el disparo","Avisando a la paloma con sus feromonas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuál es la moraleja?",opciones:["Las palomas deben huir siempre de los cazadores","La buena acción siempre se ve recompensada","Las hormigas son más valientes que las palomas"],correcta:1},
     {tipo:"abierta",pregunta:"¿Recuerdas algún momento en que alguien te ayudó y luego tú pudiste ayudarle a él? Cuéntalo."},
   ]},
  {id:60,titulo:"El globo rojo",nivel:"3º",tipo:"Cuento",icono:"🔴",color:"#EF4444",colorLight:"#FEE2E2",
   intro:"Marcos recibe un globo rojo muy especial en su cumpleaños. Pero cuando lo suelta por accidente, empieza una aventura.",
   texto:`El día de su cumpleaños, el abuelo de Marcos le regaló un globo rojo enorme. Era el más bonito que Marcos había visto en su vida.

Por la tarde, mientras jugaba en el jardín, el globo se le escapó de la mano y subió y subió hasta perderse entre las nubes. Marcos se quedó mirando el cielo con los ojos húmedos.

Al día siguiente, una niña llamada Lucía llamó a su puerta.
—Hola. Tu globo aterrizó en nuestro jardín. Aquí lo tienes.

Marcos la miró sorprendido. El globo aún tenía aire.
—¿De dónde eres? —le preguntó.
—Vivo en la calle de atrás —respondió ella—. ¿Quieres jugar?

Marcos sonrió. El globo le había regalado algo mucho mejor que él mismo: una amiga nueva.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Quién le regaló el globo a Marcos?",opciones:["Su madre","Su mejor amigo","Su abuelo"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué le pasó al globo?",opciones:["Se pinchó con una rama","Se le escapó de la mano y voló","Lo regaló a otro niño"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se llamaba la niña que devolvió el globo?",opciones:["Laura","Lucía","Luna"],correcta:1},
     {tipo:"opcion",pregunta:"¿Dónde había aterrizando el globo?",opciones:["En el tejado de un edificio","En el jardín de Lucía","En la copa de un árbol"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué le regaló el globo a Marcos sin él saberlo?",opciones:["Dinero para comprar otro","Una aventura en el cielo","Una amiga nueva"],correcta:2},
     {tipo:"abierta",pregunta:"¿Has conocido alguna vez a alguien nuevo de forma inesperada? ¿Cómo fue?"},
   ]},
  {id:61,titulo:"La rana que quería ser toro",nivel:"3º",tipo:"Fábula",icono:"🐸",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"Una rana ve a un toro enorme y quiere ser tan grande como él. ¿Lo conseguirá?",
   texto:`Una rana que vivía en el borde de una laguna vio un día pasar a un enorme toro.

—¡Qué grande es! —dijo con admiración—. ¡Yo también quiero ser tan grande!

Y empezó a hincharse de aire. Se hinchó y se hinchó cuanto pudo y preguntó a sus compañeras:
—¿Soy ya tan grande como el toro?
—No, rana, ni de lejos —respondieron.

Se hinchó más todavía.
—¿Y ahora?
—Todavía no.

La rana siguió hinchándose con tanta fuerza que, de pronto, ¡PUM!, reventó.

Querer aparentar lo que no se es puede tener malas consecuencias. Cada uno debe sentirse orgulloso de lo que es.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué quería la rana?",opciones:["Volar como un pájaro","Ser tan grande como el toro","Vivir en el bosque"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo intentó la rana ser más grande?",opciones:["Comiendo mucho","Hinchándose de aire","Saltando todo el tiempo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué le pasó a la rana al final?",opciones:["Se cayó al agua","Se quedó dormida","Reventó de tanto hincharse"],correcta:2},
     {tipo:"opcion",pregunta:"¿Por qué le ocurrió eso a la rana?",opciones:["Por querer aparentar ser lo que no era","Por comer demasiadas moscas","Por acercarse demasiado al toro"],correcta:0},
     {tipo:"opcion",pregunta:"¿Qué moraleja tiene esta fábula?",opciones:["Los toros son muy grandes","Cada uno debe sentirse orgulloso de lo que es","Las ranas deben hacer ejercicio"],correcta:1},
     {tipo:"abierta",pregunta:"¿Crees que es importante ser auténtico y no aparentar ser lo que no eres? Explica tu respuesta."},
   ]},
  {id:62,titulo:"Una carta para mamá",nivel:"3º",tipo:"Texto funcional",icono:"✉️",color:"#EC4899",colorLight:"#FCE7F3",
   intro:"Un texto funcional muy especial: una carta que Carlos escribe a su madre desde el campamento.",
   texto:`Santa Fe, 15 de julio

Querida mamá:

Te escribo desde el campamento de verano. Llevamos tres días aquí y la verdad es que me lo estoy pasando genial, aunque el primer día lloré un poco porque te echaba de menos.

Hemos hecho senderismo por el monte y hemos visto un águila de verdad volando. Esta noche hacemos una excursión nocturna para ver las estrellas con un telescopio. ¡Dicen que podremos ver Saturno!

Mi compañero de tienda se llama Álvaro y es muy divertido. Ya somos amigos.

La comida no está tan buena como la tuya, pero tampoco está tan mal.

Te mando muchos besos. Dile a papá que le echo de menos.

Un abrazo muy fuerte,
Carlos`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Desde dónde escribe Carlos la carta?",opciones:["Desde casa de su abuela","Desde el campamento de verano","Desde el colegio"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se sintió Carlos el primer día?",opciones:["Muy contento desde el principio","Lloró porque echaba de menos a su madre","Se aburrió mucho"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué animal vieron durante el senderismo?",opciones:["Un lobo","Un zorro","Un águila"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué harán esa noche?",opciones:["Un partido de fútbol","Una excursión nocturna para ver las estrellas","Una obra de teatro"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se llama el compañero de tienda de Carlos?",opciones:["Alberto","Álvaro","Adrián"],correcta:1},
     {tipo:"abierta",pregunta:"Si tuvieras que escribir una carta desde un campamento, ¿qué contarías? Escribe dos o tres frases."},
   ]},
  {id:63,titulo:"El pozo de los deseos",nivel:"4º",tipo:"Cuento",icono:"🪙",color:"#F59E0B",colorLight:"#FEF3C7",
   intro:"En el centro del pueblo hay un pozo mágico. Dicen que si tiras una moneda y pides un deseo, se cumple. Pero hay una condición...",
   texto:`En el centro de un pequeño pueblo había un pozo muy antiguo. Los abuelos decían que tenía poderes mágicos: si tirabas una moneda y pedías un deseo, se cumplía. Pero había una condición que nadie conocía hasta que el deseo se hacía realidad.

Un día llegó al pueblo una niña llamada Vera. Tenía un solo deseo: que su abuela enferma se curara. Cerró los ojos, tiró la moneda y lo pidió con toda su alma.

Al volver a casa, encontró a su abuela sentada en el jardín, con mejor color en las mejillas.

Pasaron los días y Vera no entendía cuál era la condición del pozo. Fue a preguntarle a la persona más anciana del pueblo, que le dijo:

—La condición es sencilla: el pozo solo concede deseos a quien desea algo para los demás, no para sí mismo.

Vera sonrió. Ella ni siquiera lo había pensado.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué decían los abuelos sobre el pozo?",opciones:["Que era muy profundo y peligroso","Que tenía poderes mágicos y concedía deseos","Que guardaba un tesoro en el fondo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué pidió Vera al pozo?",opciones:["Mucho dinero","Que su abuela enferma se curara","Tener muchos amigos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Se cumplió el deseo de Vera?",opciones:["No, el pozo no tenía poderes reales","Sí, su abuela mejoró","Solo a medias"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuál era la condición del pozo?",opciones:["Solo concedía deseos a los adultos","Solo concedía deseos a quien deseaba algo para los demás","Había que tirar tres monedas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué se le concedió el deseo a Vera?",opciones:["Porque era muy rica","Porque deseó algo para otro, no para sí misma","Porque conocía el secreto del pozo"],correcta:1},
     {tipo:"abierta",pregunta:"Si pudieras pedir un deseo para otra persona, ¿qué pedirías y para quién? ¿Por qué?"},
   ]},
  {id:64,titulo:"El volcán",nivel:"4º",tipo:"Texto informativo",icono:"🌋",color:"#DC2626",colorLight:"#FEE2E2",
   intro:"¿Sabes cómo funciona un volcán por dentro? Un texto científico sobre uno de los fenómenos más espectaculares de la Tierra.",
   texto:`Un volcán es una abertura en la corteza terrestre por la que salen materiales del interior de la Tierra: lava, gases y cenizas.

En el interior de la Tierra existe una capa llamada manto, donde las rocas se funden por el calor y forman magma. Cuando la presión es muy grande, el magma asciende a través de grietas y sale al exterior. Una vez fuera, recibe el nombre de lava.

Los volcanes pueden ser activos, si han hecho erupción recientemente o podrían hacerlo; dormidos, si llevan mucho tiempo sin erupcionar pero podrían despertar; y extintos, si ya no pueden volver a hacer erupción.

El país con más volcanes activos del mundo es Indonesia. En España también existen volcanes, principalmente en las Islas Canarias, donde el Teide, en Tenerife, es el más alto de España y el tercero más alto del mundo medido desde su base en el fondo del océano.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué es el magma?",opciones:["El gases que salen del volcán","Las rocas fundidas del interior de la Tierra","La lava ya enfriada"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se llama el magma cuando sale al exterior?",opciones:["Vapor","Lava","Ceniza"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se llama un volcán que lleva mucho tiempo sin erupcionar pero podría hacerlo?",opciones:["Activo","Extinto","Dormido"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué país tiene más volcanes activos?",opciones:["España","Indonesia","Italia"],correcta:1},
     {tipo:"opcion",pregunta:"¿Dónde está el Teide?",opciones:["En Mallorca","En Tenerife (Islas Canarias)","En el País Vasco"],correcta:1},
     {tipo:"abierta",pregunta:"¿Te gustaría visitar un volcán algún día? ¿Por qué?"},
   ]},
  {id:65,titulo:"Manolito Gafotas en el colegio",nivel:"3º-4º",tipo:"Cuento",icono:"👓",color:"#3B82F6",colorLight:"#DBEAFE",
   intro:"Manolito llega al colegio con sus gafas nuevas. Sus compañeros tienen mucho que decir...",
   texto:`El primer día que Manolito llegó al colegio con sus gafas nuevas, todo el mundo se quedó mirándole. Las gafas eran grandes, redondas y con montura negra.

—Parecen los ojos de una mosca —dijo el Orejones.
—O un buceador —añadió Yihad.

Manolito se puso colorado hasta las orejas. Pero entonces la señorita Asunción dijo:
—Qué bien, Manolito. Ahora verás la pizarra perfectamente. ¿Sabéis que hay personas que no pueden permitirse unas gafas? Tener gafas es un privilegio.

Durante el recreo, el Imbécil —que así llamaban al hermano pequeño de Manolito— le dijo:
—A mí me gustan tus gafas, Manolito. Parecen las de un científico.

Manolito se las ajustó en la nariz y sonrió. Al final, lo de parecerse a un científico no estaba tan mal.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Por qué se quedó colorado Manolito?",opciones:["Porque había corrido mucho","Porque sus compañeros se burlaron de sus gafas","Porque sacó mala nota"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué dijo la señorita Asunción sobre las gafas?",opciones:["Que eran muy feas","Que tener gafas era un privilegio","Que Manolito debería cambiarlas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Quién animó a Manolito durante el recreo?",opciones:["El Orejones","Yihad","El Imbécil, su hermano pequeño"],correcta:2},
     {tipo:"opcion",pregunta:"¿A qué dijo el Imbécil que se parecía con las gafas?",opciones:["A un superhéroe","A un científico","A un marinero"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo terminó sintiéndose Manolito?",opciones:["Triste y avergonzado","Enfadado con sus compañeros","Mejor, sonriendo ante el comentario de su hermano"],correcta:2},
     {tipo:"abierta",pregunta:"¿Alguna vez alguien se ha burlado de ti por algo? ¿Cómo lo superaste?"},
   ]},
  {id:66,titulo:"El árbol generoso",nivel:"4º",tipo:"Cuento",icono:"🌳",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"Un árbol lo da todo por el niño que quiere. ¿Puede ser demasiado generoso alguien?",
   texto:`Había una vez un árbol que quería a un niño con todo su corazón. El niño jugaba entre sus ramas cada día y el árbol era feliz.

Pero el niño fue creciendo. Un día llegó y dijo:
—Necesito dinero.
—No tengo dinero —dijo el árbol—. Pero puedes coger mis manzanas y venderlas.

El hombre cogió las manzanas y se fue. El árbol fue feliz.

Tiempo después, el hombre volvió y dijo que necesitaba una casa. El árbol le ofreció sus ramas para construirla.

Años más tarde, el hombre regresó viejo y cansado. El árbol le dijo:
—Ya no me queda casi nada que darte. Solo tengo este viejo tronco.
—Con eso me basta —dijo el hombre—. Solo necesito un lugar donde descansar.

Se sentó sobre el tocón. El árbol fue feliz de nuevo. A veces lo que más se necesita no son las grandes cosas, sino simplemente estar.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué dio primero el árbol al niño cuando necesitaba dinero?",opciones:["Sus ramas para madera","Sus manzanas para vender","Sus hojas para hacer papel"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué usó el hombre para construir una casa?",opciones:["Las raíces del árbol","Las ramas del árbol","Las manzanas del árbol"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué le quedaba al árbol al final?",opciones:["Solo las raíces","Solo el tronco viejo","Todavía tenía muchas ramas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué necesitaba el hombre cuando era ya anciano?",opciones:["Más dinero y manzanas","Un barco para navegar","Solo un lugar donde descansar"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cuándo era feliz el árbol?",opciones:["Solo cuando tenía hojas y frutos","Cuando podía dar algo al niño/hombre","Solo cuando era primavera"],correcta:1},
     {tipo:"abierta",pregunta:"¿Crees que el árbol fue demasiado generoso? ¿Qué opinas de su actitud?"},
   ]},

  {id:68,titulo:"El principio de Arquímedes",nivel:"4º",tipo:"Texto informativo",icono:"🛁",color:"#0891B2",colorLight:"#CFFAFE",
   intro:"¿Cómo descubrió Arquímedes uno de los principios más importantes de la física? ¡Con una bañera y un gran grito!",
   texto:`Hace más de dos mil años, en la ciudad griega de Siracusa, vivía un sabio llamado Arquímedes. El rey Hierón le encargó averiguar si su nueva corona de oro era realmente de oro puro o si el artesano la había mezclado con plata.

Arquímedes llevaba días pensando sin encontrar la solución. Un día, al meterse en la bañera llena de agua, observó que el agua se derramaba. De pronto, tuvo una idea brillante: si sumergía la corona en agua y medía el agua desplazada, podría compararlo con el agua que desplazaría la misma cantidad de oro puro.

Dicen que salió corriendo a la calle gritando «¡Eureka!», que en griego significa «¡Lo he encontrado!».

Así descubrió el principio que lleva su nombre: un objeto sumergido en un líquido recibe un empuje hacia arriba igual al peso del líquido que desplaza. Por eso los barcos flotan aunque pesen miles de toneladas.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Quién era Arquímedes?",opciones:["Un rey griego","Un sabio de la ciudad de Siracusa","Un artesano joyero"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué le encargó el rey Hierón?",opciones:["Construir un barco","Comprobar si la corona era de oro puro","Diseñar un palacio nuevo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Dónde tuvo Arquímedes la gran idea?",opciones:["En el laboratorio","En el mercado","En la bañera"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué significa «Eureka»?",opciones:["¡Ayúdame!","¡Lo he encontrado!","¡Cuidado!"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué flotan los barcos aunque pesen miles de toneladas?",opciones:["Porque están vacíos por dentro","Por el principio de Arquímedes: el líquido les empuja hacia arriba","Porque el agua del mar es muy salada"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué te parece la forma en que Arquímedes encontró la solución? ¿Cuál fue la clave?"},
   ]},
  {id:69,titulo:"La música del viento",nivel:"3º-4º",tipo:"Poema",icono:"🎵",color:"#8B5CF6",colorLight:"#EDE9FE",
   intro:"Un poema sobre el viento y todos los sonidos que crea a su paso por el mundo.",
   texto:`El viento es músico
sin escuela ni partitura,
toca el pino como una flauta,
y el mar como una guitarra.

Con los dedos invisibles
acaricia la ventana,
silba entre los callejones,
ruge en la alta montaña.

A veces habla bajito
en el pelo de las niñas,
otras veces grita fuerte
y las veletas caminan.

No descansa ni de noche,
no conoce el aburrimiento.
El mundo sería más triste
sin la música del viento.`,
   preguntas:[
