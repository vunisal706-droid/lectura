     {tipo:"opcion",pregunta:"¿Qué pasa en primavera?",opciones:["Caen las hojas y hace frío","Nacen las flores y hace buen tiempo","Hace calor y los niños van de vacaciones"],correcta:1},
     {tipo:"opcion",pregunta:"¿En qué estación caen las hojas de los árboles?",opciones:["En verano","En invierno","En otoño"],correcta:2},
     {tipo:"abierta",pregunta:"¿Cuál es tu estación favorita? ¿Por qué?"},
   ]},
  {id:321,titulo:"El oso polar",nivel:"PT",tipo:"Texto",icono:"🐻‍❄️",color:"#0284C7",colorLight:"#E0F2FE",
   intro:"Lee este texto de tres párrafos sobre el oso polar.",
   texto:`El oso polar es un animal muy grande que vive en el Ártico, donde hace mucho frío. Su pelo es blanco para confundirse con la nieve y el hielo.

El oso polar es un gran nadador. Puede nadar durante muchas horas en el agua helada para buscar comida. Su comida favorita son las focas.

Hoy en día, el oso polar está en peligro porque el hielo del Ártico se está derritiendo por el calor de la Tierra. Proteger el medioambiente es muy importante para salvar a este animal.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Dónde vive el oso polar?",opciones:["En la selva","En el Ártico","En el desierto"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué el oso polar tiene el pelo blanco?",opciones:["Porque hace frío","Para confundirse con la nieve y el hielo","Porque es muy limpio"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué come el oso polar?",opciones:["Peces y plantas","Focas","Carne de otros osos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué está en peligro el oso polar?",opciones:["Porque hay demasiados cazadores","Porque el hielo se está derritiendo","Porque no encuentra focas"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué podemos hacer para ayudar a los osos polares?"},
   ]},
  {id:322,titulo:"El mercado",nivel:"PT",tipo:"Texto",icono:"🛒",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"Lee este texto de tres párrafos sobre el mercado.",
   texto:`El mercado es un lugar donde se venden muchos productos. Hay puestos de fruta y verdura, de carne y pescado, y de pan y pasteles. Los vendedores conocen muy bien lo que venden.

En el mercado podemos encontrar productos frescos traídos del campo y del mar. Muchas personas prefieren ir al mercado porque la comida es más fresca que en el supermercado.

Ir al mercado es una buena costumbre. Ayuda a los pequeños comerciantes y es una forma de conocer los productos de la zona donde vivimos.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué se vende en el mercado?",opciones:["Solo fruta y verdura","Muchos productos: fruta, carne, pescado, pan...","Solo productos envasados"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué prefieren algunos ir al mercado?",opciones:["Porque es más barato siempre","Porque la comida es más fresca","Porque está más cerca de casa"],correcta:1},
     {tipo:"opcion",pregunta:"¿A quién ayudamos cuando compramos en el mercado?",opciones:["A las grandes empresas","A los pequeños comerciantes","Al gobierno"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué podemos conocer yendo al mercado?",opciones:["Las costumbres de otros países","Los productos de la zona donde vivimos","Las recetas de otros continentes"],correcta:1},
     {tipo:"abierta",pregunta:"¿Has ido alguna vez al mercado? ¿Qué te llamó la atención?"},
   ]},
  {id:323,titulo:"El cartero",nivel:"PT",tipo:"Texto",icono:"📬",color:"#F59E0B",colorLight:"#FEF3C7",
   intro:"Lee este texto de tres párrafos sobre el cartero.",
   texto:`El cartero es la persona que nos trae las cartas y los paquetes a casa. Cada mañana recoge el correo en la oficina de Correos y sale a repartirlo por el barrio. Lleva una mochila o una bolsa grande con todo lo que tiene que entregar.

El cartero conoce muy bien las calles de su zona. Sabe dónde vive cada persona y siempre llega a todas las casas, aunque llueva o haga frío.

Antes de que existiera internet, las cartas eran la única forma de comunicarse con personas que vivían lejos. Hoy seguimos necesitando al cartero para recibir paquetes de las compras por internet.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué hace el cartero cada mañana?",opciones:["Vende sellos en la oficina","Recoge el correo y sale a repartirlo","Conduce el camión de reparto"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué lleva el cartero?",opciones:["Un carro de la compra","Una mochila o bolsa grande","Solo una carta cada vez"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se comunicaba la gente antes de internet?",opciones:["Con mensajes de humo","Con cartas","Con teléfono únicamente"],correcta:1},
     {tipo:"opcion",pregunta:"¿Para qué necesitamos hoy al cartero?",opciones:["Para saber la hora","Para recibir paquetes de compras por internet","Para conocer las noticias"],correcta:1},
     {tipo:"abierta",pregunta:"¿Has recibido alguna vez una carta o un paquete? ¿Cómo te sentiste?"},
   ]},
  {id:324,titulo:"El río",nivel:"PT",tipo:"Texto",icono:"🏞️",color:"#0891B2",colorLight:"#CFFAFE",
   intro:"Lee este texto de tres párrafos sobre el río.",
   texto:`El río es una corriente de agua dulce que fluye desde las montañas hasta el mar. El agua de los ríos viene de la lluvia y del deshielo de la nieve de las montañas.

En los ríos viven muchos animales: peces, ranas, nutrias y muchos tipos de insectos. Las orillas de los ríos están llenas de plantas y árboles que necesitan el agua para vivir.

Los ríos son muy importantes para las personas. Usamos el agua de los ríos para beber, para regar los campos y para generar electricidad. Por eso debemos cuidarlos y no contaminarlos.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿De dónde viene el agua de los ríos?",opciones:["Del mar","De la lluvia y el deshielo de las montañas","De los embalses"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué animales viven en los ríos?",opciones:["Leones y elefantes","Peces, ranas y nutrias","Camellos y cebras"],correcta:1},
     {tipo:"opcion",pregunta:"¿Adónde llega el río al final?",opciones:["A un lago","Al mar","A otro río"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué debemos cuidar los ríos?",opciones:["Porque son bonitos","Porque los usamos para beber, regar y generar electricidad","Porque en ellos viven los peces"],correcta:1},
     {tipo:"abierta",pregunta:"¿Hay algún río cerca de donde vives? ¿Cómo se llama?"},
   ]},
  {id:325,titulo:"El pan de cada día",nivel:"PT",tipo:"Texto",icono:"🌾",color:"#D97706",colorLight:"#FEF9C3",
   intro:"Lee este texto de tres párrafos sobre cómo se hace el pan.",
   texto:`El pan se elabora con harina, agua, sal y levadura. La harina viene del trigo, que es una planta que crece en los campos. Los agricultores recogen el trigo en verano y lo llevan al molino para convertirlo en harina.

El panadero mezcla los ingredientes, amasa la masa y la deja reposar para que suba. Luego da forma al pan y lo mete en el horno muy caliente. En unos minutos el pan se pone dorado y crujiente.

El pan es uno de los alimentos más importantes en todo el mundo. En casi todos los países se come algún tipo de pan, aunque su forma y sus ingredientes pueden variar mucho de un lugar a otro.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿De qué planta viene la harina?",opciones:["Del maíz","Del trigo","Del arroz"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hace el panadero después de amasar?",opciones:["Mete el pan en el horno directamente","Deja reposar la masa para que suba","Lo vende sin cocinar"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se pone el pan en el horno?",opciones:["Blanco y blando","Dorado y crujiente","Oscuro y muy duro"],correcta:1},
     {tipo:"opcion",pregunta:"¿Comen pan en todos los países?",opciones:["No, solo en Europa","Sí, aunque de formas e ingredientes distintos","Solo donde se cultiva trigo"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué tipo de pan te gusta más? ¿Con qué lo comes?"},
   ]},
  {id:326,titulo:"Los animales de la granja",nivel:"PT",tipo:"Texto",icono:"🐄",color:"#84CC16",colorLight:"#ECFCCB",
   intro:"Lee este texto de tres párrafos sobre los animales de la granja.",
   texto:`En la granja viven muchos animales domésticos. La vaca nos da leche. Las gallinas ponen huevos. El cerdo nos da carne. Las ovejas nos dan lana para hacer ropa de abrigo.

Los animales de la granja necesitan cuidados cada día. El granjero los alimenta por la mañana y por la tarde. También limpia el establo donde duermen y los lleva al campo a pastar.

Gracias a los animales de la granja tenemos muchos alimentos en nuestra mesa. La leche, los huevos, la carne y el queso vienen de los animales que los granjeros cuidan con mucho esfuerzo.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué nos da la vaca?",opciones:["Huevos","Lana","Leche"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué hacen las gallinas?",opciones:["Dan leche","Ponen huevos","Dan lana"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuántas veces al día alimenta el granjero a los animales?",opciones:["Una vez","Dos veces: por la mañana y por la tarde","Solo cuando tienen hambre"],correcta:1},
     {tipo:"opcion",pregunta:"¿De dónde viene el queso?",opciones:["De las plantas","De los animales de la granja","De la fábrica de quesos"],correcta:1},
     {tipo:"abierta",pregunta:"¿Has visitado alguna vez una granja? ¿Qué animales había?"},
   ]},
  {id:327,titulo:"El cuerpo humano",nivel:"PT",tipo:"Texto",icono:"🫀",color:"#EF4444",colorLight:"#FEE2E2",
   intro:"Lee este texto de tres párrafos sobre el cuerpo humano.",
   texto:`El cuerpo humano tiene muchas partes. Por fuera vemos la cabeza, el tronco y las extremidades: los brazos y las piernas. La piel cubre y protege todo el cuerpo.

Por dentro, el cuerpo tiene órganos muy importantes. El corazón bombea la sangre. Los pulmones nos permiten respirar. El estómago digiere los alimentos que comemos.

Para que el cuerpo funcione bien, necesitamos comer sano, beber agua, dormir las horas necesarias y hacer ejercicio. Cuidar el cuerpo es importante para estar sanos y tener energía.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuáles son las partes externas del cuerpo?",opciones:["Solo la cabeza","La cabeza, el tronco y las extremidades","Los huesos y los músculos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hace el corazón?",opciones:["Nos permite respirar","Bombea la sangre","Digiere los alimentos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hacen los pulmones?",opciones:["Bombean la sangre","Digieren la comida","Nos permiten respirar"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué necesita el cuerpo para funcionar bien?",opciones:["Solo comer mucho","Comer sano, beber agua, dormir y hacer ejercicio","Solo dormir muchas horas"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué haces tú para cuidar tu cuerpo?"},
   ]},
  {id:328,titulo:"El reciclaje",nivel:"PT",tipo:"Texto",icono:"♻️",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"Lee este texto de tres párrafos sobre el reciclaje.",
   texto:`Reciclar significa separar los residuos para que puedan volver a usarse y no contaminar el medioambiente. En casa usamos diferentes contenedores de colores: el azul para el papel, el amarillo para los envases de plástico y latas, y el verde para el vidrio.

Cuando reciclamos, los materiales se llevan a fábricas donde los limpian y transforman en objetos nuevos. Así se usa menos energía y se talan menos árboles. Una botella de vidrio reciclada puede convertirse en una botella nueva.

El reciclaje es responsabilidad de todos. Si cada familia separa bien sus basuras, juntos podemos reducir la contaminación y cuidar el planeta para el futuro.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué color tiene el contenedor del papel?",opciones:["Verde","Amarillo","Azul"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué se tira en el contenedor amarillo?",opciones:["Papel y cartón","Envases de plástico y latas","Vidrio"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué pasa con los materiales reciclados?",opciones:["Se entierran en el campo","Se llevan a fábricas para hacer objetos nuevos","Se queman para generar energía"],correcta:1},
     {tipo:"opcion",pregunta:"¿De quién es responsabilidad el reciclaje?",opciones:["Solo del gobierno","Solo de las fábricas","De todos"],correcta:2},
     {tipo:"abierta",pregunta:"¿Recicláis en tu casa? ¿Qué separáis?"},
   ]},
  {id:329,titulo:"La biblioteca",nivel:"PT",tipo:"Texto",icono:"📚",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"Lee este texto de tres párrafos sobre la biblioteca.",
   texto:`La biblioteca es un lugar donde hay muchos libros ordenados en estanterías. Podemos ir a leer allí o pedir prestado un libro para llevárnoslo a casa. Los libros se devuelven en el plazo que nos indican.

En la biblioteca hay silencio para que todo el mundo pueda leer y estudiar con tranquilidad. La persona encargada se llama bibliotecario o bibliotecaria y nos ayuda a encontrar el libro que buscamos.

La biblioteca es un espacio de todos. Es gratis y está abierta a cualquier persona. Cuidar los libros cuando los tomamos prestados es muy importante para que otros puedan disfrutarlos después.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué podemos hacer en la biblioteca?",opciones:["Leer allí o pedir libros prestados","Comprar libros y revistas","Solo estudiar en silencio"],correcta:0},
     {tipo:"opcion",pregunta:"¿Cómo se llama la persona que trabaja en la biblioteca?",opciones:["Librero","Bibliotecario o bibliotecaria","Maestro de lectura"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué hay silencio en la biblioteca?",opciones:["Porque está prohibido hablar por ley","Para que todo el mundo pueda leer y estudiar con tranquilidad","Porque los libros se estropean con el ruido"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuánto cuesta entrar a la biblioteca?",opciones:["Poco dinero","Mucho dinero","Es gratis"],correcta:2},
     {tipo:"abierta",pregunta:"¿Has ido alguna vez a la biblioteca? ¿Qué libro cogiste o te gustaría coger?"},
   ]},
  {id:330,titulo:"La amistad",nivel:"PT",tipo:"Texto",icono:"🤝",color:"#EC4899",colorLight:"#FCE7F3",
   intro:"Lee este texto de tres párrafos sobre la amistad.",
   texto:`Los amigos son personas especiales con las que nos lo pasamos bien. Un buen amigo te escucha cuando estás triste, te ayuda cuando lo necesitas y se alegra cuando te pasan cosas buenas.

Para tener buenos amigos también hay que ser un buen amigo. Eso significa ser sincero, respetar cómo es cada uno y estar ahí en los momentos difíciles. La amistad hay que cuidarla con el tiempo.

No hace falta tener muchos amigos. Con tener uno o dos amigos de verdad con los que te sientas bien es suficiente. La calidad de la amistad importa más que la cantidad.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué hace un buen amigo cuando estás triste?",opciones:["Te ignora","Te escucha","Se va a jugar con otros"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué significa ser un buen amigo?",opciones:["Dar siempre regalos","Ser sincero, respetar y estar en los momentos difíciles","Solo jugar juntos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué importa más en la amistad según el texto?",opciones:["Tener muchos amigos","La calidad de la amistad, no la cantidad","Que los amigos sean del mismo barrio"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo hay que mantener la amistad?",opciones:["Llamando por teléfono cada día","Cuidándola con el tiempo","Dando regalos en los cumpleaños"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué es lo que más valoras de tu mejor amigo o amiga?"},
   ]}
,{id:331,titulo:"La carta",nivel:"PT",tipo:"Texto funcional",icono:"✉️",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"Lee esta carta que escribe una niña a su abuela.",
   texto:`Querida abuela:

Te escribo desde el colegio. Hoy hemos aprendido a hacer pan. Me lo he pasado muy bien amasando la masa con mis manos.

Esta tarde voy al parque con mamá. ¿Puedes venir a visitarnos pronto? Te echamos de menos.

Un beso muy grande,
Lucía`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Quién escribe la carta?",opciones:["La abuela","Lucía","La maestra"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué han hecho en el colegio?",opciones:["Dibujar","Hacer pan","Jugar al fútbol"],correcta:1},
     {tipo:"opcion",pregunta:"¿A quién va dirigida la carta?",opciones:["A la maestra","A una amiga","A la abuela"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué va a hacer Lucía por la tarde?",opciones:["Ir al cine","Ir al parque","Quedarse en casa"],correcta:1},
     {tipo:"abierta",pregunta:"¿A quién le escribirías tú una carta?"},
   ]}
  ,{id:332,titulo:"El semáforo",nivel:"PT",tipo:"Texto informativo",icono:"🚦",color:"#DC2626",colorLight:"#FEE2E2",
   intro:"Lee este texto sobre los colores del semáforo.",
   texto:`El semáforo tiene tres colores. Cada color nos da una orden diferente.

El rojo nos dice que hay que parar. No podemos cruzar la calle cuando está en rojo.

El verde nos dice que podemos pasar. Hay que mirar a los dos lados antes de cruzar.

El amarillo nos avisa de que el semáforo va a cambiar. Hay que estar preparados para parar.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuántos colores tiene el semáforo?",opciones:["Dos","Tres","Cuatro"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué significa el color rojo?",opciones:["Pasar","Parar","Esperar"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuándo podemos cruzar la calle?",opciones:["Con el rojo","Con el verde","Con el amarillo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Para qué sirve el amarillo?",opciones:["Para correr","Para avisar del cambio","Para parar el coche"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué haces tú cuando el semáforo está en rojo?"},
   ]}
  ,{id:333,titulo:"Mi mascota",nivel:"PT",tipo:"Texto",icono:"🐹",color:"#F59E0B",colorLight:"#FEF3C7",
   intro:"Lee este texto sobre una mascota muy especial.",
   texto:`Tengo una mascota que se llama Bolita. Es un hámster de color marrón y blanco.

Bolita vive en una jaula grande con una rueda. Le encanta correr en la rueda por las noches. Come semillas y verduras.

Cuido a Bolita todos los días. Le limpio la jaula, le doy comida y agua fresca. Bolita es muy importante para mí.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué tipo de animal es Bolita?",opciones:["Un conejo","Un hámster","Un ratón"],correcta:1},
     {tipo:"opcion",pregunta:"¿De qué color es Bolita?",opciones:["Negro y blanco","Marrón y blanco","Naranja"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hace Bolita por las noches?",opciones:["Duerme","Corre en la rueda","Come"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué come Bolita?",opciones:["Carne y pescado","Semillas y verduras","Pan y leche"],correcta:1},
     {tipo:"abierta",pregunta:"¿Tienes tú alguna mascota? ¿Cómo se llama?"},
   ]}
  ,{id:334,titulo:"El arco iris",nivel:"PT",tipo:"Texto informativo",icono:"🌈",color:"#EC4899",colorLight:"#FCE7F3",
   intro:"Lee este texto sobre el arco iris.",
   texto:`El arco iris aparece en el cielo cuando llueve y hace sol al mismo tiempo. Tiene forma de arco y muchos colores.

Los colores del arco iris son siempre los mismos y siempre están en el mismo orden: rojo, naranja, amarillo, verde, azul, añil y violeta.

Para ver un arco iris, hay que mirar en la dirección contraria al sol. Es un espectáculo muy bonito de la naturaleza.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuándo aparece el arco iris?",opciones:["Solo cuando llueve","Cuando llueve y hace sol a la vez","Solo cuando hace sol"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué forma tiene el arco iris?",opciones:["Forma de círculo","Forma de arco","Forma de línea recta"],correcta:1},
     {tipo:"opcion",pregunta:"¿Son siempre los mismos colores?",opciones:["No, cambian","Sí, siempre son los mismos","Depende del día"],correcta:0},
     {tipo:"opcion",pregunta:"¿Hacia dónde hay que mirar para verlo?",opciones:["Hacia el sol","Al contrario del sol","Hacia arriba"],correcta:1},
     {tipo:"abierta",pregunta:"¿Has visto alguna vez un arco iris? ¿Cómo era?"},
   ]}
  ,{id:335,titulo:"El ratón de ciudad y el ratón de campo",nivel:"PT",tipo:"Fábula",icono:"🐭",color:"#92400E",colorLight:"#FEF3C7",
   intro:"Lee esta fábula sobre dos ratones muy diferentes.",
   texto:`Un ratón de ciudad fue a visitar a su amigo el ratón de campo. El ratón de campo le ofreció semillas, nueces y agua de un arroyo.

Al ratón de ciudad no le gustó nada. Le invitó a su casa en la ciudad, donde había queso, pan y pasteles.

Pero en la ciudad vivía un gato grande. El gato los persiguió y los dos ratones tuvieron que esconderse temblando.

El ratón de campo dijo: «Prefiero mi comida sencilla y vivir tranquilo». Y volvió a su campo.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Dónde vivía el primer ratón?",opciones:["En el campo","En la ciudad","En el bosque"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué ofreció el ratón de campo?",opciones:["Queso y pan","Semillas y nueces","Pasteles"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué problema había en la ciudad?",opciones:["Mucho ruido","Un gato grande","Poca comida"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué decidió el ratón de campo al final?",opciones:["Quedarse en la ciudad","Volver a su campo","Buscar otro lugar"],correcta:1},
     {tipo:"abierta",pregunta:"¿Preferirías vivir en la ciudad o en el campo? ¿Por qué?"},
   ]}
  ,{id:336,titulo:"El desayuno sano",nivel:"PT",tipo:"Texto informativo",icono:"🥛",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"Lee este texto sobre cómo debe ser un buen desayuno.",
   texto:`El desayuno es la comida más importante del día. Por las mañanas, nuestro cuerpo necesita energía para empezar bien.

Un desayuno sano puede ser un vaso de leche, una fruta y un poco de pan con aceite. También pueden ser cereales con leche o yogur con fruta.

Es importante desayunar todos los días antes de ir al colegio. Si no desayunamos, nos costará más concentrarnos y nos cansaremos antes.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuál es la comida más importante del día?",opciones:["La cena","El desayuno","La merienda"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué puede ser un desayuno sano?",opciones:["Leche, fruta y pan","Patatas fritas y refresco","Caramelos y galletas"],correcta:0},
     {tipo:"opcion",pregunta:"¿Qué pasa si no desayunamos?",opciones:["Nos concentramos mejor","Nos cansamos antes","Tenemos más energía"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuándo hay que desayunar?",opciones:["Después del colegio","Antes de ir al colegio","A mediodía"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué desayunas tú normalmente por las mañanas?"},
   ]}
  ,{id:337,titulo:"La tortuga y la liebre",nivel:"PT",tipo:"Fábula",icono:"🐢",color:"#0D9488",colorLight:"#CCFBF1",
   intro:"Lee esta famosa fábula sobre una carrera muy especial.",
   texto:`La liebre y la tortuga se retaron a una carrera. Todos pensaban que la liebre ganaría fácilmente porque era mucho más rápida.

La carrera empezó. La liebre corrió muy deprisa y se adelantó mucho. Entonces pensó: «Tengo tiempo de sobra» y se echó a dormir bajo un árbol.

La tortuga siguió caminando despacio pero sin parar. Pasó por delante de la liebre dormida y llegó a la meta.

Cuando la liebre se despertó, ya era tarde. La tortuga había ganado la carrera.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Quiénes se retaron a una carrera?",opciones:["El zorro y el lobo","La liebre y la tortuga","El conejo y el ratón"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hizo la liebre durante la carrera?",opciones:["Corrió sin parar","Se echó a dormir","Ayudó a la tortuga"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hizo la tortuga?",opciones:["Se paró a descansar","Corrió muy rápido","Caminó despacio pero sin parar"],correcta:2},
     {tipo:"opcion",pregunta:"¿Quién ganó la carrera?",opciones:["La liebre","La tortuga","Ninguna de las dos"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué nos enseña esta fábula?"},
   ]}
  ,{id:338,titulo:"Las estaciones",nivel:"PT",tipo:"Texto informativo",icono:"🍂",color:"#F97316",colorLight:"#FFEDD5",
   intro:"Lee este texto sobre las cuatro estaciones del año.",
   texto:`El año tiene cuatro estaciones: primavera, verano, otoño e invierno. Cada estación dura tres meses y tiene un clima diferente.

En primavera hace buen tiempo, las flores brotan y los días son más largos. En verano hace mucho calor y los niños tienen vacaciones.

En otoño las hojas de los árboles caen y empieza a hacer frío. En invierno hace mucho frío y en algunos lugares nieva.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuántas estaciones tiene el año?",opciones:["Tres","Cuatro","Cinco"],correcta:1},
     {tipo:"opcion",pregunta:"¿En qué estación tienen vacaciones los niños?",opciones:["Primavera","Otoño","Verano"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué pasa en otoño con las hojas?",opciones:["Brotan","Caen","Se ponen verdes"],correcta:1},
     {tipo:"opcion",pregunta:"¿En qué estación puede nevar?",opciones:["Verano","Primavera","Invierno"],correcta:2},
     {tipo:"abierta",pregunta:"¿Cuál es tu estación favorita? ¿Por qué?"},
   ]}
  ,{id:339,titulo:"El niño que no quería ducharse",nivel:"PT",tipo:"Cuento",icono:"🚿",color:"#0284C7",colorLight:"#E0F2FE",
   intro:"Lee este cuento sobre un niño muy especial con el agua.",
   texto:`A Marcos no le gustaba nada ducharse. Siempre ponía excusas: que tenía frío, que tenía sueño, que se había duchado hacía poco.

Un día, sus amigos del colegio no quisieron jugar con él porque olía muy mal. Marcos se puso muy triste.

Su mamá le explicó que ducharse cada día es importante para estar limpios y no enfermar. Desde ese día, Marcos se duchaba todos los días y sus amigos volvieron a jugar con él.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué no le gustaba a Marcos?",opciones:["Comer","Ducharse","Dormir"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué no jugaron con él sus amigos?",opciones:["Porque era malo","Porque olía mal","Porque no sabía jugar"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué le explicó su mamá?",opciones:["Que el agua está fría","Que ducharse es importante","Que sus amigos tenían razón"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué pasó cuando Marcos se duchaba todos los días?",opciones:["Sus amigos se fueron","Sus amigos volvieron a jugar con él","Nada cambió"],correcta:1},
     {tipo:"abierta",pregunta:"¿Por qué es importante ducharse todos los días?"},
   ]}
  ,{id:340,titulo:"La lluvia",nivel:"PT",tipo:"Texto informativo",icono:"🌧️",color:"#1D4ED8",colorLight:"#DBEAFE",
   intro:"Lee este texto sobre de dónde viene la lluvia.",
   texto:`La lluvia es agua que cae del cielo. Pero, ¿de dónde viene esa agua?

El sol calienta el agua de los mares y los ríos. Esa agua se convierte en vapor y sube al cielo. Allí forma las nubes.

Cuando las nubes tienen mucha agua, esta cae en forma de lluvia. La lluvia riega los campos, llena los ríos y nos da el agua que bebemos.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué es la lluvia?",opciones:["Hielo que cae del cielo","Agua que cae del cielo","Vapor del cielo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hace el sol con el agua?",opciones:["La congela","La calienta y la convierte en vapor","La pinta de azul"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué forman las nubes?",opciones:["Nieve","Arco iris","Las nubes son agua que subió"],correcta:2},
     {tipo:"opcion",pregunta:"¿Para qué sirve la lluvia?",opciones:["Para mojarnos","Para regar campos y llenar ríos","Solo para jugar"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué te gusta hacer cuando llueve?"},
   ]}
  ,{id:341,titulo:"El cumpleaños de Ana",nivel:"PT",tipo:"Cuento",icono:"🎂",color:"#DB2777",colorLight:"#FCE7F3",
   intro:"Lee este cuento sobre el cumpleaños de una niña.",
   texto:`Hoy es el cumpleaños de Ana. Cumple siete años. Por la mañana, su familia le cantó el cumpleaños feliz y le trajo un desayuno especial con zumo de naranja y una tarta pequeña.

Por la tarde vinieron sus amigos del colegio a su casa. Jugaron a juegos, cantaron canciones y merendaron una tarta de chocolate con velas.

Ana sopló las velas y pidió un deseo en secreto. Fue un día muy feliz que no olvidará nunca.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuántos años cumple Ana?",opciones:["Seis","Siete","Ocho"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué desayunó Ana?",opciones:["Leche y galletas","Zumo y una tarta pequeña","Cereales con fruta"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hicieron los amigos por la tarde?",opciones:["Fueron al parque","Jugaron y merendaron tarta","Vieron una película"],correcta:1},
     {tipo:"opcion",pregunta:"¿De qué era la tarta de la tarde?",opciones:["De fresa","De vainilla","De chocolate"],correcta:2},
     {tipo:"abierta",pregunta:"¿Cómo celebras tú tu cumpleaños?"},
   ]}
  ,{id:342,titulo:"Los cinco sentidos",nivel:"PT",tipo:"Texto informativo",icono:"👁️",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"Lee este texto sobre los cinco sentidos del cuerpo.",
   texto:`Nuestro cuerpo tiene cinco sentidos que nos ayudan a conocer el mundo que nos rodea.

Con los ojos vemos. Con los oídos escuchamos. Con la nariz olemos. Con la boca y la lengua saboreamos los alimentos.

Con la piel tocamos y notamos el frío, el calor y el dolor. Los cinco sentidos trabajan juntos para ayudarnos en nuestra vida diaria.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuántos sentidos tenemos?",opciones:["Tres","Cuatro","Cinco"],correcta:2},
     {tipo:"opcion",pregunta:"¿Con qué sentido escuchamos?",opciones:["Con los ojos","Con los oídos","Con la nariz"],correcta:1},
     {tipo:"opcion",pregunta:"¿Para qué usamos la nariz?",opciones:["Para ver","Para oler","Para tocar"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué notamos con la piel?",opciones:["Los sabores","El frío, el calor y el dolor","Los sonidos"],correcta:1},
     {tipo:"abierta",pregunta:"¿Cuál es tu sentido favorito? ¿Por qué?"},
   ]}
  ,{id:343,titulo:"El niño que no comía verduras",nivel:"PT",tipo:"Cuento",icono:"🥦",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"Lee este cuento sobre un niño que descubre algo sorprendente.",
   texto:`A Pablo no le gustaban nada las verduras. Cuando su mamá ponía brócoli o zanahorias en su plato, hacía una mueca y decía: «¡Qué asco!».

Un día, su abuela le preparó una sopa especial. Pablo la probó y le encantó. Le preguntó qué llevaba.

Su abuela sonrió: «Zanahoria, cebolla y judías verdes». Pablo no podía creerlo. Desde ese día, Pablo comió verduras en sopa, en tortilla y asadas. Le había pillado el truco.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué no le gustaban a Pablo?",opciones:["Las frutas","Las verduras","Los dulces"],correcta:1},
     {tipo:"opcion",pregunta:"¿Quién le preparó la sopa especial?",opciones:["Su mamá","Su maestra","Su abuela"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué llevaba la sopa?",opciones:["Pollo y pasta","Zanahoria, cebolla y judías","Tomate y arroz"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo comía las verduras Pablo al final?",opciones:["Solo en sopa","Solo crudas","En sopa, tortilla y asadas"],correcta:2},
     {tipo:"abierta",pregunta:"¿Hay algún alimento que no te guste? ¿Lo has probado de otras formas?"},
   ]}
  ,{id:344,titulo:"El volcán",nivel:"PT",tipo:"Texto informativo",icono:"🌋",color:"#DC2626",colorLight:"#FEE2E2",
   intro:"Lee este texto sobre qué es un volcán.",
   texto:`Un volcán es una abertura en la superficie de la Tierra por donde sale material muy caliente desde el interior. Ese material caliente se llama lava.

Cuando un volcán entra en erupción, lanza lava, gases y ceniza. La lava es tan caliente que puede quemar todo lo que toca.

Aunque los volcanes son peligrosos, también son útiles. La lava enfriada forma tierra muy fértil para cultivar plantas y alimentos.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué es un volcán?",opciones:["Una montaña con nieve","Una abertura por donde sale lava","Un lago grande"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se llama el material caliente que sale?",opciones:["Ceniza","Barro","Lava"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué lanza el volcán al entrar en erupción?",opciones:["Solo lava","Lava, gases y ceniza","Solo gases"],correcta:1},
     {tipo:"opcion",pregunta:"¿Para qué sirve la lava enfriada?",opciones:["Para hacer casas","Para formar tierra fértil","Para beber"],correcta:1},
     {tipo:"abierta",pregunta:"¿Conoces el nombre de algún volcán famoso?"},
   ]}
  ,{id:345,titulo:"El lobo y los tres cerditos",nivel:"PT",tipo:"Cuento",icono:"🐷",color:"#F97316",colorLight:"#FFEDD5",
   intro:"Lee este cuento clásico sobre tres cerditos y un lobo.",
   texto:`Tres cerditos construyeron sus casas. El primero hizo una de paja, el segundo de madera y el tercero de ladrillo. El tercero tardó mucho más, pero su casa era muy sólida.

Un lobo quería comérselos. Sopló con fuerza y derribó la casa de paja. También derribó la de madera. Los dos cerditos corrieron a casa de su hermano.

El lobo sopló y sopló, pero la casa de ladrillo no se cayó. El lobo se cansó y se marchó. Los tres cerditos aprendieron que vale la pena esforzarse y hacer las cosas bien.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿De qué era la casa del tercer cerdito?",opciones:["De paja","De madera","De ladrillo"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué quería hacer el lobo?",opciones:["Jugar con ellos","Comérselos","Dormir en sus casas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué casas derribó el lobo?",opciones:["La de paja y la de madera","La de ladrillo","Las tres"],correcta:0},
     {tipo:"opcion",pregunta:"¿Por qué no cayó la casa de ladrillo?",opciones:["El lobo era débil","Era muy sólida","El lobo tuvo miedo"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué aprendieron los tres cerditos? ¿Estás de acuerdo?"},
   ]}
  ,{id:346,titulo:"El agua",nivel:"PT",tipo:"Texto informativo",icono:"💧",color:"#0891B2",colorLight:"#CFFAFE",
   intro:"Lee este texto sobre la importancia del agua.",
   texto:`El agua es esencial para la vida. Todos los seres vivos, animales, plantas y personas, necesitan agua para vivir.

Nuestro cuerpo está formado en gran parte por agua. Por eso debemos beber entre seis y ocho vasos de agua al día para estar sanos.

El agua también se usa para cocinar, limpiar y regar los campos. Debemos cuidarla y no gastarla sin necesidad, porque no hay tanta agua limpia en el mundo.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Quiénes necesitan agua para vivir?",opciones:["Solo las personas","Solo los animales","Todos los seres vivos"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cuántos vasos de agua debemos beber al día?",opciones:["Uno o dos","Entre seis y ocho","Más de diez"],correcta:1},
     {tipo:"opcion",pregunta:"¿Para qué más se usa el agua?",opciones:["Para pintar y construir","Para cocinar, limpiar y regar","Solo para beber"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué debemos cuidar el agua?",opciones:["Porque es cara","Porque no hay mucha agua limpia","Porque es pesada"],correcta:1},
     {tipo:"abierta",pregunta:"¿Cómo puedes ahorrar agua en tu casa?"},
   ]}
  ,{id:347,titulo:"Mi barrio",nivel:"PT",tipo:"Texto",icono:"🏘️",color:"#64748B",colorLight:"#F1F5F9",
   intro:"Lee este texto sobre un niño que describe su barrio.",
   texto:`Me llamo Tomás y vivo en un barrio tranquilo. En mi barrio hay un parque con toboganes y columpios donde juego con mis amigos.

También hay una panadería donde mi mamá compra el pan cada mañana. El olor del pan recién hecho llega hasta nuestra ventana.

Me gusta mucho mi barrio porque conozco a todos los vecinos. El señor Paco siempre me saluda y la señora Rosa me regala caramelos cuando le ayudo con las bolsas.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cómo se llama el niño?",opciones:["Pablo","Tomás","Carlos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hay en el parque?",opciones:["Una piscina","Toboganes y columpios","Una cancha de fútbol"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué compra su mamá en la panadería?",opciones:["Leche","Pan","Pasteles"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué le da la señora Rosa?",opciones:["Dinero","Caramelos","Frutas"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué hay en tu barrio que te guste especialmente?"},
   ]}
  ,{id:348,titulo:"El pequeño árbol",nivel:"PT",tipo:"Cuento",icono:"🌱",color:"#15803D",colorLight:"#DCFCE7",
   intro:"Lee este cuento sobre un pequeño árbol que quiere crecer.",
   texto:`En el jardín había un árbol pequeño que miraba con envidia a los árboles grandes que le rodeaban. «Nunca llegaré a ser tan alto», pensaba triste.

Un jardinero le dijo: «Solo necesitas tiempo, agua y sol. Cada día crecerás un poco».

El árbol siguió su consejo. No se preocupó más por los demás y se centró en crecer. Un año después era mucho más alto, y con el tiempo llegó a ser el árbol más grande del jardín.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cómo se sentía el árbol pequeño al principio?",opciones:["Feliz","Triste y con envidia","Enfadado"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué necesita el árbol para crecer?",opciones:["Tierra, abono y sombra","Tiempo, agua y sol","Nieve y frío"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué decidió hacer el árbol?",opciones:["Rendirse","Centrarse en crecer sin compararse","Pedir ayuda a otros árboles"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo acabó la historia?",opciones:["El árbol se secó","Se convirtió en el árbol más grande","Se fue del jardín"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué nos enseña este cuento? ¿Te has comparado alguna vez con otros?"},
   ]}
  ,{id:349,titulo:"Los medios de transporte",nivel:"PT",tipo:"Texto informativo",icono:"🚌",color:"#1D4ED8",colorLight:"#DBEAFE",
   intro:"Lee este texto sobre los diferentes medios de transporte.",
   texto:`Los medios de transporte nos ayudan a movernos de un lugar a otro. Hay muchos tipos diferentes.

Por tierra viajamos en coche, autobús, tren o bicicleta. Por el agua usamos barcos y ferris. Por el aire viajamos en avión o helicóptero.

Los medios de transporte han cambiado mucho. Antes solo existían los carros tirados por caballos. Ahora los trenes y aviones nos llevan muy lejos en poco tiempo.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Para qué sirven los medios de transporte?",opciones:["Para comunicarnos","Para movernos de un lugar a otro","Para guardar objetos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuál de estos viaja por el agua?",opciones:["El avión","El tren","El barco"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué usaban antes en lugar de los coches?",opciones:["Motos","Carros tirados por caballos","Trenes de vapor"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cuál es el medio de transporte más rápido del texto?",opciones:["El coche","La bicicleta","El avión"],correcta:2},
     {tipo:"abierta",pregunta:"¿En qué medio de transporte has viajado tú? ¿Cuál te gustó más?"},
   ]}
  ,{id:350,titulo:"La luna y las estrellas",nivel:"PT",tipo:"Texto informativo",icono:"🌙",color:"#4F46E5",colorLight:"#EEF2FF",
   intro:"Lee este texto sobre la luna y las estrellas del cielo nocturno.",
   texto:`Por la noche, cuando el sol se va, podemos ver la luna y las estrellas en el cielo. Son muy bonitas.

La luna no tiene luz propia. Refleja la luz del sol. Por eso a veces la vemos entera, como un círculo brillante, y otras veces solo vemos una parte de ella.

Las estrellas son como el sol: bolas de fuego muy grandes y muy lejanas. Parecen pequeñas porque están muy lejos de la Tierra. Algunas personas unen las estrellas con líneas imaginarias para formar figuras llamadas constelaciones.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuándo podemos ver la luna y las estrellas?",opciones:["Por la mañana","Por la noche","Al mediodía"],correcta:1},
     {tipo:"opcion",pregunta:"¿Tiene luz propia la luna?",opciones:["Sí","No, refleja la luz del sol","A veces"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué parecen pequeñas las estrellas?",opciones:["Porque son pequeñas","Porque están muy lejos","Porque están apagadas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo se llaman las figuras que forman las estrellas?",opciones:["Galaxias","Planetas","Constelaciones"],correcta:2},
     {tipo:"abierta",pregunta:"¿Has mirado alguna vez el cielo estrellado de noche? ¿Cómo te hizo sentir?"},
   ]}
];

const borrarTodo = () => { try { localStorage.removeItem(SK); } catch {}};
const formatFecha = iso => new Date(iso).toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});

function PantallaInicio({onStart, onMaestro}) {
  const [nombre, setNombre] = useState("");
  const [error, setError] = useState(false);
  const go = () => { if (nombre.trim().length < 2) { setError(true); return; } onStart(nombre.trim()); };
  return (
    <div className="screen" style={{background:"linear-gradient(135deg,#FFF9F0,#FEE2E2 50%,#DBEAFE)",justifyContent:"center",alignItems:"center",padding:24,gap:0}}>
      <div style={{textAlign:"center",marginBottom:32}}>
        <div style={{fontSize:80,marginBottom:8}}>📚</div>
        <h1 style={{fontFamily:"'Fredoka One',cursive",fontSize:"clamp(28px,6vw,52px)",color:"#FF6B35",textShadow:"3px 3px 0 #FFD6C4",lineHeight:1.1}}>Mis Lecturas</h1>
        <p style={{fontSize:"clamp(15px,2.5vw,20px)",color:"#64748B",fontWeight:700,marginTop:8}}>Educación Primaria</p>
      </div>
      <div style={{background:"white",borderRadius:28,padding:"32px 36px",boxShadow:"0 8px 32px rgba(0,0,0,0.12)",maxWidth:460,width:"100%",textAlign:"center"}}>
        <p style={{fontSize:"clamp(18px,3vw,22px)",fontWeight:800,color:"#1E293B",marginBottom:20}}>¿Cómo te llamas? 👋</p>
        <input type="text" value={nombre} onChange={e=>{setNombre(e.target.value);setError(false);}} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="Escribe tu nombre..." maxLength={40} autoFocus
          style={{width:"100%",padding:"14px 20px",fontSize:"clamp(18px,3vw,22px)",border:error?"3px solid #EF4444":"3px solid #E2E8F0",borderRadius:16,outline:"none",fontWeight:700,color:"#1E293B",background:error?"#FEF2F2":"#F8FAFC",textAlign:"center"}}/>

}

/* ═══════════════════════════════════════════
   PANTALLA: PREGUNTAS
═══════════════════════════════════════════ */
function PantallaPreguntas({lectura, alumno, cicloKey, onFinish}) {
  const [idx, setIdx] = useState(0);
  const [respuestas, setRespuestas] = useState(Array(lectura.preguntas.length).fill(null));
  const [textos, setTextos] = useState(Array(lectura.preguntas.length).fill(""));
  const [feedback, setFeedback] = useState(null);
  const [anim, setAnim] = useState("");
  const p = lectura.preguntas[idx];
  const esUltima = idx === lectura.preguntas.length - 1;
  const respActual = respuestas[idx];

  const responder = i => {
    if (feedback !== null) return;
    const ok = i === p.correcta;
    const nuevas = [...respuestas]; nuevas[idx] = i; setRespuestas(nuevas);
    setFeedback(ok ? "ok" : "fail"); setAnim(ok ? "pop" : "shake");
    setTimeout(()=>setAnim(""), 400);
  };
  const avanzar = () => {
    if (esUltima) {
      let correctas=0,total=0;
      lectura.preguntas.forEach((pr,i)=>{ if(pr.tipo==="opcion"){total++;if(respuestas[i]===pr.correcta)correctas++;} });
      const r = {id:Date.now(),alumno,ciclo:cicloKey,fecha:new Date().toISOString(),lecturaId:lectura.id,lecturaTitulo:lectura.titulo,correctas,total,respuestas,textosAbiertos:textos,preguntas:lectura.preguntas};
      guardar(r); onFinish(r);
    } else { setFeedback(null); setIdx(i=>i+1); }
  };
  const puedeAvanzar = p.tipo==="opcion" ? feedback!==null : textos[idx].trim().length>0;
  const progreso = (idx/lectura.preguntas.length)*100;

  return (
    <div className="screen" style={{background:"#FEF6E8"}}>
      <div style={{background:`linear-gradient(135deg,${lectura.color},${lectura.color}CC)`,padding:"16px 24px",color:"white"}}>
        <div style={{maxWidth:700,margin:"0 auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontWeight:800,fontSize:"clamp(14px,2vw,17px)",opacity:.9}}>{lectura.titulo}</span>
            <span style={{fontWeight:800,fontSize:"clamp(14px,2vw,17px)"}}>{idx+1}/{lectura.preguntas.length}</span>
          </div>
          <div style={{background:"rgba(255,255,255,0.3)",borderRadius:99,height:10,overflow:"hidden"}}>
            <div style={{width:progreso+"%",height:"100%",background:"white",borderRadius:99,transition:"width .4s ease"}}/>
          </div>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:24}}>
        <div style={{maxWidth:700,margin:"0 auto"}}>
          <div style={{background:"white",borderRadius:20,padding:"24px 28px",boxShadow:"0 4px 20px rgba(0,0,0,0.08)",marginBottom:18}}>
            <div style={{display:"inline-block",background:lectura.color,color:"white",fontFamily:"'Fredoka One',cursive",fontSize:17,padding:"3px 14px",borderRadius:20,marginBottom:12}}>Pregunta {idx+1}</div>
            <p style={{fontSize:"clamp(18px,3vw,22px)",fontWeight:800,color:"#1E293B",lineHeight:1.5}}>{p.pregunta}</p>
          </div>
          {p.tipo==="opcion" && (
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {p.opciones.map((op,i)=>{
                let bg="white",border="3px solid #E2E8F0",col="#1E293B";
                if(feedback!==null){
                  if(i===p.correcta){bg="#F0FDF4";border="3px solid #22C55E";col="#15803D";}
                  else if(i===respActual&&i!==p.correcta){bg="#FEF2F2";border="3px solid #EF4444";col="#DC2626";}
                  else{bg="#F8FAFC";col="#94A3B8";}
                }
                return (
                  <button key={i} onClick={()=>responder(i)} className={i===respActual?anim:""} style={{background:bg,border,color:col,padding:"15px 20px",borderRadius:16,textAlign:"left",fontSize:"clamp(15px,2.2vw,18px)",fontWeight:700,display:"flex",alignItems:"center",gap:12,cursor:feedback!==null?"default":"pointer"}}>
                    <span style={{width:34,height:34,borderRadius:10,flexShrink:0,background:feedback!==null&&i===p.correcta?"#22C55E":feedback!==null&&i===respActual&&i!==p.correcta?"#EF4444":"#F1F5F9",color:feedback!==null&&(i===p.correcta||i===respActual)?"white":"#64748B",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Fredoka One',cursive",fontSize:15}}>
                      {feedback!==null&&i===p.correcta?"✓":feedback!==null&&i===respActual&&i!==p.correcta?"✗":["A","B","C","D"][i]}
                    </span>
                    {op}
                  </button>
                );
              })}
              {feedback && <div style={{background:feedback==="ok"?"#F0FDF4":"#FEF2F2",border:`3px solid ${feedback==="ok"?"#22C55E":"#EF4444"}`,borderRadius:16,padding:"14px 20px",textAlign:"center",fontSize:"clamp(17px,3vw,21px)",fontWeight:800,color:feedback==="ok"?"#15803D":"#DC2626"}}>
                {feedback==="ok"?"🎉 ¡Muy bien! ¡Correcto!":"😅 No era esa. La respuesta correcta está en verde."}
              </div>}
            </div>
          )}
          {p.tipo==="abierta" && (
            <div>
              <div style={{background:lectura.colorLight,border:`2px solid ${lectura.color}44`,borderRadius:14,padding:"10px 16px",marginBottom:12,fontSize:15,color:"#64748B",fontWeight:700}}>✍️ Escribe tu respuesta. El maestro/a la revisará.</div>
              <textarea value={textos[idx]} onChange={e=>{const n=[...textos];n[idx]=e.target.value;setTextos(n);}} placeholder="Escribe aquí tu respuesta..." rows={5}
                style={{width:"100%",padding:16,fontSize:"clamp(16px,2.5vw,19px)",border:"3px solid #E2E8F0",borderRadius:16,outline:"none",resize:"vertical",fontWeight:600,color:"#1E293B",lineHeight:1.6}}
                onFocus={e=>e.target.style.border=`3px solid ${lectura.color}`}
                onBlur={e=>e.target.style.border="3px solid #E2E8F0"}/>
            </div>
          )}
        </div>
      </div>
      <div style={{padding:"16px 24px",background:"white",boxShadow:"0 -4px 20px rgba(0,0,0,0.06)"}}>
        <div style={{maxWidth:700,margin:"0 auto"}}>
          <button onClick={avanzar} disabled={!puedeAvanzar} style={{width:"100%",padding:16,background:puedeAvanzar?`linear-gradient(135deg,${lectura.color},${lectura.color}CC)`:"#E2E8F0",color:puedeAvanzar?"white":"#94A3B8",fontSize:"clamp(16px,2.8vw,20px)",borderRadius:16,cursor:puedeAvanzar?"pointer":"not-allowed",boxShadow:puedeAvanzar?`0 4px 16px ${lectura.color}44`:"none"}}>
            {esUltima?"Ver resultados 🏆":"Siguiente pregunta →"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   PANTALLA: RESULTADOS
═══════════════════════════════════════════ */
function PantallaResultados({resultado, onRepeat, onBiblioteca}) {
  const todas = [...LECTURAS_1C,...LECTURAS_3C];
  const lectura = todas.find(l=>l.id===resultado.lecturaId);
  const pct = resultado.total>0 ? Math.round((resultado.correctas/resultado.total)*100):0;
  const msg = pct===100?{e:"🏆",t:"¡Perfecto! ¡Todo correcto!",c:"#15803D"}:pct>=75?{e:"🌟",t:"¡Muy bien! ¡Casi todo!",c:"#0369A1"}:pct>=50?{e:"👍",t:"¡Bien! Puedes mejorar.",c:"#92400E"}:{e:"💪",t:"¡Sigue practicando!",c:"#DC2626"};
  return (
    <div className="screen" style={{background:"#FEF6E8"}}>
      <div style={{flex:1,overflowY:"auto",padding:24,display:"flex",flexDirection:"column",alignItems:"center",gap:20}}>
        <div style={{background:"white",borderRadius:24,padding:32,boxShadow:"0 8px 32px rgba(0,0,0,0.10)",textAlign:"center",maxWidth:600,width:"100%"}}>
          <div style={{fontSize:60,marginBottom:8}}>{msg.e}</div>
          <h2 style={{fontFamily:"'Fredoka One',cursive",fontSize:"clamp(20px,4vw,32px)",color:msg.c,marginBottom:8}}>{msg.t}</h2>
          <p style={{fontSize:"clamp(15px,2vw,18px)",color:"#64748B",fontWeight:700}}>{resultado.alumno} · {resultado.lecturaTitulo}</p>
          {resultado.total>0 && (
            <div style={{background:lectura?.colorLight||"#F1F5F9",borderRadius:16,padding:"16px 24px",margin:"18px 0",display:"flex",justifyContent:"center",gap:32}}>
              {[{v:resultado.correctas,l:"Correctas ✅",c:"#22C55E"},{v:resultado.total-resultado.correctas,l:"Incorrectas ❌",c:"#EF4444"},{v:resultado.total,l:"De tipo test",c:lectura?.color||"#64748B"}].map((s,i)=>(
                <div key={i} style={{textAlign:"center"}}>
                  <p style={{fontSize:"clamp(26px,4vw,36px)",fontWeight:900,color:s.c}}>{s.v}</p>
                  <p style={{fontSize:13,fontWeight:700,color:"#64748B"}}>{s.l}</p>
                </div>
              ))}
            </div>
          )}
        </div>
        <div style={{maxWidth:600,width:"100%"}}>
          <h3 style={{fontFamily:"'Fredoka One',cursive",fontSize:"clamp(17px,3vw,22px)",color:"#FF6B35",marginBottom:14}}>📋 Resumen de respuestas</h3>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {resultado.preguntas.map((pr,i)=>{
              const ok=pr.tipo==="opcion"&&resultado.respuestas[i]===pr.correcta;
              const fail=pr.tipo==="opcion"&&resultado.respuestas[i]!==pr.correcta;
              return (
                <div key={i} style={{background:"white",borderRadius:14,padding:"14px 18px",boxShadow:"0 2px 8px rgba(0,0,0,0.06)",borderLeft:`4px solid ${ok?"#22C55E":fail?"#EF4444":"#F59E0B"}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                    <p style={{fontSize:"clamp(13px,2vw,15px)",fontWeight:800,color:"#1E293B",flex:1}}><span style={{color:"#94A3B8"}}>P{i+1}. </span>{pr.pregunta}</p>
                    <span style={{fontSize:18,flexShrink:0}}>{ok?"✅":fail?"❌":"✍️"}</span>
                  </div>
                  {ok && <p style={{fontSize:13,color:"#15803D",fontWeight:700,marginTop:5}}>✅ {pr.opciones[pr.correcta]}</p>}
                  {fail && <div style={{marginTop:5}}>
                    <p style={{fontSize:13,color:"#DC2626",fontWeight:700}}>❌ Tu respuesta: {pr.opciones[resultado.respuestas[i]]||"—"}</p>
                    <p style={{fontSize:13,color:"#15803D",fontWeight:700}}>✅ Correcta: {pr.opciones[pr.correcta]}</p>
                  </div>}
                  {pr.tipo==="abierta"&&resultado.textosAbiertos[i]&&(
                    <div style={{background:"#FFFBEB",borderRadius:8,padding:"7px 12px",marginTop:6,border:"1.5px solid #FDE68A"}}>
                      <p style={{fontSize:12,color:"#92400E",fontWeight:800,marginBottom:2}}>✍️ Pendiente de corrección por el maestro/a:</p>
                      <p style={{fontSize:13,color:"#1E293B",fontWeight:600}}>"{resultado.textosAbiertos[i]}"</p>
                    </div>
                  )}

        </div>
        <div style={{maxWidth:600,width:"100%",display:"flex",gap:12,flexWrap:"wrap"}}>
          <button onClick={onRepeat} style={{flex:1,minWidth:180,padding:15,background:"white",color:"#FF6B35",fontSize:"clamp(14px,2.5vw,17px)",borderRadius:14,border:"3px solid #FF6B35",fontWeight:800}}>🔁 Repetir</button>
          <button onClick={onBiblioteca} style={{flex:1,minWidth:180,padding:15,background:"linear-gradient(135deg,#FF6B35,#FF9B6B)",color:"white",fontSize:"clamp(14px,2.5vw,17px)",borderRadius:14,fontWeight:800}}>📚 Más lecturas</button>
        </div>

    </div>
  );
}

/* ═══════════════════════════════════════════
   PANEL MAESTRO
═══════════════════════════════════════════ */
function PanelMaestro({onBack}) {
  const [resultados, setResultados] = useState(cargar());
  const [filtro, setFiltro] = useState("");
  const [cicloFiltro, setCicloFiltro] = useState("todos");
  const [expandido, setExpandido] = useState(null);
  const [confirmar, setConfirmar] = useState(false);
  const borrar = () => { borrarTodo(); setResultados([]); setConfirmar(false); };
  const ordenados = [...resultados].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const filtrados = ordenados.filter(r=>{
    const matchNombre = !filtro || r.alumno.toLowerCase().includes(filtro.toLowerCase());
    const matchCiclo = cicloFiltro==="todos" || r.ciclo===cicloFiltro;
    return matchNombre && matchCiclo;
  });
  const alumnos = [...new Set(resultados.map(r=>r.alumno))];
  const mediaNotas = resultados.filter(r=>r.total>0);
  const media = mediaNotas.length>0 ? Math.round(mediaNotas.reduce((s,r)=>s+(r.correctas/r.total*10),0)/mediaNotas.length*10)/10 : null;

  return (
    <div className="screen" style={{background:"#F8FAFC"}}>
      <div style={{background:"linear-gradient(135deg,#1E293B,#334155)",padding:"20px 24px",color:"white"}}>
        <div style={{maxWidth:900,margin:"0 auto"}}>
          <button onClick={onBack} style={{background:"rgba(255,255,255,0.15)",color:"white",padding:"6px 14px",borderRadius:10,fontSize:14,fontWeight:700,border:"2px solid rgba(255,255,255,0.3)",marginBottom:12}}>← Inicio</button>
          <h1 style={{fontFamily:"'Fredoka One',cursive",fontSize:"clamp(22px,4vw,32px)"}}>🧑‍🏫 Panel del Maestro/a</h1>
          <p style={{fontSize:14,opacity:.75,marginTop:4}}>{resultados.length} registros · {alumnos.length} alumnos/as</p>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:24}}>
        <div style={{maxWidth:900,margin:"0 auto"}}>
          {/* Stats */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:12,marginBottom:20}}>
            {[{i:"📖",v:resultados.length,l:"Total lecturas",c:"#3B82F6"},{i:"👦",v:alumnos.length,l:"Alumnos/as",c:"#10B981"},{i:"⭐",v:media?media+"/10":"—",l:"Nota media test",c:"#F59E0B"}].map((s,i)=>(
              <div key={i} style={{background:"white",borderRadius:14,padding:16,boxShadow:"0 2px 10px rgba(0,0,0,0.06)",textAlign:"center"}}>
                <div style={{fontSize:30}}>{s.i}</div>
                <div style={{fontSize:"clamp(18px,3vw,26px)",fontWeight:900,color:s.c}}>{s.v}</div>
                <div style={{fontSize:12,color:"#64748B",fontWeight:700}}>{s.l}</div>
              </div>
            ))}
          </div>
          {/* Filtros */}
          <div style={{background:"white",borderRadius:14,padding:"14px 18px",boxShadow:"0 2px 10px rgba(0,0,0,0.06)",marginBottom:16,display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
            <input type="text" value={filtro} onChange={e=>setFiltro(e.target.value)} placeholder="🔍 Buscar alumno/a..." style={{flex:1,minWidth:180,padding:"9px 14px",fontSize:15,border:"2px solid #E2E8F0",borderRadius:10,outline:"none",fontFamily:"'Nunito',sans-serif",fontWeight:700}}/>
            <select value={cicloFiltro} onChange={e=>setCicloFiltro(e.target.value)} style={{padding:"9px 14px",fontSize:15,border:"2px solid #E2E8F0",borderRadius:10,outline:"none",fontFamily:"'Nunito',sans-serif",fontWeight:700,background:"white",color:"#1E293B"}}>
              <option value="todos">Todos los ciclos</option>
              <option value="1C">Primer Ciclo</option>
              <option value="2C">Segundo Ciclo</option>
              <option value="3C">Tercer Ciclo</option>
              <option value="PT">Apoyo PT</option>
            </select>
            {!confirmar ? <button onClick={()=>setConfirmar(true)} style={{padding:"9px 18px",background:"#FEF2F2",color:"#DC2626",borderRadius:10,fontSize:14,fontWeight:800,border:"2px solid #FCA5A5"}}>🗑️ Borrar todo</button>
            : <div style={{display:"flex",gap:8}}>
                <button onClick={borrar} style={{padding:"9px 14px",background:"#EF4444",color:"white",borderRadius:10,fontSize:14,fontWeight:800,border:"none"}}>Confirmar</button>
                <button onClick={()=>setConfirmar(false)} style={{padding:"9px 14px",background:"#E2E8F0",color:"#64748B",borderRadius:10,fontSize:14,fontWeight:800,border:"none"}}>Cancelar</button>
              </div>}
          </div>
          {/* Lista */}
          {filtrados.length===0 ? (
            <div style={{background:"white",borderRadius:16,padding:48,textAlign:"center",boxShadow:"0 2px 10px rgba(0,0,0,0.06)"}}>
              <p style={{fontSize:44,marginBottom:10}}>📭</p>
              <p style={{fontSize:"clamp(16px,3vw,20px)",fontWeight:800,color:"#94A3B8"}}>{resultados.length===0?"Aún no hay resultados guardados":"No se encontraron resultados"}</p>
            </div>
          ) : (
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {filtrados.map(r=>{
                const todas=[...LECTURAS_1C,...LECTURAS_2C,...LECTURAS_3C,...LECTURAS_PT];
                const lect=todas.find(l=>l.id===r.lecturaId);
                const pct=r.total>0?Math.round((r.correctas/r.total)*100):null;
                const abiertas=r.textosAbiertos?.filter(t=>t&&t.trim()).length||0;
                const ciclo=CICLOS[r.ciclo];
                return (
                  <div key={r.id} style={{background:"white",borderRadius:14,boxShadow:"0 2px 8px rgba(0,0,0,0.06)",overflow:"hidden"}}>
                    <button onClick={()=>setExpandido(expandido===r.id?null:r.id)} style={{width:"100%",padding:"14px 18px",background:"transparent",display:"flex",alignItems:"center",gap:10,textAlign:"left",borderBottom:expandido===r.id?"2px solid #F1F5F9":"none"}}>
                      <span style={{fontSize:24,flexShrink:0}}>{lect?.icono||"📖"}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <p style={{fontWeight:900,fontSize:"clamp(13px,2vw,15px)",color:"#1E293B"}}>{r.alumno}</p>
                        <p style={{fontSize:12,color:"#64748B",fontWeight:700}}>{r.lecturaTitulo} · {formatFecha(r.fecha)}</p>
                        {ciclo&&<span style={{fontSize:11,background:ciclo.color+"22",color:ciclo.color,fontWeight:800,padding:"1px 7px",borderRadius:10,border:`1.5px solid ${ciclo.color}44`}}>{ciclo.label}</span>}
                      </div>
                      <div style={{display:"flex",gap:6,alignItems:"center",flexShrink:0}}>
                        {pct!==null&&<span style={{background:pct===100?"#F0FDF4":pct>=75?"#EFF6FF":pct>=50?"#FFFBEB":"#FEF2F2",color:pct===100?"#15803D":pct>=75?"#1D4ED8":pct>=50?"#92400E":"#DC2626",fontWeight:900,fontSize:13,padding:"3px 10px",borderRadius:20}}>{r.correctas}/{r.total} ✓</span>}
                        {abiertas>0&&<span style={{background:"#FFFBEB",color:"#92400E",fontWeight:800,fontSize:12,padding:"3px 8px",borderRadius:20,border:"1.5px solid #FDE68A"}}>✍️ {abiertas}</span>}
                        <span style={{color:"#94A3B8",fontSize:18}}>{expandido===r.id?"▲":"▼"}</span>
                      </div>
                    </button>
                    {expandido===r.id&&(
                      <div style={{padding:"14px 18px",background:"#F8FAFC"}}>
                        {r.preguntas.map((pr,i)=>{
                          const ok=pr.tipo==="opcion"&&r.respuestas[i]===pr.correcta;
                          const fail=pr.tipo==="opcion"&&r.respuestas[i]!==pr.correcta;
                          return (
                            <div key={i} style={{background:"white",borderRadius:10,padding:"10px 14px",marginBottom:6,borderLeft:`4px solid ${ok?"#22C55E":fail?"#EF4444":"#F59E0B"}`}}>
                              <p style={{fontSize:13,fontWeight:800,color:"#1E293B"}}>{i+1}. {pr.pregunta}</p>
                              {ok&&<p style={{fontSize:12,color:"#15803D",fontWeight:700,marginTop:3}}>✅ {pr.opciones[pr.correcta]}</p>}
                              {fail&&<div style={{marginTop:3}}><p style={{fontSize:12,color:"#DC2626",fontWeight:700}}>❌ Respondió: {pr.opciones[r.respuestas[i]]||"—"}</p><p style={{fontSize:12,color:"#15803D",fontWeight:700}}>✅ Correcta: {pr.opciones[pr.correcta]}</p></div>}
                              {pr.tipo==="abierta"&&r.textosAbiertos?.[i]&&<div style={{background:"#FFFBEB",borderRadius:8,padding:"6px 10px",marginTop:5,border:"1.5px solid #FDE68A"}}><p style={{fontSize:11,color:"#92400E",fontWeight:800,marginBottom:2}}>✍️ PENDIENTE DE VALORACIÓN:</p><p style={{fontSize:12,color:"#1E293B",fontWeight:600}}>"{r.textosAbiertos[i]}"</p></div>}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   APP PRINCIPAL
═══════════════════════════════════════════ */
function App() {
  const [pantalla, setPantalla] = useState("inicio");
  const [alumno, setAlumno] = useState("");
  const [cicloKey, setCicloKey] = useState(null);
  const [lectura, setLectura] = useState(null);
  const [resultado, setResultado] = useState(null);

  if (pantalla==="inicio") return <PantallaInicio onStart={n=>{setAlumno(n);setPantalla("ciclo");}} onMaestro={()=>setPantalla("maestro")}/>;
  if (pantalla==="ciclo") return <PantallaSelectCiclo alumno={alumno} onSelect={k=>{setCicloKey(k);setPantalla("biblioteca");}} onCerrar={()=>setPantalla("inicio")}/>;
  if (pantalla==="biblioteca") return <PantallaBiblioteca alumno={alumno} cicloKey={cicloKey} onSelect={l=>{setLectura(l);setPantalla("lectura");}} onVolver={()=>setPantalla("ciclo")}/>;
  if (pantalla==="lectura"&&lectura) return <PantallaLectura lectura={lectura} onStart={()=>setPantalla("preguntas")} onBack={()=>setPantalla("biblioteca")}/>;
  if (pantalla==="preguntas"&&lectura) return <PantallaPreguntas lectura={lectura} alumno={alumno} cicloKey={cicloKey} onFinish={r=>{setResultado(r);setPantalla("resultados");}}/>;
  if (pantalla==="resultados"&&resultado) return <PantallaResultados resultado={resultado} onRepeat={()=>setPantalla("lectura")} onBiblioteca={()=>setPantalla("biblioteca")}/>;
  if (pantalla==="maestro") return <PanelMaestro onBack={()=>setPantalla("inicio")}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
