  {id:14,titulo:"El dragón Regadera",nivel:"2º",tipo:"Cuento",icono:"🐉",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"Un dragón diferente: en lugar de echar fuego, echa agua. ¿Servirá para algo?",
   texto:`Esta es la historia de un dragón que no era como los demás dragones. En lugar de echar fuego, echaba agua. Por eso le llamaban Regadera.

A Regadera le hubiera gustado poder sacar fuego por su boca como hacían sus amigos, pero no había manera. Cada vez que la abría, en lugar de fuego echaba un gran chorro de agua.

Un buen día, Regadera se quedó triste y solo, sentado al borde del camino.
—¿Qué te sucede? —le preguntó una niña que pasaba.
—¡Búa! No puedo echar fuego. Sólo echo agua. No sirvo para nada.
—No te preocupes —dijo la niña—. Te llevaré a mi ciudad.

La niña llevó a Regadera al alcalde. Sus ayudantes dijeron:
—¡Puede bañarnos cuando hace calor como si fuera una ducha!
—¡Puede ayudar a los bomberos a apagar el fuego!
—¡Y a regar las flores del parque!

Regadera se sintió muy feliz. Desde entonces trabaja en aquella ciudad y está muy contento.`,
   preguntas:[
     {tipo:"abierta",pregunta:"¿Por qué al dragón le llamaban Regadera?"},
     {tipo:"abierta",pregunta:"¿Con quién se encontró el dragón triste?"},
     {tipo:"abierta",pregunta:"¿De qué manera fue útil Regadera en la ciudad?"},
     {tipo:"opcion",pregunta:"¿Cómo se sintió Regadera al final?",opciones:["Triste y solo","Muy feliz y contento","Asustado"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué moraleja tiene este cuento?",opciones:["Todos tenemos algo especial que nos hace útiles","Los dragones no sirven para nada","Hay que echar fuego para ser útil"],correcta:0},
     {tipo:"abierta",pregunta:"¿Qué nombre le pondrías a un dragón que echara caramelos por la boca?"},
   ]},
  {id:15,titulo:"El colegio en el fondo del mar",nivel:"1º-2º",tipo:"Poema",icono:"🐟",color:"#0284C7",colorLight:"#E0F2FE",
   intro:"Un divertido poema de Gloria Fuertes sobre un colegio muy especial: ¡bajo el mar!",
   texto:`Hay un colegio
en el fondo del mar,
y allí los «bonitos»
bajan a estudiar.

Y el que más escribe
es el calamar,
y el que menos sabe
no sabe la «a».

A dar la lección
«Pez Espada» va,
lleva su puntero
para señalar.

Y después, muy serios,
todos a rezar:
Pupitre de perlas,
bancos de coral,
encerado verde
y tiza de sal.

Muchos pececitos
ríen al sumar.
Y el buzo a los peces
bajaba a asustar,
con su cara blanca
dentro de un cristal.

— Gloria Fuertes`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Dónde está la escuela del poema?",opciones:["En el fondo del mar","En la playa","En un submarino"],correcta:0},
     {tipo:"opcion",pregunta:"¿Qué dice el poema del calamar?",opciones:["Que no sabe la «a»","Que es quien más escribe","Que es el que enseña a los demás"],correcta:1},
     {tipo:"opcion",pregunta:"¿Quién enseña a los demás?",opciones:["El bonito","El calamar","El Pez Espada"],correcta:2},
     {tipo:"opcion",pregunta:"¿Dónde se encuentran las mejores playas según el poema?",opciones:["Al Norte del colegio","Al Este del colegio","Al Sur del colegio"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué dice Gloria Fuertes «tiza de sal»?",opciones:["La tiza tiene sabor salado","La tiza y la sal son de color blanco","Para hacer tiza se necesita sal"],correcta:1},
     {tipo:"opcion",pregunta:"¿Por qué el buzo lleva su cara dentro de un cristal?",opciones:["Porque era miope","Los buzos llevan casco con cristal para respirar","Estaba en un submarino"],correcta:1},
   ]},
  {id:16,titulo:"La mariposa y la flor",nivel:"1\u00ba",tipo:"Cuento",icono:"\ud83e\udd8b",color:"#EC4899",colorLight:"#FCE7F3",
   intro:"Una mariposa busca la flor m\u00e1s bonita del jard\u00edn. \u00bfLa encontrar\u00e1?",
   texto:`Una mariposa volaba de flor en flor buscando la m\u00e1s bonita del jard\u00edn.

Se pos\u00f3 en una rosa roja.
\u2014\u00bfEres t\u00fa la m\u00e1s bonita? \u2014pregunt\u00f3.
\u2014Tal vez, pero el lirio es muy elegante \u2014respondi\u00f3 la rosa.

Fue al lirio blanco.
\u2014Yo soy elegante, pero el girasol es m\u00e1s alegre \u2014dijo el lirio.

Por fin lleg\u00f3 al girasol amarillo. El girasol le sonri\u00f3 y la mariposa sinti\u00f3 calor en sus alas.
\u2014\u00a1Esta es mi flor favorita! \u2014dijo la mariposa.

Y desde ese d\u00eda volv\u00eda siempre al girasol.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 buscaba la mariposa?",opciones:["La flor m\u00e1s grande","La flor m\u00e1s bonita","La flor m\u00e1s perfumada"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 color era la rosa?",opciones:["Blanca","Amarilla","Roja"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo describi\u00f3 el lirio al girasol?",opciones:["M\u00e1s bonito","M\u00e1s alegre","M\u00e1s grande"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l fue la flor favorita de la mariposa?",opciones:["La rosa","El lirio","El girasol"],correcta:2},
     {tipo:"abierta",pregunta:"\u00bfCu\u00e1l es tu flor favorita? \u00bfPor qu\u00e9?"},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo se sinti\u00f3 la mariposa junto al girasol?",opciones:["Triste","Con calor y contenta","Asustada"],correcta:1},
   ]},
  {id:17,titulo:"Los animales del bosque",nivel:"1\u00ba",tipo:"Texto informativo",icono:"\ud83e\udd8a",color:"#10B981",colorLight:"#D1FAE5",
   intro:"Descubre qu\u00e9 animales viven en el bosque y c\u00f3mo son sus costumbres.",
   texto:`En el bosque viven muchos animales.

El zorro tiene el pelo anaranjado y es muy listo. Come frutas, insectos y peque\u00f1os animales.

El erizo tiene el cuerpo cubierto de p\u00faas. Cuando tiene miedo, se hace una bolita para protegerse.

El b\u00faho duerme de d\u00eda y caza de noche. Tiene los ojos muy grandes para ver en la oscuridad.

La ardilla guarda bellotas en el suelo para el invierno. A veces se olvida de d\u00f3nde las escondi\u00f3 y ayuda sin querer a plantar nuevos \u00e1rboles.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfDe qu\u00e9 color es el pelo del zorro?",opciones:["Gris","Anaranjado","Marr\u00f3n"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hace el erizo cuando tiene miedo?",opciones:["Corre muy r\u00e1pido","Se hace una bolita","Se sube a un \u00e1rbol"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ndo duerme el b\u00faho?",opciones:["De noche","De d\u00eda","Todo el rato"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 guarda la ardilla para el invierno?",opciones:["Nueces","Bellotas","Hojas"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 pasa cuando la ardilla olvida sus escondites?",opciones:["Se muere de hambre","Ayuda a plantar \u00e1rboles sin querer","Pide comida a otros animales"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfCu\u00e1l de estos animales del bosque te parece m\u00e1s interesante? \u00bfPor qu\u00e9?"},
   ]},
  {id:18,titulo:"La receta de galletas",nivel:"1\u00ba",tipo:"Texto funcional",icono:"\ud83c\udf6a",color:"#D97706",colorLight:"#FEF3C7",
   intro:"Un texto funcional muy \u00fatil: \u00a1la receta para hacer galletas en casa!",
   texto:`GALLETAS DE MANTEQUILLA

Ingredientes para 20 galletas:
\u2022 200 g de harina
\u2022 100 g de mantequilla
\u2022 80 g de az\u00facar
\u2022 1 huevo
\u2022 Una pizca de sal

Preparaci\u00f3n:
1. Mezcla la mantequilla con el az\u00facar.
2. A\u00f1ade el huevo y la sal.
3. Agrega la harina poco a poco.
4. Forma bolitas y apl\u00e1stalas.
5. Hornea 15 minutos a 180 grados.

\u00a1Deja que se enfr\u00eden antes de comerlas!`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntas galletas salen con esta receta?",opciones:["10","15","20"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos gramos de harina hacen falta?",opciones:["100 g","150 g","200 g"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos huevos se necesitan?",opciones:["1","2","3"],correcta:0},
     {tipo:"opcion",pregunta:"\u00bfA cu\u00e1ntos grados hay que hornear las galletas?",opciones:["100 grados","180 grados","250 grados"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1nto tiempo se hornean?",opciones:["5 minutos","10 minutos","15 minutos"],correcta:2},
     {tipo:"abierta",pregunta:"\u00bfHas hecho alguna vez galletas o alg\u00fan otro dulce en casa? \u00bfQu\u00e9 hiciste?"},
   ]},
  {id:19,titulo:"El osito tiene miedo",nivel:"1\u00ba",tipo:"Cuento",icono:"\ud83d\udc3b",color:"#6366F1",colorLight:"#E0E7FF",
   intro:"Bruno el osito tiene miedo a la oscuridad. \u00bfQu\u00e9 pasar\u00e1 cuando se apague la luz?",
   texto:`Bruno era un osito que ten\u00eda mucho miedo a la oscuridad. Cada noche, cuando su mam\u00e1 apagaba la luz, se tapaba hasta la cabeza con la manta.

\u2014\u00a1Mam\u00e1, hay un monstruo en mi cuarto! \u2014grit\u00f3 una noche.

La mam\u00e1 osa entr\u00f3 con una linterna y alumbr\u00f3 cada rinc\u00f3n.
\u2014\u00bfLo ves? No hay ning\u00fan monstruo. Solo es tu abrigo colgado en la silla.

Bruno se ri\u00f3. El \u00abmonstruo\u00bb era su propio abrigo.

Desde entonces, Bruno dej\u00f3 su osito de peluche en la silla antes de dormir.
\u2014Ahora ya no me da miedo \u2014dijo\u2014, porque s\u00e9 que es mi osito el que me cuida.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfDe qu\u00e9 ten\u00eda miedo Bruno?",opciones:["De los perros","De la oscuridad","De las ara\u00f1as"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 cre\u00eda que hab\u00eda en su cuarto?",opciones:["Un ladr\u00f3n","Un fantasma","Un monstruo"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 era en realidad el \u00abmonstruo\u00bb?",opciones:["Su abrigo colgado en la silla","Una sombra en la pared","Su mochila del colegio"],correcta:0},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hizo Bruno para no tener miedo?",opciones:["Dej\u00f3 la luz encendida","Puso su osito de peluche en la silla","Durmi\u00f3 con su mam\u00e1"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo reaccion\u00f3 Bruno cuando descubri\u00f3 la verdad?",opciones:["Se enfad\u00f3","Se ri\u00f3","Llor\u00f3"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfTienes miedo a algo? \u00bfC\u00f3mo intentas superarlo?"},
   ]},
  {id:20,titulo:"Las cuatro estaciones",nivel:"1\u00ba",tipo:"Texto informativo",icono:"\ud83c\udf42",color:"#F59E0B",colorLight:"#FEF3C7",
   intro:"\u00bfSabes qu\u00e9 cambia en cada estaci\u00f3n del a\u00f1o? \u00a1Desc\u00fabrelo aqu\u00ed!",
   texto:`El a\u00f1o tiene cuatro estaciones.

En primavera hace calor suave, llueve a veces y nacen muchas flores. Los p\u00e1jaros construyen sus nidos.

En verano hace mucho calor. Los d\u00edas son largos y las noches cortas. Muchas familias van a la playa o a la piscina.

En oto\u00f1o las hojas de los \u00e1rboles se ponen amarillas y caen al suelo. Empieza a hacer fr\u00edo.

En invierno hace mucho fr\u00edo. En algunas zonas nieva. Los d\u00edas son cortos y las noches muy largas.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntas estaciones tiene el a\u00f1o?",opciones:["Tres","Cuatro","Cinco"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfEn qu\u00e9 estaci\u00f3n nacen muchas flores?",opciones:["Oto\u00f1o","Invierno","Primavera"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 pasa con las hojas en oto\u00f1o?",opciones:["Se ponen verdes","Se ponen amarillas y caen","Crecen mucho"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfEn qu\u00e9 estaci\u00f3n hace m\u00e1s calor?",opciones:["Primavera","Verano","Oto\u00f1o"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfEn qu\u00e9 estaci\u00f3n los d\u00edas son m\u00e1s cortos?",opciones:["Verano","Primavera","Invierno"],correcta:2},
     {tipo:"abierta",pregunta:"\u00bfCu\u00e1l es tu estaci\u00f3n favorita del a\u00f1o? \u00bfPor qu\u00e9?"},
   ]},
  {id:21,titulo:"El zorro y las uvas",nivel:"1\u00ba-2\u00ba",tipo:"F\u00e1bula",icono:"\ud83c\udf47",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"Un zorro hambriento ve un racimo de uvas. Pero est\u00e1n muy altas... \u00bfqu\u00e9 dir\u00e1 para consolarse?",
   texto:`Un zorro estaba muy hambriento. Al pasar por un vi\u00f1edo, vio un hermoso racimo de uvas maduras que colgaba de lo alto de una parra.

Se puso de puntillas, pero no lleg\u00f3.

Dio un gran salto, pero tampoco las alcanz\u00f3.

Salt\u00f3 tres veces m\u00e1s, pero siempre se quedaba corto.

Por fin, cansado y sin esperanza, se alej\u00f3 diciendo:
\u2014\u00a1Bah! \u00a1De todas formas esas uvas estaban verdes y habr\u00edan estado amargas!

Moraleja: Es f\u00e1cil despreciar lo que no podemos conseguir.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 quer\u00eda comer el zorro?",opciones:["Manzanas","Uvas","Peras"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 no pudo coger las uvas?",opciones:["Estaban demasiado maduras","Estaban demasiado altas","Las vigilaba un perro"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntas veces salt\u00f3 el zorro?",opciones:["Dos","Cuatro o m\u00e1s","Una sola vez"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 dijo el zorro para consolarse?",opciones:["Que las uvas estaban verdes y amargas","Que no le gustaban las uvas","Que ya hab\u00eda comido bastante"],correcta:0},
     {tipo:"opcion",pregunta:"\u00bfEra verdad lo que dijo el zorro?",opciones:["S\u00ed, las uvas estaban verdes","No, solo se consolaba de no haberlas alcanzado","No se puede saber"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfAlguna vez has dicho que algo no te importaba cuando en realidad s\u00ed te importaba? \u00bfQu\u00e9 pas\u00f3?"},
   ]},
  {id:22,titulo:"La cigarra y la hormiga",nivel:"1\u00ba-2\u00ba",tipo:"F\u00e1bula",icono:"\ud83c\udfb8",color:"#0891B2",colorLight:"#CFFAFE",
   intro:"La cigarra canta todo el verano mientras la hormiga trabaja. Cuando llega el invierno... \u00bfqu\u00e9 pasar\u00e1?",
   texto:`Todo el verano, la cigarra cant\u00f3 y bail\u00f3 bajo el sol, mientras la hormiga trabajaba sin parar, recogiendo comida para el invierno.

\u2014\u00bfPor qu\u00e9 no descansas y disfrutas del sol? \u2014le dijo la cigarra a la hormiga.
\u2014Porque debo preparar comida para cuando llegue el fr\u00edo \u2014respondi\u00f3 la hormiga.

Lleg\u00f3 el invierno y la cigarra no ten\u00eda nada que comer. Hambrienta y tiritando de fr\u00edo, fue a pedir ayuda a la hormiga.

La hormiga la mir\u00f3 y dijo:
\u2014\u00bfCantabas en verano? Pues baila en invierno.

Pero, despu\u00e9s, se compadeci\u00f3 y le dio algo de comer. Le pidi\u00f3 solo que recordara la lecci\u00f3n: hay que trabajar antes de divertirse.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hac\u00eda la cigarra en verano?",opciones:["Trabajaba como la hormiga","Cantaba y bailaba","Dorm\u00eda todo el d\u00eda"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfPara qu\u00e9 recog\u00eda comida la hormiga?",opciones:["Para venderla","Para el invierno","Para d\u00e1rsela a la cigarra"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 le pas\u00f3 a la cigarra en invierno?",opciones:["Se puso enferma","No ten\u00eda nada que comer","Se fue a otro pa\u00eds"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hizo la hormiga al final?",opciones:["Le cerr\u00f3 la puerta a la cigarra","Se compadeci\u00f3 y le dio algo de comer","Le pidi\u00f3 dinero"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l es la moraleja de esta f\u00e1bula?",opciones:["Hay que cantar mucho en verano","Hay que trabajar antes de divertirse","Las hormigas son malas"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfEres m\u00e1s parecido a la cigarra o a la hormiga? \u00bfPor qu\u00e9?"},
   ]},
  {id:23,titulo:"El cuervo y el zorro",nivel:"1\u00ba-2\u00ba",tipo:"F\u00e1bula",icono:"\ud83d\udc26\u200d\u2b1b",color:"#1E293B",colorLight:"#F1F5F9",
   intro:"Un cuervo tiene un trozo de queso en el pico. El zorro quiere quit\u00e1rselo con un truco.",
   texto:`Un cuervo encontr\u00f3 un trozo de queso y se pos\u00f3 en la rama de un \u00e1rbol para com\u00e9rselo.

Un zorro lo vio y se le hizo la boca agua.

\u2014\u00a1Qu\u00e9 plumas tan brillantes tienes! \u2014le dijo con voz melosa\u2014. Seguro que tu voz es tan bonita como tu aspecto. \u00bfMe cantar\u00edas algo?

El cuervo, que era muy vanidoso, abri\u00f3 el pico para cantar... y el queso cay\u00f3 al suelo.

El zorro lo atrap\u00f3 al vuelo y se lo comi\u00f3 riendo.

\u2014Tu voz es horrible, pero has sido muy \u00fatil \u2014le dijo antes de irse.

Moraleja: Cuidado con los halagos de quien solo quiere aprovecharse.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 ten\u00eda el cuervo en el pico?",opciones:["Un trozo de pan","Un trozo de queso","Una manzana"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 estrategia us\u00f3 el zorro para enga\u00f1ar al cuervo?",opciones:["Le asust\u00f3 para que volara","Le halag\u00f3 dici\u00e9ndole que era muy guapo","Le ofreci\u00f3 m\u00e1s comida"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 el cuervo abri\u00f3 el pico?",opciones:["Para defender su comida","Para cantar, vanidoso","Para pedir socorro"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 pas\u00f3 cuando el cuervo abri\u00f3 el pico?",opciones:["Se escap\u00f3 volando","El queso cay\u00f3 al suelo","El zorro se asust\u00f3"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 nos ense\u00f1a esta f\u00e1bula?",opciones:["Que los cuervos cantan muy bien","Que hay que desconfiar de los halagos interesados","Que el queso es muy rico"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfAlguien te ha dicho alguna vez algo muy bonito para conseguir algo de ti? \u00bfQu\u00e9 pas\u00f3?"},
   ]},
  {id:24,titulo:"El se\u00f1or \u00e1rbol",nivel:"2\u00ba",tipo:"Cuento",icono:"\ud83c\udf32",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"El viejo \u00e1rbol del parque tiene mucho que contar. \u00a1Ha visto crecer a tres generaciones!",
   texto:`En el parque del pueblo hab\u00eda un \u00e1rbol muy viejo y muy grande. Los ni\u00f1os se sentaban bajo su sombra en verano. Los p\u00e1jaros hac\u00edan sus nidos entre sus ramas. Y en oto\u00f1o, sus hojas amarillas alfombraban el suelo.

Un d\u00eda, un ni\u00f1o llamado Jaime le pregunt\u00f3:
\u2014Se\u00f1or \u00e1rbol, \u00bfcu\u00e1ntos a\u00f1os tienes?

El \u00e1rbol no pod\u00eda hablar, pero Jaime cont\u00f3 los anillos de una rama que hab\u00eda ca\u00eddo al suelo. Hab\u00eda cien anillos.

\u2014\u00a1Cien a\u00f1os! \u2014exclam\u00f3 Jaime\u2014. \u00a1Habr\u00e1s visto much\u00edsimas cosas!

Y se qued\u00f3 pensando en todos los ni\u00f1os que habr\u00edan jugado bajo aquel \u00e1rbol antes que \u00e9l.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfD\u00f3nde estaba el \u00e1rbol viejo?",opciones:["En un jard\u00edn privado","En el bosque","En el parque del pueblo"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfPara qu\u00e9 usaban el \u00e1rbol en verano?",opciones:["Para esconderse de la lluvia","Para sentarse a su sombra","Para recoger fruta"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo supo Jaime la edad del \u00e1rbol?",opciones:["Ley\u00f3 una placa","Cont\u00f3 los anillos de una rama ca\u00edda","Lo busc\u00f3 en internet"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos a\u00f1os ten\u00eda el \u00e1rbol?",opciones:["50 a\u00f1os","75 a\u00f1os","100 a\u00f1os"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hicieron los p\u00e1jaros en las ramas del \u00e1rbol?",opciones:["Cantaron todo el d\u00eda","Construyeron sus nidos","Comieron sus hojas"],correcta:1},
     {tipo:"abierta",pregunta:"Si el \u00e1rbol pudiera hablar, \u00bfqu\u00e9 crees que contar\u00eda sobre todas las cosas que ha visto?"},
   ]},
  {id:25,titulo:"El pez arco\u00edris",nivel:"1\u00ba",tipo:"Cuento",icono:"\ud83d\udc20",color:"#06B6D4",colorLight:"#CFFAFE",
   intro:"Un pez tiene escamas de todos los colores. Pero es el m\u00e1s solitario del mar. \u00bfPor qu\u00e9?",
   texto:`En el fondo del mar viv\u00eda un pez con escamas de todos los colores: rojas, azules, verdes y doradas. Era el pez m\u00e1s bonito de todo el oc\u00e9ano.

Pero el pez arco\u00edris no ten\u00eda amigos. Los dem\u00e1s peces quer\u00edan jugar con \u00e9l, pero \u00e9l no les hac\u00eda caso porque cre\u00eda que era mejor que todos.

Un d\u00eda, el pez m\u00e1s peque\u00f1o del mar le pidi\u00f3 una sola escama de color.

El pez arco\u00edris pens\u00f3 mucho. Al final se la dio. Y luego otra. Y otra m\u00e1s.

Cada vez que regalaba una escama, sent\u00eda una alegr\u00eda nueva. Al final ten\u00eda pocas escamas de colores, pero muchos amigos.

Y descubri\u00f3 que eso era mucho mejor.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo eran las escamas del pez arco\u00edris?",opciones:["Solo azules","De todos los colores","Solo doradas"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 no ten\u00eda amigos el pez?",opciones:["Porque viv\u00eda muy lejos","Porque cre\u00eda que era mejor que todos","Porque era muy t\u00edmido"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 le pidi\u00f3 el pez m\u00e1s peque\u00f1o?",opciones:["Que jugara con \u00e9l","Una sola escama de color","Que le ense\u00f1ara a nadar"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo se sent\u00eda el pez cada vez que regalaba una escama?",opciones:["Triste por perderla","Con una alegr\u00eda nueva","Asustado"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 aprendi\u00f3 el pez al final?",opciones:["Que tener escamas bonitas es lo m\u00e1s importante","Que tener amigos es mejor que ser el m\u00e1s bonito","Que los peces peque\u00f1os son aburridos"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfCrees que es mejor ser el m\u00e1s guapo o tener buenos amigos? \u00bfPor qu\u00e9?"},
   ]},
  {id:26,titulo:"Invitaci\u00f3n de cumplea\u00f1os",nivel:"1\u00ba",tipo:"Texto funcional",icono:"\ud83c\udf82",color:"#EC4899",colorLight:"#FCE7F3",
   intro:"Un texto funcional muy cotidiano: una invitaci\u00f3n de cumplea\u00f1os. \u00a1Atenci\u00f3n a todos los datos!",
   texto:`\u00a1EST\u00c1S INVITADO!

Hola, amigo/a:

Me llamo Luc\u00eda y voy a celebrar mi 7\u00ba cumplea\u00f1os.

\ud83d\udcc5 D\u00eda: s\u00e1bado 12 de marzo
\ud83d\udd54 Hora: a las 17:00 h
\ud83d\udccd Lugar: Parque Infantil Las Palmeras (junto a la fuente grande)

Habr\u00e1 merienda, juegos y tarta de chocolate. \ud83c\udf89

Por favor, dile a tus pap\u00e1s que llamen al 600 123 456 para confirmar que vendr\u00e1s.

\u00a1Te espero!
Un beso,
Luc\u00eda \u2764\ufe0f`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQui\u00e9n organiza la fiesta?",opciones:["Paula","Luc\u00eda","Laura"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos a\u00f1os va a cumplir?",opciones:["6 a\u00f1os","7 a\u00f1os","8 a\u00f1os"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 d\u00eda es la fiesta?",opciones:["Viernes 12","S\u00e1bado 12","Domingo 13"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfA qu\u00e9 hora empieza?",opciones:["A las 16 h","A las 17 h","A las 18 h"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 tipo de tarta habr\u00e1?",opciones:["De fresa","De vainilla","De chocolate"],correcta:2},
     {tipo:"abierta",pregunta:"\u00bfC\u00f3mo se confirma la asistencia? \u00bfY si no puedes ir, qu\u00e9 har\u00edas?"},
   ]},
  {id:27,titulo:"El rat\u00f3n valiente",nivel:"1\u00ba",tipo:"Cuento",icono:"\ud83d\udc2d",color:"#6366F1",colorLight:"#E0E7FF",
   intro:"Rat\u00f3n P\u00e9rez tiene que cruzar el gran sal\u00f3n de la casa. \u00a1Y hay un gato dormido justo en medio!",
   texto:`Rat\u00f3n P\u00e9rez necesitaba cruzar el gran sal\u00f3n para llegar a la cocina. Pero justo en el centro hab\u00eda un enorme gato dormido.

Sus amigos le dijeron:
\u2014\u00a1No vayas! El gato te agarrar\u00e1.

Pero Rat\u00f3n P\u00e9rez respir\u00f3 hondo y dio un primer paso. Luego otro. Camin\u00f3 muy despacio, sin hacer ning\u00fan ruido, pegado a la pared.

El gato resopl\u00f3 y movi\u00f3 una pata. Rat\u00f3n P\u00e9rez se qued\u00f3 quieto como una estatua.

El gato sigui\u00f3 durmiendo.

Paso a paso, Rat\u00f3n P\u00e9rez lleg\u00f3 a la cocina. All\u00ed encontr\u00f3 queso, nueces y pan.

\u2014El valiente no es el que no tiene miedo \u2014le cont\u00f3 a sus amigos\u2014. Es el que tiene miedo y sigue adelante.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfA d\u00f3nde quer\u00eda ir Rat\u00f3n P\u00e9rez?",opciones:["Al dormitorio","Al jard\u00edn","A la cocina"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hab\u00eda en medio del sal\u00f3n?",opciones:["Un perro dormido","Un gato dormido","Una trampa para ratones"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo cruz\u00f3 el rat\u00f3n el sal\u00f3n?",opciones:["Corriendo muy r\u00e1pido","Muy despacio y pegado a la pared","Volando con un globo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 encontr\u00f3 Rat\u00f3n P\u00e9rez en la cocina?",opciones:["Solo pan","Queso, nueces y pan","Leche y galletas"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 aprendemos sobre el valor en este cuento?",opciones:["Los valientes no tienen miedo","El valiente es el que act\u00faa aunque tenga miedo","Hay que evitar el peligro siempre"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfRecuerdas alguna vez en que hiciste algo aunque ten\u00edas miedo? \u00bfC\u00f3mo te sentiste despu\u00e9s?"},
   ]},
  {id:28,titulo:"El agua",nivel:"2\u00ba",tipo:"Texto informativo",icono:"\ud83d\udca7",color:"#0284C7",colorLight:"#E0F2FE",
   intro:"El agua es muy importante para la vida. \u00a1Descubre todo sobre ella!",
   texto:`El agua cubre casi tres cuartas partes de la Tierra. La encontramos en los mares, los r\u00edos, los lagos y en forma de hielo en los polos.

Las personas necesitamos agua para vivir. Sin beber agua, un ser humano no podr\u00eda sobrevivir m\u00e1s de tres d\u00edas.

El agua que bebemos viene de r\u00edos y embalses. Antes de llegar a nuestro grifo, se limpia en una estaci\u00f3n de tratamiento.

Debemos cuidar el agua porque es un recurso muy valioso. Podemos ahorrarla cerrando el grifo cuando nos lavamos los dientes y duch\u00e1ndonos en lugar de ba\u00f1arnos.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 parte de la Tierra cubre el agua?",opciones:["La mitad","Casi tres cuartas partes","Solo una cuarta parte"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1nto tiempo puede vivir una persona sin beber agua?",opciones:["Un d\u00eda","Tres d\u00edas","Una semana"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfDe d\u00f3nde viene el agua que bebemos?",opciones:["Del mar directamente","De r\u00edos y embalses","Del suelo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfD\u00f3nde se limpia el agua antes de llegar al grifo?",opciones:["En el r\u00edo","En una estaci\u00f3n de tratamiento","En los embalses"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo podemos ahorrar agua?",opciones:["Dejando el grifo abierto siempre","Ba\u00f1\u00e1ndonos m\u00e1s que ducharnos","Cerrando el grifo al lavarnos los dientes"],correcta:2},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 otras formas de ahorrar agua se te ocurren?"},
   ]},
  {id:29,titulo:"El monstruo de colores",nivel:"1\u00ba",tipo:"Cuento",icono:"\ud83d\udc7e",color:"#EC4899",colorLight:"#FCE7F3",
   intro:"El Monstruo de Colores est\u00e1 muy confundido porque tiene todos sus sentimientos mezclados. \u00bfLe ayudamos a ordenarlos?",
   texto:`El Monstruo de Colores estaba hecho un l\u00edo. Ten\u00eda todos sus sentimientos mezclados y no sab\u00eda qu\u00e9 le pasaba.

Una ni\u00f1a le ayud\u00f3 a separarlos en tarros de colores.

El amarillo era la alegr\u00eda. Lo pon\u00edan cuando jugaba y re\u00eda.
El azul era la tristeza. Aparec\u00eda cuando echaba de menos a sus amigos.
El rojo era la rabia. Surg\u00eda cuando algo no era justo.
El negro era el miedo. Llegaba cuando estaba solo en la oscuridad.
El verde era la calma. La sent\u00eda cuando respiraba despacio en el campo.

Cuando orden\u00f3 todos sus sentimientos, el Monstruo sonri\u00f3.
\u2014Ahora s\u00e9 lo que me pasa \u2014dijo\u2014. \u00a1Todos los sentimientos son importantes!`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 le pasaba al Monstruo de Colores?",opciones:["Ten\u00eda todos los sentimientos mezclados","Estaba muy enfadado","No ten\u00eda sentimientos"],correcta:0},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 color representa la alegr\u00eda?",opciones:["Azul","Rojo","Amarillo"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 color es la tristeza?",opciones:["Azul","Verde","Negro"],correcta:0},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 le produce la calma al Monstruo?",opciones:["Jugar con sus amigos","Respirar despacio en el campo","Ver la televisi\u00f3n"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 aprendi\u00f3 el Monstruo al final?",opciones:["Que solo la alegr\u00eda es buena","Que todos los sentimientos son importantes","Que los sentimientos dan miedo"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfDe qu\u00e9 color ser\u00eda hoy tu sentimiento? \u00bfPor qu\u00e9?"},
   ]},
  {id:30,titulo:"El ni\u00f1o desordenado",nivel:"2\u00ba",tipo:"Cuento",icono:"\ud83e\uddf8",color:"#F59E0B",colorLight:"#FEF3C7",
   intro:"La habitaci\u00f3n de Marcos es un caos total. Un d\u00eda no encuentra nada y eso le hace pensar...",
   texto:`La habitaci\u00f3n de Marcos era un desastre. Hab\u00eda juguetes en el suelo, ropa encima de la cama y libros por todas partes.

Un d\u00eda, justo antes de ir al colegio, Marcos no encontraba su mochila.

\u2014\u00bfHas visto mi mochila, mam\u00e1?
\u2014Estar\u00e1 en tu cuarto \u2014respondi\u00f3 ella sin moverse del sitio.

Marcos busc\u00f3 durante diez minutos. No la encontraba por ning\u00fan lado.

Al final, la mam\u00e1 entr\u00f3 y la encontr\u00f3 debajo de tres camisetas, dos libros y un futbol\u00edn de mesa.

\u2014Si ordenas tus cosas, las encontrar\u00e1s cuando las necesites \u2014le dijo.

Esa tarde, Marcos orden\u00f3 su habitaci\u00f3n. Le llev\u00f3 media hora. Pero a la ma\u00f1ana siguiente sali\u00f3 al colegio en dos minutos.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo era la habitaci\u00f3n de Marcos?",opciones:["Muy ordenada","Un desastre total","Peque\u00f1a pero limpia"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 no encontraba Marcos antes de ir al colegio?",opciones:["Sus zapatos","Sus deberes","Su mochila"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfD\u00f3nde estaba la mochila?",opciones:["Debajo de la cama","Debajo de ropa y libros","En el ba\u00f1o"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1nto tard\u00f3 Marcos en ordenar su habitaci\u00f3n?",opciones:["Una hora","Media hora","Todo el d\u00eda"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 pas\u00f3 al d\u00eda siguiente?",opciones:["Volvi\u00f3 a perder la mochila","Sali\u00f3 al colegio en dos minutos","Lleg\u00f3 tarde al colegio"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfC\u00f3mo tienes t\u00fa tu habitaci\u00f3n? \u00bfQu\u00e9 ventajas tiene tenerla ordenada?"},
   ]},
  {id:31,titulo:"El oto\u00f1o",nivel:"1\u00ba-2\u00ba",tipo:"Poema",icono:"\ud83c\udf41",color:"#D97706",colorLight:"#FEF9C3",
   intro:"Un poema sobre los colores, los sonidos y los sabores del oto\u00f1o.",
   texto:`Llega el oto\u00f1o
con su capa de color,
rojas y amarillas hojas
caen una a una al suelo.

La lluvia tamborilea
en el cristal del balc\u00f3n,
huele a tierra mojada
y a manzana y a lim\u00f3n.

Los ni\u00f1os van al colegio
con bufanda y calcet\u00f3n,
y el viento juega al escondite
por cada rinc\u00f3n.

Setas y casta\u00f1as,
paraguas de algod\u00f3n.
\u00a1El oto\u00f1o ha llegado
con todo su color!`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 les pasa a las hojas en oto\u00f1o seg\u00fan el poema?",opciones:["Se ponen verdes y crecen","Se vuelven rojas y amarillas y caen","Desaparecen de los \u00e1rboles"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfA qu\u00e9 huele en oto\u00f1o seg\u00fan el poema?",opciones:["A flores y hierba","A tierra mojada, manzana y lim\u00f3n","A nieve y pino"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 llevan los ni\u00f1os cuando van al colegio?",opciones:["Gorra y gafas de sol","Bufanda y calcet\u00f3n","Paraguas y botas de agua"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 alimentos de oto\u00f1o aparecen en el poema?",opciones:["Peras y naranjas","Setas y casta\u00f1as","Fresas y cerezas"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hace el viento en el poema?",opciones:["Hace mucho ruido","Juega al escondite por los rincones","Tira las hojas al suelo"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 es lo que m\u00e1s te gusta del oto\u00f1o? \u00bfPor qu\u00e9?"},
   ]},
  {id:32,titulo:"La liebre y el erizo",nivel:"1\u00ba-2\u00ba",tipo:"F\u00e1bula",icono:"\ud83e\udd94",color:"#92400E",colorLight:"#FEF3C7",
   intro:"La liebre se burla del erizo por sus patas cortas. El erizo decide retar a la liebre a una carrera con una trampa ingeniosa.",
   texto:`Una ma\u00f1ana, la liebre se encontr\u00f3 al erizo en el campo.

\u2014\u00a1Qu\u00e9 patas m\u00e1s cortas y torcidas tienes! \u2014se burl\u00f3 la liebre.

El erizo se molest\u00f3 mucho y dijo:
\u2014Te apuesto a que te gano en una carrera.

La liebre se ri\u00f3, pero acept\u00f3.

Lo que la liebre no sab\u00eda es que el erizo ten\u00eda un plan: coloc\u00f3 a su esposa, que era igual que \u00e9l, al final de la carrera.

Cuando la liebre lleg\u00f3 corriendo a la meta, el erizo (en realidad la se\u00f1ora erizo) ya estaba all\u00ed.

\u2014\u00a1He llegado primero! \u2014dijo el erizo.

La liebre no pod\u00eda creerlo. Corri\u00f3 de ida y vuelta catorce veces, pero siempre llegaba un erizo antes. Al final se rindi\u00f3, agotada.

Moraleja: No te burles de los dem\u00e1s. Y nunca subestimes a nadie.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfDe qu\u00e9 se burl\u00f3 la liebre?",opciones:["De las p\u00faas del erizo","De las patas cortas del erizo","De c\u00f3mo com\u00eda el erizo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l era el plan del erizo?",opciones:["Correr m\u00e1s r\u00e1pido que nunca","Poner a su esposa en la meta","Hacer trampa tomando un atajo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 siempre hab\u00eda un erizo en la meta?",opciones:["Porque los erizos corren mucho","Porque la esposa del erizo esperaba en la meta","Porque el erizo vol\u00f3"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntas veces corri\u00f3 la liebre de ida y vuelta?",opciones:["Cuatro","Ocho","Catorce"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 nos ense\u00f1a esta f\u00e1bula?",opciones:["Que los erizos son muy listos","Que no hay que burlarse y nunca subestimes a nadie","Que la liebre es torpe"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfFue honesto el erizo con su truco? \u00bfQu\u00e9 piensas t\u00fa?"},
   ]},
  {id:33,titulo:"El pollito P\u00edo",nivel:"1\u00ba",tipo:"Cuento",icono:"\ud83d\udc25",color:"#F59E0B",colorLight:"#FEF3C7",
   intro:"El pollito P\u00edo acaba de salir del huevo. \u00a1Todo le parece nuevo y emocionante!",
   texto:`El pollito P\u00edo sali\u00f3 del huevo un martes por la ma\u00f1ana.

\u00a1PIC! Primero asom\u00f3 su pico amarillo.
\u00a1CRACK! Luego rompi\u00f3 la c\u00e1scara con la cabeza.
\u00a1PLOF! Y cay\u00f3 en el nido lleno de paja.

\u2014\u00a1P\u00edo, p\u00edo! \u2014dijo, mirando el mundo por primera vez.

Vio el cielo azul. Vio el sol brillante. Vio a su mam\u00e1, que era una gallina enorme y suave.

\u2014\u00bfEres t\u00fa mi mam\u00e1? \u2014pregunt\u00f3.
\u2014S\u00ed, soy yo \u2014respondi\u00f3 la gallina\u2014. Y este es tu hogar.

El pollito P\u00edo estir\u00f3 sus alitas y dio su primer pasito.
\u2014\u00a1P\u00edo, p\u00edo! \u2014dijo muy contento.

El mundo era precioso.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 d\u00eda sali\u00f3 el pollito del huevo?",opciones:["Lunes","Martes","Mi\u00e9rcoles"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo sali\u00f3 del huevo?",opciones:["Lo rompi\u00f3 de una patada","Asom\u00f3 el pico y luego rompi\u00f3 la c\u00e1scara con la cabeza","Lo abri\u00f3 su mam\u00e1"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfD\u00f3nde cay\u00f3 al salir del huevo?",opciones:["En el suelo de tierra","En el nido lleno de paja","En un charco"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo era la mam\u00e1 gallina?",opciones:["Peque\u00f1a y delgada","Enorme y suave","Asustadiza"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo se sent\u00eda el pollito al final?",opciones:["Asustado","Muy contento","Con fr\u00edo"],correcta:1},
     {tipo:"abierta",pregunta:"Imagina que acabas de nacer y ves el mundo por primera vez. \u00bfQu\u00e9 tres cosas te sorprender\u00edan m\u00e1s?"},
   ]},
  {id:34,titulo:"El ni\u00f1o que no quer\u00eda comer",nivel:"1\u00ba",tipo:"Cuento",icono:"\ud83e\udd66",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"A Carlos no le gustan las verduras. Pero un d\u00eda descubre algo que le hace cambiar de opini\u00f3n.",
   texto:`Carlos no quer\u00eda comer verduras. Cada vez que su mam\u00e1 pon\u00eda verduras en el plato, \u00e9l dec\u00eda:
\u2014\u00a1Puaj! No me gustan.

Un d\u00eda fue de excursi\u00f3n al campo con el colegio. Plantaron semillas de zanahoria y de lechuga.

Carlos reg\u00f3 su planta todos los d\u00edas. Semana tras semana, la cuid\u00f3 con mucho mimo.

Dos meses despu\u00e9s, recogi\u00f3 su primera zanahoria. La lav\u00f3, la cort\u00f3 y... se la comi\u00f3.

\u2014\u00a1Est\u00e1 buena! \u2014dijo sorprendido.

Su maestra sonri\u00f3.
\u2014Las cosas que uno cultiva con esfuerzo siempre saben mejor.

Desde ese d\u00eda, Carlos prob\u00f3 todas las verduras. Y casi todas le gustaron.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 no quer\u00eda comer Carlos?",opciones:["La carne","Las verduras","La fruta"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hicieron en la excursi\u00f3n al campo?",opciones:["Recogieron manzanas","Plantaron semillas de zanahoria y lechuga","Hicieron una barbacoa"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1nto tiempo tard\u00f3 en crecer su zanahoria?",opciones:["Una semana","Un mes","Dos meses"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfLe gust\u00f3 la zanahoria a Carlos?",opciones:["No, segu\u00eda sin gustarle","S\u00ed, le sorprendi\u00f3 que estaba buena","Solo la prob\u00f3 por compromiso"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 dijo la maestra sobre las cosas que uno cultiva?",opciones:["Que son m\u00e1s sanas","Que siempre saben mejor","Que son m\u00e1s baratas"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfHay alg\u00fan alimento que no te guste? \u00bfLo has probado varias veces o solo una?"},
   ]},
  {id:35,titulo:"El lobo con piel de cordero",nivel:"2\u00ba",tipo:"F\u00e1bula",icono:"\ud83d\udc3a",color:"#1E293B",colorLight:"#F1F5F9",
   intro:"Un lobo hambriento tiene un plan: disfrazarse de cordero para acercarse al reba\u00f1o sin que lo vean.",
   texto:`Un lobo muy hambriento encontr\u00f3 la piel de un cordero y se la puso encima.

Con ese disfraz se col\u00f3 entre el reba\u00f1o y nadie lo reconoci\u00f3. Los corderos lo dejaban acercarse porque cre\u00edan que era uno de ellos.

As\u00ed el lobo pudo comer cada d\u00eda sin ning\u00fan esfuerzo.

Pero un d\u00eda el pastor quiso hacer un estofado y, sin mirar bien, eligi\u00f3 al \u00abcordero\u00bb m\u00e1s grande del reba\u00f1o. Cuando levant\u00f3 el cuchillo y vio la piel del lobo... el lobo no pudo escapar a tiempo.

Sus enga\u00f1os le costaron la vida.

Moraleja: El que enga\u00f1a con apariencias, al final acaba pagando sus trucos.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 encontr\u00f3 el lobo para su disfraz?",opciones:["Un saco de tela","La piel de un cordero","Una capa vieja"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 los corderos lo dejaban acercarse?",opciones:["Porque el lobo era amable","Porque lo tomaban por uno de ellos","Porque ten\u00edan mucho sue\u00f1o"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 quer\u00eda hacer el pastor con el \u00abcordero\u00bb grande?",opciones:["Venderlo en el mercado","Hacerlo de mascota","Hacer un estofado"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 descubri\u00f3 el pastor?",opciones:["Que el cordero era muy viejo","Que debajo hab\u00eda un lobo","Que el cordero estaba enfermo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l es la moraleja?",opciones:["Los lobos son mal\u00edsimos","El que enga\u00f1a con apariencias acaba pagando sus trucos","Hay que tener cuidado al elegir corderos"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfPor qu\u00e9 crees que es importante no enga\u00f1ar a los dem\u00e1s?"},
   ]},
  {id:36,titulo:"La luna llena",nivel:"1\u00ba",tipo:"Poema",icono:"\ud83c\udf15",color:"#8B5CF6",colorLight:"#EDE9FE",
   intro:"Un poema sobre la luna y todo lo que parece que hace por las noches mientras dormimos.",
   texto:`La luna llena
se asoma al balc\u00f3n,
y alumbra la calle
con su gran farol.

Vigila los sue\u00f1os
de ni\u00f1as y ni\u00f1os,
y besa los techos
con suaves cari\u00f1os.

A veces se esconde
detr\u00e1s de una nube,
y cuando reaparece
m\u00e1s brillante sube.

Buenas noches, luna,
guardiana del mar,
que sue\u00f1en los ni\u00f1os
y puedas velar.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 compara el poema con la luna?",opciones:["Una vela","Un farol","Una linterna"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hace la luna mientras los ni\u00f1os duermen?",opciones:["Se va a dormir tambi\u00e9n","Vigila sus sue\u00f1os","Juega con las estrellas"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 pasa cuando la luna se esconde?",opciones:["Se apagan las estrellas","Se va el fr\u00edo","Se esconde detr\u00e1s de una nube"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo est\u00e1 la luna cuando reaparece?",opciones:["M\u00e1s peque\u00f1a","M\u00e1s brillante","M\u00e1s roja"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 cuida la luna seg\u00fan el \u00faltimo verso?",opciones:["Los \u00e1rboles y flores","El sue\u00f1o de los ni\u00f1os","El sol y las estrellas"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfMiras la luna a veces por la noche? \u00bfQu\u00e9 sientes cuando la ves?"},
   ]},
  {id:37,titulo:"El beb\u00e9 tortuga",nivel:"2\u00ba",tipo:"Cuento",icono:"\ud83d\udc22",color:"#059669",colorLight:"#D1FAE5",
   intro:"Una tortuga beb\u00e9 sale del huevo en la playa y tiene que llegar sola al mar. \u00a1Es su primer gran viaje!",
   texto:`Una noche de verano, bajo la arena de una playa, un peque\u00f1o huevo se empez\u00f3 a romper. Con mucho esfuerzo, la tortuga beb\u00e9 abri\u00f3 el cascar\u00f3n.

Sali\u00f3 a la superficie y vio el mar brillando a lo lejos. Sab\u00eda instintivamente que ten\u00eda que llegar hasta all\u00ed.

Empez\u00f3 a arrastrarse. La arena era muy caliente. Las gaviotas sobrevolaban el cielo.

Una gaviota se lanz\u00f3 en picado, pero la tortuguita se escondi\u00f3 bajo una concha vac\u00eda.

Despu\u00e9s sigui\u00f3 avanzando. Paso a paso. Sin parar.

Cuando lleg\u00f3 al agua y la primera ola la envolvi\u00f3, sinti\u00f3 que hab\u00eda llegado a casa.

Ese viaje de pocos metros hab\u00eda sido el m\u00e1s dif\u00edcil de su vida. Y lo hab\u00eda hecho sola.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ndo sali\u00f3 la tortuga del huevo?",opciones:["Una ma\u00f1ana de invierno","Una noche de verano","Un d\u00eda lluvioso"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfA d\u00f3nde ten\u00eda que llegar la tortuga?",opciones:["A las rocas","Al mar","A un estanque"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 peligro encontr\u00f3 en el camino?",opciones:["Un cangrejo gigante","Una gaviota que se lanz\u00f3 en picado","Un ni\u00f1o que la cogi\u00f3"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo se escondi\u00f3 la tortuga de la gaviota?",opciones:["Bajo la arena","Bajo una concha vac\u00eda","En el agua"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo se sinti\u00f3 la tortuga al llegar al agua?",opciones:["Con miedo de las olas","Que hab\u00eda llegado a casa","Cansada y triste"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 crees que es lo m\u00e1s dif\u00edcil para la tortuga en ese viaje? \u00bfPor qu\u00e9?"},
   ]},
  {id:38,titulo:"La semilla m\u00e1gica",nivel:"2\u00ba",tipo:"Cuento",icono:"\ud83c\udf31",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"Ana recibe una semilla de su abuela. Le dice que es m\u00e1gica, pero que la magia depende de ella.",
   texto:`La abuela de Ana le regal\u00f3 una semilla marr\u00f3n y arrugada.

\u2014Es una semilla m\u00e1gica \u2014le dijo\u2014. Pero la magia depende de ti.

Ana la plant\u00f3 en una maceta, la puso al sol y la reg\u00f3 cada d\u00eda. Pasaron dos semanas y no pas\u00f3 nada. Ana casi la tir\u00f3.

Pero sigui\u00f3 cuid\u00e1ndola.

Al mes, asom\u00f3 un tallo verde. Luego unas hojas. Despu\u00e9s un capullo. Y por fin, una flor amarilla enorme y brillante.

Ana fue corriendo a casa de su abuela.
\u2014\u00a1Floreci\u00f3! \u00a1Era verdad que era m\u00e1gica!

La abuela sonri\u00f3.
\u2014La magia no estaba en la semilla. Estaba en tu paciencia y en tu esfuerzo.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQui\u00e9n le regal\u00f3 la semilla a Ana?",opciones:["Su madre","Su maestra","Su abuela"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hizo Ana con la semilla?",opciones:["La plant\u00f3, la puso al sol y la reg\u00f3","La guard\u00f3 en un caj\u00f3n","La perdi\u00f3"],correcta:0},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1nto tard\u00f3 en aparecer la flor?",opciones:["Una semana","Dos semanas","M\u00e1s de un mes"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 flor creci\u00f3?",opciones:["Una rosa roja","Una flor amarilla grande","Una margarita blanca"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfD\u00f3nde estaba realmente la magia, seg\u00fan la abuela?",opciones:["En la semilla especial","En la tierra del jard\u00edn","En la paciencia y el esfuerzo de Ana"],correcta:2},
     {tipo:"abierta",pregunta:"\u00bfHay algo que est\u00e9s haciendo con mucha paciencia y esfuerzo? \u00bfQu\u00e9 es?"},
   ]},
  {id:39,titulo:"Los planetas del Sistema Solar",nivel:"2\u00ba",tipo:"Texto informativo",icono:"\ud83e\ude90",color:"#1D4ED8",colorLight:"#DBEAFE",
   intro:"\u00bfCu\u00e1ntos planetas hay en nuestro Sistema Solar? \u00bfCu\u00e1les son sus nombres? \u00a1Desc\u00fabrelo aqu\u00ed!",
   texto:`En el Sistema Solar hay ocho planetas que giran alrededor del Sol.

Mercurio es el m\u00e1s peque\u00f1o y el m\u00e1s cercano al Sol. Venus es el m\u00e1s brillante del cielo nocturno. La Tierra es nuestro hogar y el \u00fanico planeta con vida conocida. Marte es el planeta rojo.

J\u00fapiter es el m\u00e1s grande de todos, tan grande que cabr\u00edan mil Tierras dentro. Saturno tiene unos anillos de hielo y roca muy hermosos. Urano y Neptuno son los m\u00e1s fr\u00edos y lejanos.

Para recordar el orden, podemos usar una frase: \u00abMi Vecina Tiene Muchos Juguetes, Siempre Unos Nuevos\u00bb.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos planetas hay en el Sistema Solar?",opciones:["Siete","Ocho","Nueve"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l es el planeta m\u00e1s peque\u00f1o?",opciones:["Marte","Mercurio","Neptuno"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo es Marte?",opciones:["El m\u00e1s brillante","El planeta rojo","El m\u00e1s grande"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 planeta tiene anillos de hielo y roca?",opciones:["J\u00fapiter","Urano","Saturno"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntas Tierras cabr\u00edan dentro de J\u00fapiter?",opciones:["Cien","Quinientas","Mil"],correcta:2},
     {tipo:"abierta",pregunta:"\u00bfCu\u00e1l de los planetas te parece m\u00e1s fascinante? \u00bfPor qu\u00e9?"},
   ]},
  {id:40,titulo:"La peque\u00f1a oruga hambrienta",nivel:"1\u00ba",tipo:"Cuento",icono:"\ud83d\udc1b",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"Una oruga come y come todos los d\u00edas. \u00bfQu\u00e9 le estar\u00e1 pasando dentro?",
   texto:`El lunes por la ma\u00f1ana, la oruga se comi\u00f3 una manzana. Pero segu\u00eda teniendo hambre.

El martes comi\u00f3 dos peras. El mi\u00e9rcoles, tres ciruelas. El jueves, cuatro fresas. El viernes, cinco naranjas.

Pero el s\u00e1bado comi\u00f3 de todo: un trozo de pastel, un helado, una piruleta, un trozo de queso y una salchicha.

Aquella noche, la oruga ten\u00eda un tremendo dolor de barriga.

Al d\u00eda siguiente, comi\u00f3 solo una hoja verde. Se sinti\u00f3 mucho mejor.

Luego se hizo un capullo y durmi\u00f3 dos semanas.

Cuando sali\u00f3... \u00a1era una mariposa de colores!`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 comi\u00f3 la oruga el lunes?",opciones:["Una pera","Una manzana","Una ciruela"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 le pas\u00f3 el s\u00e1bado despu\u00e9s de comer tanto?",opciones:["Se qued\u00f3 dormida","Le doli\u00f3 la barriga","Empez\u00f3 a crecer mucho"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 comi\u00f3 el domingo para sentirse mejor?",opciones:["Una fruta cualquiera","Nada en absoluto","Una hoja verde"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1nto tiempo durmi\u00f3 en el capullo?",opciones:["Un d\u00eda","Una semana","Dos semanas"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfEn qu\u00e9 se convirti\u00f3 la oruga?",opciones:["En un escarabajo","En una mariposa de colores","En un gusano de seda"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfPor qu\u00e9 crees que le doli\u00f3 la barriga a la oruga? \u00bfQu\u00e9 podemos aprender de eso?"},
   ]},
  {id:41,titulo:"La abeja reina",nivel:"2\u00ba",tipo:"Texto informativo",icono:"\ud83c\udf6f",color:"#D97706",colorLight:"#FEF9C3",
   intro:"\u00bfC\u00f3mo funciona una colmena? Descubre el incre\u00edble mundo de las abejas.",
   texto:`Una colmena es como una ciudad llena de abejas. Pueden vivir hasta 80.000 abejas en una sola colmena.

La abeja reina es la m\u00e1s importante. Es la \u00fanica que pone huevos: puede poner m\u00e1s de mil al d\u00eda.

Las abejas obreras son las que m\u00e1s trabajan. Construyen el panal con cera, cuidan las larvas y salen a buscar n\u00e9ctar de las flores para hacer miel.

Para hacer un solo kilo de miel, las abejas deben visitar unos cuatro millones de flores y recorrer unos 40.000 kil\u00f3metros.

La miel dura para siempre: en tumbas egipcias de hace 3.000 a\u00f1os se ha encontrado miel en buen estado.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntas abejas pueden vivir en una colmena?",opciones:["Hasta 8.000","Hasta 80.000","Unas 800"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l es la funci\u00f3n de la abeja reina?",opciones:["Buscar flores","Construir el panal","Poner huevos"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCon qu\u00e9 construyen el panal las abejas obreras?",opciones:["Con barro","Con miel","Con cera"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntas flores necesitan visitar para hacer un kilo de miel?",opciones:["Un mill\u00f3n","Cuatro millones","Diez millones"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1nto dura la miel?",opciones:["Solo un a\u00f1o","Diez a\u00f1os","Para siempre"],correcta:2},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 te parece m\u00e1s sorprendente de las abejas? \u00bfPor qu\u00e9?"},
   ]},
  {id:42,titulo:"El patito diferente",nivel:"1\u00ba",tipo:"Cuento",icono:"\ud83e\udda2",color:"#0891B2",colorLight:"#CFFAFE",
   intro:"Un patito nace diferente a sus hermanos. Todos le hacen sentir raro. Pero llega el d\u00eda en que descubre qui\u00e9n es.",
   texto:`En el nido de mam\u00e1 Pata nacieron cinco patitos iguales, amarillos y peque\u00f1os. Pero el \u00faltimo en salir del huevo era gris, grande y torpe.

Sus hermanos se re\u00edan:
\u2014\u00a1Patito feo! \u00a1Patito feo!

El patito se alej\u00f3 triste. Pas\u00f3 el verano solo en el lago.

Lleg\u00f3 el invierno. El patito pas\u00f3 mucho fr\u00edo.

En primavera, cuando se asom\u00f3 al agua para verse... ya no vio un pato feo. Vio un cisne blanco, elegante y hermoso.

Otros cisnes nadaron hacia \u00e9l.
\u2014Bienvenido a nuestra bandada.

El patito comprendi\u00f3 que siempre hab\u00eda sido un cisne. Solo necesitaba tiempo para crecer.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo era el patito diferente?",opciones:["Muy peque\u00f1o y rojizo","Gris, grande y torpe","Blanco y brillante desde el principio"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hac\u00edan sus hermanos?",opciones:["Le ayudaban a nadar","Se re\u00edan de \u00e9l","Le ense\u00f1aban a buscar comida"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 descubri\u00f3 el patito al mirarse en el agua en primavera?",opciones:["Que era un pato normal","Que era un cisne blanco y hermoso","Que hab\u00eda crecido pero segu\u00eda siendo feo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hicieron los otros cisnes?",opciones:["Huyeron asustados","Le dieron la bienvenida a su bandada","Le ignoraron"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 aprendemos de este cuento?",opciones:["Que los cisnes son m\u00e1s bonitos que los patos","Que a veces solo necesitamos tiempo para descubrir qui\u00e9nes somos","Que hay que re\u00edrse de los diferentes"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfAlguna vez te has sentido diferente a los dem\u00e1s? \u00bfC\u00f3mo lo viviste?"},
   ]},
  {id:43,titulo:"El viaje de una gota de agua",nivel:"2\u00ba",tipo:"Texto informativo",icono:"\u2601\ufe0f",color:"#0284C7",colorLight:"#E0F2FE",
   intro:"\u00bfSab\u00edas que el agua siempre est\u00e1 viajando? Sigue el ciclo del agua desde el mar hasta las nubes.",
   texto:`El agua nunca se queda quieta. Siempre est\u00e1 viajando en lo que llamamos el ciclo del agua.

El sol calienta el agua del mar y los r\u00edos. El agua se convierte en vapor y sube al cielo. A eso lo llamamos evaporaci\u00f3n.

El vapor de agua sube y se enfr\u00eda. Se junta en peque\u00f1as gotitas que forman las nubes. Eso se llama condensaci\u00f3n.

Cuando hay muchas gotitas, el agua cae de las nubes en forma de lluvia, nieve o granizo. Eso es la precipitaci\u00f3n.

El agua cae a los r\u00edos, los lagos y el mar, y el ciclo vuelve a empezar. \u00a1La gota de agua que bebiste hoy puede haber viajado millones de a\u00f1os!`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo se llama el proceso por el que el agua sube al cielo?",opciones:["Condensaci\u00f3n","Precipitaci\u00f3n","Evaporaci\u00f3n"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 calienta el agua del mar y los r\u00edos?",opciones:["El viento","El sol","La luna"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo se forman las nubes?",opciones:["Con vapor de agua que sube y se enfr\u00eda","Con humo de las ciudades","Con aire caliente del desierto"],correcta:0},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1les son formas de precipitaci\u00f3n?",opciones:["Solo la lluvia","Lluvia, nieve y granizo","Solo la nieve"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 pasa con el agua cuando llega al mar?",opciones:["Se queda all\u00ed para siempre","El ciclo vuelve a empezar","Se convierte en hielo"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfPor qu\u00e9 crees que es importante no contaminar el agua si siempre vuelve a nosotros?"},
   ]},
  {id:44,titulo:"El lobo y los tres cerditos",nivel:"1\u00ba",tipo:"Cuento",icono:"\ud83d\udc37",color:"#EC4899",colorLight:"#FCE7F3",
   intro:"Tres cerditos construyen sus casas de materiales distintos. \u00a1Pero el lobo quiere soplar y soplar!",
   texto:`Tres cerditos se fueron a vivir solos al bosque.

El primero construy\u00f3 su casa de paja en un d\u00eda.
El segundo hizo su casa de madera en dos d\u00edas.
El tercero trabaj\u00f3 mucho y construy\u00f3 su casa de ladrillos en varias semanas.

Lleg\u00f3 el lobo. Fue a la casa de paja y sopl\u00f3 muy fuerte. La casa vol\u00f3 por los aires.

Fue a la casa de madera y sopl\u00f3 con todas sus fuerzas. \u00a1Crack! La casa se rompi\u00f3.

Los dos cerditos corrieron a la casa de ladrillos. El lobo sopl\u00f3 y sopl\u00f3... pero la casa no se movi\u00f3 ni un poco.

El lobo se fue. Desde ese d\u00eda, los tres cerditos vivieron juntos en la casa de ladrillos.

Y el que m\u00e1s hab\u00eda trabajado los hab\u00eda salvado a todos.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfDe qu\u00e9 hizo su casa el primer cerdito?",opciones:["De madera","De paja","De ladrillos"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1nto tard\u00f3 el tercer cerdito en construir su casa?",opciones:["Un d\u00eda","Dos d\u00edas","Varias semanas"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hizo el lobo para intentar derribar las casas?",opciones:["Las quem\u00f3","Sopl\u00f3 muy fuerte","Las golpe\u00f3 con un palo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 casa no pudo derribar el lobo?",opciones:["La de paja","La de madera","La de ladrillos"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 aprendemos de este cuento?",opciones:["Que soplar sirve para muchas cosas","Que trabajar bien y con esfuerzo da mejores resultados","Que los lobos son peligrosos"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfCrees que el tercer cerdito hizo bien en construir su casa de ladrillos aunque tard\u00f3 m\u00e1s? \u00bfPor qu\u00e9?"},
   ]},
  {id:45,titulo:"Mi cuerpo",nivel:"1\u00ba",tipo:"Texto informativo",icono:"\ud83e\udec0",color:"#EF4444",colorLight:"#FEE2E2",
   intro:"\u00bfCu\u00e1ntos huesos tienes? \u00bfQu\u00e9 hace tu coraz\u00f3n? \u00a1Descubre cosas asombrosas sobre tu propio cuerpo!",
   texto:`El cuerpo humano es incre\u00edble.

El coraz\u00f3n es un m\u00fasculo que late unas 100.000 veces al d\u00eda sin parar. Bombea la sangre por todo el cuerpo.

Los pulmones nos permiten respirar. Tomamos el aire por la nariz y la boca, y los pulmones cogen el ox\u00edgeno que el cuerpo necesita.

Un adulto tiene 206 huesos. Los beb\u00e9s nacen con m\u00e1s de 300, pero algunos se unen al crecer.

El cerebro es el jefe de todo. Controla el movimiento, los pensamientos, las emociones y el sue\u00f1o.

Los cinco sentidos \u2014vista, o\u00eddo, olfato, gusto y tacto\u2014 nos permiten conocer el mundo que nos rodea.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntas veces late el coraz\u00f3n al d\u00eda?",opciones:["Unas 1.000 veces","Unas 100.000 veces","Unas 10.000 veces"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 cogen los pulmones del aire?",opciones:["El nitr\u00f3geno","El ox\u00edgeno","El di\u00f3xido de carbono"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos huesos tiene un adulto?",opciones:["150","206","300"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hace el cerebro?",opciones:["Solo piensa","Solo mueve el cuerpo","Controla el movimiento, pensamientos, emociones y el sue\u00f1o"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1les son los cinco sentidos?",opciones:["Vista, o\u00eddo, tacto, equilibrio y velocidad","Vista, o\u00eddo, olfato, gusto y tacto","Vista, olfato, gusto, memoria y tacto"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfCu\u00e1l de los sentidos crees que es el m\u00e1s importante para ti? \u00bfPor qu\u00e9?"},
   ]},
  {id:46,titulo:"El gatito perdido",nivel:"1\u00ba",tipo:"Cuento",icono:"\ud83d\udc31",color:"#6366F1",colorLight:"#E0E7FF",
   intro:"Nube es un gatito blanco que se ha perdido en el barrio. \u00bfEncontrar\u00e1 el camino a casa?",
   texto:`Nube era un gatito blanco que un d\u00eda se alej\u00f3 demasiado de casa siguiendo una mariposa.

Cuando quiso volver, no reconoc\u00eda la calle. Maull\u00f3 muy fuerte, pero nadie le escuch\u00f3.

Se escondi\u00f3 bajo un banco de un parque y esper\u00f3.

Una ni\u00f1a llamada Carmen lo encontr\u00f3 y lo llev\u00f3 a su casa.

\u2014\u00bfSer\u00e1 de alguien? \u2014dijo su madre.

Pusieron un cartel en el parque: \u00abGatito blanco encontrado\u00bb. 

Al d\u00eda siguiente llam\u00f3 un se\u00f1or:
\u2014\u00a1Es mi gatito Nube! \u00a1Lo buscaba por todas partes!

Nube ronrone\u00f3 cuando vio a su due\u00f1o. Carmen se despidi\u00f3 del gatito con una sonrisa.

\u2014Cu\u00eddalo bien \u2014le dijo al se\u00f1or.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 se perdi\u00f3 Nube?",opciones:["Se asust\u00f3 de un perro","Sigui\u00f3 a una mariposa y se alej\u00f3 demasiado","Se cay\u00f3 por una ventana"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfD\u00f3nde se escondi\u00f3 el gatito?",opciones:["Bajo un \u00e1rbol","Bajo un banco del parque","En un portal"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hizo Carmen al encontrarlo?",opciones:["Lo dej\u00f3 en el parque","Lo llev\u00f3 a su casa","Lo llev\u00f3 al veterinario"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo buscaron al due\u00f1o?",opciones:["Paseando por el barrio","Poniendo un cartel en el parque","Llamando a la polic\u00eda"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo supo el due\u00f1o que hab\u00edan encontrado a Nube?",opciones:["Lo vio por la calle","Vio el cartel y llam\u00f3","Un vecino se lo dijo"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 har\u00edas t\u00fa si encontraras un animal perdido?"},
   ]},
  {id:47,titulo:"Un d\u00eda de lluvia",nivel:"1\u00ba",tipo:"Texto",icono:"\ud83c\udf27\ufe0f",color:"#0284C7",colorLight:"#E0F2FE",
   intro:"Hoy llueve mucho y no se puede salir a jugar. \u00bfQu\u00e9 hacen los ni\u00f1os en casa?",
   texto:`Hoy llueve mucho. Las gotas tamborilean en la ventana y los charcos crecen en la calle.

Mar\u00eda y su hermano Lucas no pueden salir al parque.

\u2014\u00bfQu\u00e9 hacemos? \u2014pregunta Lucas.

\u2014Podemos leer, pintar, jugar a las cartas o hacer un puzzle \u2014dice mam\u00e1.

Lucas elige el puzzle de los dinosaurios. Mar\u00eda prefiere pintar. Se sientan juntos en la mesa del comedor.

La lluvia sigue cayendo. El chocolate caliente huele rico.

\u2014Me gusta el d\u00eda de lluvia en casa \u2014dice Lucas.
\u2014A m\u00ed tambi\u00e9n \u2014responde Mar\u00eda\u2014. Pero ma\u00f1ana quiero salir a pisar charcos.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 no pueden salir Mar\u00eda y Lucas?",opciones:["Est\u00e1n castigados","Llueve mucho","Hace demasiado calor"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 elige hacer Lucas?",opciones:["Leer un libro","Jugar a las cartas","Hacer el puzzle de los dinosaurios"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 prefiere hacer Mar\u00eda?",opciones:["Pintar","Leer","Ver la televisi\u00f3n"],correcta:0},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 olor hay en casa?",opciones:["A galletas","A chocolate caliente","A comida"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 quiere hacer Mar\u00eda el d\u00eda siguiente?",opciones:["Ir al parque","Pisar charcos","Ver una pel\u00edcula"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 haces t\u00fa cuando llueve y no puedes salir? Cu\u00e9ntalo."},
   ]},
  {id:48,titulo:"El loro parlanch\u00edn",nivel:"2\u00ba",tipo:"Cuento",icono:"\ud83e\udd9c",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"Pico es un loro que repite todo lo que oye. Un d\u00eda repite algo que no deber\u00eda... con consecuencias divertidas.",
   texto:`Pico era un loro verde con cola roja que viv\u00eda en casa de do\u00f1a Concha.

Pico aprend\u00eda todo lo que o\u00eda y lo repet\u00eda en cualquier momento.

Un d\u00eda lleg\u00f3 a casa el se\u00f1or Gregorio, un vecino muy serio.
\u2014Buenas tardes, do\u00f1a Concha \u2014dijo.

Y Pico dijo desde su jaula:
\u2014\u00a1Gregorio huele a cebolla! \u00a1Gregorio huele a cebolla!

Do\u00f1a Concha se puso roja como un tomate. El se\u00f1or Gregorio se qued\u00f3 boquiabierto.

\u2014\u00a1Lo hab\u00eda dicho yo en la cocina ayer! \u2014susurr\u00f3 do\u00f1a Concha entre dientes.

Pico sigui\u00f3 repitiendo: \u00a1Gregorio huele a cebolla!

Desde ese d\u00eda, do\u00f1a Concha tuvo mucho cuidado con lo que dec\u00eda delante del loro.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo era Pico?",opciones:["Un gato verde","Un loro verde con cola roja","Un p\u00e1jaro amarillo peque\u00f1o"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hac\u00eda Pico con todo lo que o\u00eda?",opciones:["Lo cantaba","Lo repet\u00eda en cualquier momento","Lo escrib\u00eda"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 repiti\u00f3 Pico delante del se\u00f1or Gregorio?",opciones:["Que el se\u00f1or Gregorio era muy aburrido","Que el se\u00f1or Gregorio ol\u00eda a cebolla","Un chiste de do\u00f1a Concha"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo se puso do\u00f1a Concha?",opciones:["Muy contenta","Roja como un tomate","De muy mal humor"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 aprendi\u00f3 do\u00f1a Concha?",opciones:["Que los loros son peligrosos","Que hay que tener cuidado con lo que se dice delante del loro","Que Pico era muy inteligente"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfAlguna vez has repetido algo que no deb\u00edas? \u00bfQu\u00e9 pas\u00f3?"},
   ]},
  {id:49,titulo:"El cumplea\u00f1os de Pablo",nivel:"1\u00ba",tipo:"Texto",icono:"\ud83c\udf88",color:"#F59E0B",colorLight:"#FEF3C7",
   intro:"Pablo cumple seis a\u00f1os. \u00bfC\u00f3mo celebra su cumplea\u00f1os con su familia y sus amigos?",
   texto:`Hoy Pablo cumple seis a\u00f1os.

Por la ma\u00f1ana se despert\u00f3 y encontr\u00f3 globos rojos y azules en su habitaci\u00f3n. Su mam\u00e1 le hab\u00eda preparado su desayuno favorito: churros con chocolate.

En el colegio, la maestra ense\u00f1\u00f3 cu\u00e1ntos a\u00f1os cumpl\u00eda en el calendario y todos sus compa\u00f1eros le cantaron el cumplea\u00f1os.

Por la tarde, vinieron sus amigos al parque. Jugaron a la silla, al pilla-pilla y a la cuerda.

Al final, la mam\u00e1 sac\u00f3 una tarta con seis velas. Pablo cerr\u00f3 los ojos, pidi\u00f3 un deseo y sopl\u00f3 muy fuerte.

\u2014\u00a1Todas de un soplo! \u2014gritaron sus amigos.

Pablo sonri\u00f3. Hab\u00eda sido el mejor d\u00eda del a\u00f1o.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos a\u00f1os cumple Pablo?",opciones:["Cinco","Seis","Siete"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 desayuno le prepar\u00f3 su mam\u00e1?",opciones:["Leche con galletas","Churros con chocolate","Tostadas con mermelada"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hicieron en el colegio?",opciones:["Le hicieron una fiesta sorpresa","La maestra lo puso en el calendario y le cantaron el cumplea\u00f1os","Le regalaron un libro"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfD\u00f3nde jugaron por la tarde?",opciones:["En casa de Pablo","En el parque","En el colegio"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntas velas ten\u00eda la tarta?",opciones:["Cinco","Seis","Siete"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 es lo que m\u00e1s te gusta de los cumplea\u00f1os? Cu\u00e9ntalo."},
   ]},
  {id:50,titulo:"Las estrellas",nivel:"1\u00ba",tipo:"Poema",icono:"\u2b50",color:"#8B5CF6",colorLight:"#EDE9FE",
   intro:"Un poema para contemplar el cielo nocturno y so\u00f1ar con las estrellas.",
   texto:`Las estrellas son faroles
que alguien olvid\u00f3 apagar,
puntitos de luz que brillan
muy lejos en el m\u00e1s all\u00e1.

Hay estrellas que forman figuras:
un oso, un cazador, un pez.
Si miras con mucha paciencia
las ver\u00e1s, de vez en vez.

La estrella m\u00e1s cercana al Sol
se llama Pr\u00f3xima Centauri,
est\u00e1 tan lejos que su luz
tarda cuatro a\u00f1os en llegarnos.

Cierra los ojos, cuenta estrellas,
deja que el cielo te hable al dormir.
Las estrellas siempre estar\u00e1n
para guiarnos y para brillar.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfA qu\u00e9 compara el poema las estrellas?",opciones:["A diamantes que caen","A faroles que alguien olvid\u00f3 apagar","A linternas en el agua"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 figuras se pueden ver en las estrellas seg\u00fan el poema?",opciones:["Un \u00e1rbol, un r\u00edo y una casa","Un oso, un cazador y un pez","El sol, la luna y la Tierra"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo se llama la estrella m\u00e1s cercana al Sol?",opciones:["Alfa Centauri","Sirio","Pr\u00f3xima Centauri"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos a\u00f1os tarda su luz en llegarnos?",opciones:["Uno","Cuatro","Diez"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfPara qu\u00e9 sirven las estrellas al final del poema?",opciones:["Para indicar el tiempo que har\u00e1","Para guiarnos y brillar","Para decirnos la hora"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfHas mirado alguna vez el cielo estrellado de noche? \u00bfC\u00f3mo te hizo sentir?"},
   ]},
  {id:201,titulo:"El perro de Tomás",nivel:"1º",tipo:"Texto",icono:"🐕",color:"#F59E0B",colorLight:"#FEF3C7",
   intro:"Lee este texto corto sobre el perro de Tomás.",
   texto:`Tomás tiene un perro que se llama Canelo. Canelo es marrón y tiene las orejas muy largas. Por las mañanas, Tomás le da de comer y le pone agua fresca. Luego salen juntos a pasear por el parque. Canelo mueve la cola cuando está contento.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cómo se llama el perro de Tomás?",opciones:["Peluso","Canelo","Manchas"],correcta:1},
     {tipo:"opcion",pregunta:"¿De qué color es el perro?",opciones:["Negro","Blanco","Marrón"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué hace Tomás por las mañanas?",opciones:["Le baña y le peina","Le da de comer y le pone agua","Le enseña trucos nuevos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Adónde van a pasear?",opciones:["Al colegio","Al río","Al parque"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué hace Canelo cuando está contento?",opciones:["Ladra mucho","Mueve la cola","Se tumba en el suelo"],correcta:1},
     {tipo:"abierta",pregunta:"¿Tienes o te gustaría tener una mascota? ¿Cómo se llamaría?"},
   ]},
  {id:202,titulo:"El desayuno de Lucía",nivel:"1º",tipo:"Texto",icono:"🥛",color:"#06B6D4",colorLight:"#CFFAFE",
   intro:"Lee qué desayuna Lucía cada mañana antes de ir al colegio.",
   texto:`Cada mañana, Lucía desayuna con su mamá antes de ir al colegio. Primero bebe un vaso de leche con cacao. Luego come dos tostadas con tomate y aceite. A veces su mamá le pone un poco de zumo de naranja. Cuando termina, se lava los dientes y coge la mochila.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Con quién desayuna Lucía?",opciones:["Con su papá","Con su mamá","Sola"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué bebe Lucía en el desayuno?",opciones:["Solo zumo","Leche con cacao","Agua con limón"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué come con las tostadas?",opciones:["Mermelada y mantequilla","Tomate y aceite","Queso y jamón"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hace Lucía después de desayunar?",opciones:["Ve la televisión","Se ducha","Se lava los dientes y coge la mochila"],correcta:2},
     {tipo:"opcion",pregunta:"¿Qué le pone a veces su mamá?",opciones:["Un trozo de fruta","Zumo de naranja","Una galleta de chocolate"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué desayunas tú por las mañanas?"},
   ]},
  {id:203,titulo:"Mi clase",nivel:"1º",tipo:"Texto",icono:"🏫",color:"#8B5CF6",colorLight:"#EDE9FE",
   intro:"Lee este texto sobre cómo es una clase de primero.",
   texto:`Mi clase tiene veinte alumnos. Hay diez niñas y diez niños. Las mesas son amarillas y las sillas son azules. En la pared hay un mapa de España y muchos dibujos que hemos hecho nosotros. La maestra se llama Carmen y siempre nos saluda con una sonrisa.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Cuántos alumnos hay en la clase?",opciones:["Diez","Quince","Veinte"],correcta:2},

  {id:51,titulo:"La tortuga y la liebre",nivel:"3º",tipo:"Fábula",icono:"🐢",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"La liebre presume de ser rapidísima. La tortuga la reta a una carrera. ¿Quién ganará?",
   texto:`La liebre siempre se burlaba de la tortuga por ir tan despacio.
—¡Mira cómo caminas! Parece que llevas el mundo encima —le decía riendo.

Un día, la tortuga, harta de sus burlas, la retó a una carrera.
—Te apuesto a que llego antes que tú a aquel roble del fondo del prado.

La liebre aceptó muerta de risa. En cuanto sonó la señal de salida, la liebre salió disparada y dejó a la tortuga muy atrás. Tan segura estaba de ganar que decidió echarse una siesta bajo un árbol.

Mientras dormía, la tortuga siguió avanzando sin parar, paso a paso, sin descanso.

Cuando la liebre despertó y llegó corriendo a la meta, encontró a la tortuga ya sentada bajo el roble, esperándola con una sonrisa.

  {id:52,titulo:"El ratón de ciudad y el de campo",nivel:"3º",tipo:"Fábula",icono:"🐭",color:"#92400E",colorLight:"#FEF3C7",

   texto:`El ratón de ciudad invitó a su primo del campo a visitarle.
—Verás qué vida tan maravillosa tengo —le prometió.

Pero, de pronto, se abrió la puerta y entró el gato de la casa. Los dos ratones salieron corriendo despavoridos y se escondieron en un agujero, temblando de miedo durante largo rato.

Cuando el peligro pasó, el ratón de ciudad dijo:
—Ya puedes salir. Venga, sigamos comiendo.

Pero el ratón de campo sacudió la cabeza:
