     {tipo:"opcion",pregunta:"¿A qué instrumento se parece el pino cuando lo toca el viento?",opciones:["A un tambor","A una guitarra","A una flauta"],correcta:2},
     {tipo:"opcion",pregunta:"¿Cuándo habla el viento «bajito»?",opciones:["En la alta montaña","En el pelo de las niñas","Entre los callejones"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo es el viento según el poema?",opciones:["Perezoso y silencioso","Activo, sin descanso ni aburrimiento","Triste y solitario"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué sería el mundo sin el viento, según el poema?",opciones:["Más tranquilo","Más triste","Igual de bonito"],correcta:1},
     {tipo:"abierta",pregunta:"¿Qué otros sonidos hace el viento que no aparecen en el poema? Escribe al menos dos."},
   ]},
  {id:70,titulo:"Los tres hermanos",nivel:"4º",tipo:"Cuento",icono:"🏠",color:"#B45309",colorLight:"#FEF3C7",
   intro:"Un padre anciano va a morir y deja una herencia especial a sus tres hijos. ¿Cuál de los tres habrá cumplido mejor su encargo?",
   texto:`Un anciano que iba a morir llamó a sus tres hijos y les dijo:
—Os doy a cada uno una moneda de plata. Con ella debéis llenar esta habitación. El que lo consiga heredará la casa.

El hijo mayor compró paja, pero no alcanzó a llenar ni la mitad de la habitación.

El segundo hijo compró musgo del río, que hinchó bien mojado, pero tampoco llegó a cubrirlo todo.

El hijo menor estuvo pensando mucho tiempo. Con la moneda compró dos velas y una caja de cerillas. Entró a la habitación, cerró las puertas y encendió las velas.

La luz llenó cada rincón de la habitación.

El anciano sonrió:
—Tú, hijo mío, has entendido que no siempre quien más gasta o más se esfuerza resuelve el problema. La inteligencia y la creatividad valen más que la fuerza.`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Qué encargo les puso el padre a sus hijos?",opciones:["Construir una casa nueva","Llenar la habitación con una sola moneda de plata","Recorrer el mundo y volver con regalos"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué compró el hijo mayor?",opciones:["Agua","Paja","Musgo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué compró el hijo menor?",opciones:["Algodón y plumas","Dos velas y cerillas","Globos de colores"],correcta:1},
     {tipo:"opcion",pregunta:"¿Cómo llenó el hijo menor la habitación?",opciones:["Con agua hasta el techo","Con la luz de las velas encendidas","Con mucho humo"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué aprendemos de este cuento?",opciones:["Que la fuerza es lo más importante","Que la inteligencia y la creatividad valen más que gastar mucho","Que hay que ahorrar siempre"],correcta:1},
     {tipo:"abierta",pregunta:"¿Se te ocurre otra manera creativa de llenar la habitación con solo una moneda? Descríbela."},
   ]},
  {id:71,titulo:"El castillo encantado",nivel:"3\u00ba",tipo:"Cuento",icono:"\ud83c\udff0",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"Tres amigos encuentran un castillo abandonado. Hay un acertijo en la puerta. Solo el m\u00e1s inteligente podr\u00e1 resolverlo.",
   texto:`Tres amigos \u2014Luc\u00eda, Tom\u00e1s y Alba\u2014 encontraron un castillo abandonado en el bosque.

En la puerta hab\u00eda una inscripci\u00f3n:
\u00abSoy tuyo, pero lo usan m\u00e1s los dem\u00e1s. \u00bfQu\u00e9 soy?\u00bb

Tom\u00e1s dijo:
\u2014\u00a1El dinero!
La puerta no se abri\u00f3.

Alba pens\u00f3:
\u2014\u00a1Un libro!
La puerta tampoco se movi\u00f3.

Luc\u00eda estuvo callada un rato.
\u2014Tu nombre \u2014dijo al fin\u2014. Es tuyo, pero lo usan m\u00e1s los dem\u00e1s cuando te llaman.

Con un crujido, la puerta del castillo se abri\u00f3.

Dentro encontraron una biblioteca llena de libros con acertijos y puzzles. Pasaron la tarde resolviendo todos los que pudieron.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hab\u00eda escrito en la puerta del castillo?",opciones:["Una advertencia de peligro","Un acertijo","El nombre del due\u00f1o"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l fue la respuesta correcta al acertijo?",opciones:["El dinero","Un libro","El nombre propio"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQui\u00e9n resolvi\u00f3 el acertijo?",opciones:["Tom\u00e1s","Alba","Luc\u00eda"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 encontraron dentro del castillo?",opciones:["Un tesoro de oro","Una biblioteca con acertijos y puzzles","Un laboratorio secreto"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 cualidad ayud\u00f3 a Luc\u00eda a resolver el acertijo?",opciones:["Su velocidad al responder","La paciencia para reflexionar","Haber le\u00eddo muchos libros de castillos"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfTe gustan los acertijos? Inventa uno y escr\u00edbelo."},
   ]},
  {id:72,titulo:"Las plantas carn\u00edvoras",nivel:"3\u00ba",tipo:"Texto informativo",icono:"\ud83e\udeb4",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"\u00bfPlantas que se comen a los insectos? \u00a1Existen de verdad! Descubre sus incre\u00edbles formas de cazar.",
   texto:`Las plantas carn\u00edvoras son uno de los seres vivos m\u00e1s fascinantes del planeta. Viven en suelos muy pobres en nutrientes, as\u00ed que obtienen el nitr\u00f3geno que necesitan atrapando y digiriendo insectos.

La Venus atrapamoscas tiene hojas con dos l\u00f3bulos que se cierran como una trampa cuando un insecto las toca. Se cierra en menos de un segundo.

La Nepenthes tiene un jarro lleno de l\u00edquido digestivo. Los insectos caen dentro y no pueden escapar.

La Drosera tiene pelos pegajosos en sus hojas. Cuando un insecto queda atrapado, la hoja se enrolla lentamente alrededor de \u00e9l.

Aunque se llaman carn\u00edvoras, en realidad no pueden comerse animales grandes. Solo insectos y, a veces, peque\u00f1as ara\u00f1as.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 las plantas carn\u00edvoras se comen insectos?",opciones:["Porque son peligrosas para las personas","Para obtener el nitr\u00f3geno que les falta en el suelo","Porque les gusta el sabor"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfEn cu\u00e1nto tiempo se cierra la Venus atrapamoscas?",opciones:["En un minuto","En diez segundos","En menos de un segundo"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo atrapa la Nepenthes a sus presas?",opciones:["Con hojas que se cierran","Con un jarro lleno de l\u00edquido digestivo","Con pelos pegajosos"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hace la Drosera cuando atrapa un insecto?",opciones:["Lo succiona","La hoja se enrolla lentamente alrededor","Suelta un veneno"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfPueden comerse animales grandes?",opciones:["S\u00ed, pueden con cualquier animal","No, solo insectos y peque\u00f1as ara\u00f1as","Solo si son muy viejas y grandes"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 te parece m\u00e1s sorprendente de las plantas carn\u00edvoras? \u00bfPor qu\u00e9?"},
   ]},
  {id:73,titulo:"El primer viaje al espacio",nivel:"4\u00ba",tipo:"Texto informativo",icono:"\ud83d\ude80",color:"#1D4ED8",colorLight:"#DBEAFE",
   intro:"El 12 de abril de 1961, Yuri Gagarin se convirti\u00f3 en el primer ser humano en viajar al espacio.",
   texto:`El 12 de abril de 1961, el cosmonauta sovi\u00e9tico Yuri Gagarin se convirti\u00f3 en el primer ser humano en viajar al espacio exterior.

Su nave, la Vostok 1, orbit\u00f3 la Tierra una vez en 108 minutos a una altitud de unos 300 kil\u00f3metros.

Al subir a la nave, Gagarin pronunci\u00f3 una palabra que se hizo famosa: \u00abPoyekhali!\u00bb, que en ruso significa \u00ab\u00a1Vamos!\u00bb.

Durante el vuelo, Gagarin describi\u00f3 lo que ve\u00eda por la ventanilla:
\u2014La Tierra es azul. Qu\u00e9 bonita. \u00a1Qu\u00e9 maravilla!

A su regreso fue recibido como un h\u00e9roe mundial. El 12 de abril se celebra ahora el D\u00eda Internacional de los Vuelos Espaciales Tripulados.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ndo fue el primer viaje al espacio tripulado?",opciones:["12 de abril de 1969","12 de abril de 1961","21 de julio de 1969"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo se llamaba la nave de Gagarin?",opciones:["Sputnik 1","Apolo 11","Vostok 1"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntas veces orbit\u00f3 la Tierra?",opciones:["Ninguna","Una vez","Tres veces"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 significa \u00abPoyekhali\u00bb?",opciones:["\u00a1Aterriza!","\u00a1Vamos!","\u00a1Despega!"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo describi\u00f3 Gagarin la Tierra desde el espacio?",opciones:["Peque\u00f1a y marr\u00f3n","Azul y muy bonita","Cubierta de nubes"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfTe gustar\u00eda viajar al espacio? \u00bfQu\u00e9 es lo que m\u00e1s y lo que menos te gustar\u00eda de esa experiencia?"},
   ]},
  {id:74,titulo:"El ni\u00f1o que plant\u00f3 \u00e1rboles",nivel:"3\u00ba-4\u00ba",tipo:"Cuento",icono:"\ud83c\udf33",color:"#059669",colorLight:"#D1FAE5",
   intro:"Un joven decide plantar un \u00e1rbol cada d\u00eda de su vida. A\u00f1os despu\u00e9s, el resultado es asombroso.",
   texto:`Cuando Mateo ten\u00eda diez a\u00f1os, su abuelo le dijo:
\u2014El mundo necesita m\u00e1s \u00e1rboles. Cada \u00e1rbol que plantas es un regalo para el futuro.

Mateo empez\u00f3 a plantar un \u00e1rbol cada s\u00e1bado en el descampado que hab\u00eda cerca de su casa.

Sus amigos se re\u00edan:
\u2014\u00bfPara qu\u00e9 sirve un \u00e1rbol peque\u00f1o? No da sombra ni nada.

Pero Mateo sigui\u00f3.

Diez a\u00f1os despu\u00e9s, el descampado era un bosquecillo. P\u00e1jaros, ardillas y mariposas hab\u00edan llegado a vivir all\u00ed.

Veinte a\u00f1os despu\u00e9s, los vecinos paseaban bajo la sombra de los \u00e1rboles y los ni\u00f1os jugaban en el bosque.

Mateo, ya adulto, segu\u00eda plantando un \u00e1rbol cada s\u00e1bado.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 le dijo el abuelo de Mateo?",opciones:["Que el mundo necesitaba m\u00e1s animales","Que el mundo necesitaba m\u00e1s \u00e1rboles","Que hab\u00eda que cuidar el r\u00edo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCon qu\u00e9 frecuencia plantaba Mateo un \u00e1rbol?",opciones:["Cada d\u00eda","Cada s\u00e1bado","Cada mes"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 dec\u00edan sus amigos al principio?",opciones:["Que era una idea brillante","Que un \u00e1rbol peque\u00f1o no sirve para nada","Que habr\u00eda que plantar m\u00e1s"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hab\u00eda en el descampado veinte a\u00f1os despu\u00e9s?",opciones:["Una ciudad nueva","Un bosque donde paseaban los vecinos","Un parque con columpios"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 aprendemos de esta historia?",opciones:["Que los \u00e1rboles crecen solos","Que las peque\u00f1as acciones constantes crean grandes cambios","Que hay que plantar muchos \u00e1rboles el mismo d\u00eda"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 peque\u00f1a acci\u00f3n podr\u00edas hacer t\u00fa cada semana para mejorar el mundo?"},
   ]},
  {id:75,titulo:"Gulliver en el pa\u00eds de los gigantes",nivel:"3\u00ba-4\u00ba",tipo:"Cuento",icono:"\ud83d\udd2d",color:"#0891B2",colorLight:"#CFFAFE",
   intro:"Gulliver, marinero ingl\u00e9s, naufrag\u00f3 en una isla extra\u00f1a. Los habitantes eran enormes como monta\u00f1as...",
   texto:`Gulliver era un marinero que viaj\u00f3 por los mares del mundo. Un d\u00eda, una tormenta destroz\u00f3 su barco y \u00e9l lleg\u00f3 a nado a una playa desconocida.

Al despertar, vio una mano enorme que lo recog\u00eda del suelo. Era la mano de una ni\u00f1a... \u00a1pero la ni\u00f1a ten\u00eda la altura de un edificio de diez pisos!

Estaba en Brobdingnag, el pa\u00eds de los gigantes.

La ni\u00f1a lo trat\u00f3 como a un juguete peque\u00f1o y lo cuid\u00f3 con cari\u00f1o. Le construy\u00f3 una casita, lo aliment\u00f3 y lo pase\u00f3 en el bolsillo.

Gulliver aprendi\u00f3 que ser peque\u00f1o no significa ser menos importante. Desde la perspectiva de los gigantes, el mundo entero parec\u00eda diferente.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo lleg\u00f3 Gulliver a la isla de los gigantes?",opciones:["En globo aerost\u00e1tico","Naufrag\u00f3 en una tormenta y lleg\u00f3 a nado","Lo llevaron los piratas"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQui\u00e9n lo recogi\u00f3 del suelo?",opciones:["Un gigante guerrero","Un rey enorme","Una ni\u00f1a gigante"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo trataba la ni\u00f1a a Gulliver?",opciones:["Con miedo y desconfianza","Con cari\u00f1o, como a un juguete peque\u00f1o","Con indiferencia"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 le construy\u00f3 la ni\u00f1a?",opciones:["Un barco de juguete","Una casita","Una jaula"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 aprendi\u00f3 Gulliver?",opciones:["Que los gigantes son peligrosos","Que ser peque\u00f1o no significa ser menos importante","Que hay que evitar las tormentas"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfC\u00f3mo crees que ser\u00eda el mundo si t\u00fa fueras del tama\u00f1o de un rat\u00f3n? Descr\u00edbelo."},
   ]},
  {id:76,titulo:"El inventor distra\u00eddo",nivel:"3\u00ba-4\u00ba",tipo:"Cuento",icono:"\ud83d\udd27",color:"#D97706",colorLight:"#FEF9C3",
   intro:"El profesor Cacharros inventa cosas geniales pero siempre se olvida de algo importante. Hasta que su mejor invento le da la soluci\u00f3n.",
   texto:`El profesor Cacharros era el inventor m\u00e1s brillante del pueblo, pero tambi\u00e9n el m\u00e1s distra\u00eddo del mundo.

Invent\u00f3 un paraguas que se abr\u00eda solo cuando llov\u00eda... pero se olvid\u00f3 de hacerle agujero para la cabeza.

Invent\u00f3 un despertador que hac\u00eda caf\u00e9 y tostadas... pero sonaba a las tres de la ma\u00f1ana.

Invent\u00f3 unas zapatillas que se ataban solas... pero se ataban a las zapatillas del vecino.

Un d\u00eda, su sobrina Clara le pregunt\u00f3:
\u2014T\u00edo, \u00bfpor qu\u00e9 no inventas algo que te ayude a no olvidarte de las cosas?

El profesor Cacharros se qued\u00f3 pensativo. Y de pronto grit\u00f3:
\u2014\u00a1Eureka! \u00a1Una libreta!

Y desde ese d\u00eda, antes de terminar cualquier invento, apuntaba en su libreta todo lo que pod\u00eda salir mal.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l era el problema del profesor Cacharros?",opciones:["Que sus inventos no funcionaban","Que era muy distra\u00eddo y siempre olvidaba algo","Que nadie quer\u00eda comprar sus inventos"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 pasaba con el paraguas?",opciones:["No se abr\u00eda cuando llov\u00eda","No ten\u00eda agujero para la cabeza","Se romp\u00eda con el viento"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfA qu\u00e9 hora sonaba el despertador?",opciones:["A las 6 de la ma\u00f1ana","A las 8 de la ma\u00f1ana","A las 3 de la ma\u00f1ana"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQui\u00e9n le dio la soluci\u00f3n al profesor?",opciones:["Su vecino","Su sobrina Clara","\u00c9l mismo en un sue\u00f1o"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l fue el \u00abgran invento\u00bb final del profesor?",opciones:["Un robot que le recordaba todo","Una libreta para apuntar lo que pod\u00eda salir mal","Una agenda electr\u00f3nica"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfSe te ocurre alg\u00fan invento que ayudar\u00eda a resolver un problema cotidiano?"},
   ]},
  {id:77,titulo:"Los osos polares",nivel:"3\u00ba",tipo:"Texto informativo",icono:"\ud83d\udc3b\u200d\u2744\ufe0f",color:"#0891B2",colorLight:"#CFFAFE",
   intro:"Los osos polares viven en uno de los lugares m\u00e1s fr\u00edos del planeta. \u00bfC\u00f3mo sobreviven?",
   texto:`Los osos polares son los carn\u00edvoros terrestres m\u00e1s grandes del mundo. Viven en el \u00c1rtico, donde las temperaturas pueden bajar hasta 50 grados bajo cero.

Su pelaje parece blanco, pero en realidad es transparente y hueco. Act\u00faa como una fibra \u00f3ptica que conduce el calor del sol hacia su piel negra, que absorbe el calor.

Las suelas de sus patas tienen peque\u00f1os bultos que les dan agarre sobre el hielo. Sus patas traseras hacen de tim\u00f3n cuando nadan; pueden nadar m\u00e1s de 100 kil\u00f3metros sin descanso.

Se alimentan principalmente de focas. Para cazarlas, esperan junto a los agujeros del hielo por donde las focas sacan la cabeza para respirar.

El deshielo del \u00c1rtico por el cambio clim\u00e1tico amenaza gravemente su supervivencia.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l es el color real del pelaje del oso polar?",opciones:["Blanco","Transparente y hueco","Gris claro"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfPara qu\u00e9 sirven los bultos de las suelas de sus patas?",opciones:["Para hacer m\u00e1s ruido","Para dar agarre sobre el hielo","Para protegerse del fr\u00edo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo cazan las focas?",opciones:["Buceando bajo el agua","Esperando junto a los agujeros del hielo","Corriendo muy r\u00e1pido"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos kil\u00f3metros pueden nadar sin descanso?",opciones:["M\u00e1s de 10","M\u00e1s de 50","M\u00e1s de 100"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 amenaza la supervivencia del oso polar?",opciones:["La contaminaci\u00f3n del agua","El deshielo del \u00c1rtico por el cambio clim\u00e1tico","La caza excesiva de focas"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 podemos hacer las personas para ayudar a que los osos polares no desaparezcan?"},
   ]},
  {id:78,titulo:"La jirafa que no quer\u00eda comer hojas",nivel:"3\u00ba",tipo:"Cuento",icono:"\ud83e\udd92",color:"#D97706",colorLight:"#FEF9C3",
   intro:"Sof\u00eda es una jirafa que prefiere la comida de los leones. Pero su cuello es su mayor tesoro sin que ella lo sepa.",
   texto:`Sof\u00eda era una jirafa con el cuello m\u00e1s largo de la sabana. Pero Sof\u00eda estaba harta de comer hojas.

\u2014\u00bfPor qu\u00e9 yo tengo que comer hojas? \u2014dec\u00eda\u2014. Los leones comen carne. Los elefantes comen fruta. \u00a1Qu\u00e9 aburridas mis hojas!

Un d\u00eda de sequ\u00eda, las hierbas y frutos del suelo desaparecieron. Los animales ten\u00edan hambre.

Pero Sof\u00eda estir\u00f3 su largu\u00edsimo cuello y alcanz\u00f3 las hojas m\u00e1s altas de los \u00e1rboles, hojas que ning\u00fan otro animal pod\u00eda comer.

\u2014\u00bfNos das algunas? \u2014ped\u00edan los dem\u00e1s animales.

Y Sof\u00eda, generosa, las comparti\u00f3 con todos.

Por primera vez comprendi\u00f3 que su cuello tan especial era precisamente lo que la hac\u00eda \u00fanica e imprescindible.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 estaba harta Sof\u00eda?",opciones:["Porque ten\u00eda mucho calor","Porque solo com\u00eda hojas y le parec\u00eda aburrido","Porque no ten\u00eda amigos"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 ocurri\u00f3 durante la sequ\u00eda?",opciones:["Todos los animales tuvieron agua de sobra","Los frutos y hierbas del suelo desaparecieron","Los r\u00edos se desbordaron"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 pod\u00eda hacer Sof\u00eda que los dem\u00e1s no pod\u00edan?",opciones:["Correr muy r\u00e1pido","Alcanzar las hojas m\u00e1s altas de los \u00e1rboles","Encontrar agua bajo el suelo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hizo Sof\u00eda con las hojas que encontr\u00f3?",opciones:["Se las guard\u00f3 para ella","Las comparti\u00f3 con todos","Las vendi\u00f3 a cambio de fruta"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 comprendi\u00f3 Sof\u00eda al final?",opciones:["Que la carne es m\u00e1s sabrosa que las hojas","Que su cuello la hac\u00eda \u00fanica e imprescindible","Que las jirafas son mejores que los leones"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfTienes alguna cualidad especial que a veces no valoras? \u00bfCu\u00e1l es?"},
   ]},
  {id:79,titulo:"El mapa del tesoro",nivel:"3\u00ba",tipo:"Cuento",icono:"\ud83d\uddfa\ufe0f",color:"#B45309",colorLight:"#FEF3C7",
   intro:"Tres amigos encuentran un mapa viejo en el desv\u00e1n. Seg\u00fan el mapa, hay un tesoro enterrado en el jard\u00edn.",
   texto:`Un s\u00e1bado lluvioso, Marcos, Noa y David encontraron en el desv\u00e1n un mapa viejo y amarillento.

En el mapa pon\u00eda: \u00abTres pasos al norte del roble, dos al este, uno al sur. Aqu\u00ed est\u00e1 el tesoro.\u00bb

Salieron al jard\u00edn con el mapa, una br\u00fajula y una pala.

Siguieron las instrucciones al pie de la letra. Cuando llegaron al punto se\u00f1alado, empezaron a cavar.

A medio metro de profundidad, la pala choc\u00f3 con algo duro.

Era una caja de madera. Dentro hab\u00eda tres cartas, una para cada uno, escritas por el bisabuelo de Marcos:

\u00abSi hab\u00e9is llegado hasta aqu\u00ed, es porque sab\u00e9is trabajar en equipo y no os rend\u00eds. Ese es el verdadero tesoro.\u00bb`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfD\u00f3nde encontraron el mapa?",opciones:["En el jard\u00edn","En el desv\u00e1n","Bajo una piedra del camino"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 herramientas llevaron para buscar el tesoro?",opciones:["Un mapa, linterna y pico","Un mapa, br\u00fajula y pala","Una br\u00fajula, mapa y cuerdas"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 encontraron enterrado?",opciones:["Monedas de oro antiguas","Una caja de madera con cartas","Un cofre con joyas"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQui\u00e9n hab\u00eda escrito las cartas?",opciones:["Un pirata desconocido","El abuelo de Marcos","El bisabuelo de Marcos"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l era el \u00abverdadero tesoro\u00bb seg\u00fan las cartas?",opciones:["El dinero enterrado debajo","La capacidad de trabajar en equipo y no rendirse","El mapa en s\u00ed mismo"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfSi enterraras un tesoro para que alguien lo encontrara en el futuro, qu\u00e9 meter\u00edas dentro y por qu\u00e9?"},
   ]},
  {id:80,titulo:"Los dinosaurios",nivel:"3\u00ba",tipo:"Texto informativo",icono:"\ud83e\udd95",color:"#16A34A",colorLight:"#DCFCE7",
   intro:"Los dinosaurios dominaron la Tierra durante millones de a\u00f1os. \u00bfQu\u00e9 sabemos de ellos?",
   texto:`Los dinosaurios vivieron en la Tierra hace entre 230 y 66 millones de a\u00f1os. Dominaron el planeta durante m\u00e1s de 160 millones de a\u00f1os.

Existieron dinosaurios de todos los tama\u00f1os. El Argentinosaurus med\u00eda hasta 35 metros de largo y era el animal m\u00e1s grande que ha pisado la Tierra. El Microraptor, en cambio, era del tama\u00f1o de un cuervo.

No todos los dinosaurios eran peligrosos. El Triceratops com\u00eda plantas, igual que el Brachiosaurus. El Tiranosaurio Rex s\u00ed era un feroz depredador.

Hace 66 millones de a\u00f1os, un asteroide enorme choc\u00f3 contra la Tierra. El impacto provoc\u00f3 un cambio clim\u00e1tico tan dr\u00e1stico que el 75% de las especies, incluidos la mayor\u00eda de los dinosaurios, se extinguieron.

Las aves de hoy son los descendientes directos de un grupo de dinosaurios con plumas.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos a\u00f1os hace que desaparecieron los dinosaurios?",opciones:["6 millones de a\u00f1os","66 millones de a\u00f1os","230 millones de a\u00f1os"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1nto med\u00eda el Argentinosaurus?",opciones:["Hasta 10 metros","Hasta 20 metros","Hasta 35 metros"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 com\u00eda el Triceratops?",opciones:["Otros dinosaurios","Plantas","Peces"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 caus\u00f3 la extinci\u00f3n de los dinosaurios?",opciones:["Una gran erupci\u00f3n volc\u00e1nica","El impacto de un asteroide que cambi\u00f3 el clima","Una epidemia de enfermedades"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 animales de hoy son descendientes de dinosaurios?",opciones:["Los cocodrilos","Las serpientes","Las aves"],correcta:2},
     {tipo:"abierta",pregunta:"\u00bfCu\u00e1l es tu dinosaurio favorito? \u00bfPor qu\u00e9?"},
   ]},
  {id:81,titulo:"El r\u00edo de las palabras",nivel:"3\u00ba-4\u00ba",tipo:"Cuento",icono:"\ud83d\udcd6",color:"#6366F1",colorLight:"#E0E7FF",
   intro:"En el pueblo de Valpalabras, las palabras nacen en el r\u00edo. Pero alguien est\u00e1 ensuciando el agua.",
   texto:`En el pueblo de Valpalabras hab\u00eda un r\u00edo muy especial: de \u00e9l nac\u00edan todas las palabras.

Cada ma\u00f1ana, los habitantes sacaban palabras del r\u00edo con cestos: \u00abgracias\u00bb, \u00abte quiero\u00bb, \u00ab\u00a1bien hecho!\u00bb, \u00abperdona\u00bb...

Pero un d\u00eda, alguien empez\u00f3 a echar palabras feas al r\u00edo: \u00abimb\u00e9cil\u00bb, \u00abte odio\u00bb, \u00abno sirves para nada\u00bb...

El agua se volvi\u00f3 turbia y las palabras buenas empezaron a escasear.

Los habitantes del pueblo se volvieron m\u00e1s gru\u00f1ones y tristes.

Entonces, una ni\u00f1a llamada Vera decidi\u00f3 limpiar el r\u00edo. Cada d\u00eda echaba al agua cien palabras bonitas.

Poco a poco, el r\u00edo volvi\u00f3 a ser cristalino y el pueblo recuper\u00f3 su alegr\u00eda.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 ten\u00eda de especial el r\u00edo de Valpalabras?",opciones:["Ten\u00eda agua con poderes curativos","De \u00e9l nac\u00edan todas las palabras","Sus peces cantaban por las noches"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 pas\u00f3 cuando alguien empez\u00f3 a echar palabras feas?",opciones:["El agua se volvi\u00f3 turbia y las palabras buenas escasearon","El r\u00edo se sec\u00f3","El pueblo creci\u00f3 mucho"],correcta:0},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo afect\u00f3 eso a los habitantes?",opciones:["Se volvieron m\u00e1s ricos","Se volvieron m\u00e1s gru\u00f1ones y tristes","No cambi\u00f3 nada"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hizo Vera para solucionar el problema?",opciones:["Ech\u00f3 cien palabras bonitas al r\u00edo cada d\u00eda","Prohibi\u00f3 que nadie hablara","Limpi\u00f3 el r\u00edo con jab\u00f3n"],correcta:0},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 nos ense\u00f1a este cuento?",opciones:["Que las palabras que usamos afectan al ambiente que nos rodea","Que los r\u00edos son muy importantes","Que hay que beber agua del r\u00edo"],correcta:0},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 palabras usas m\u00e1s en tu d\u00eda a d\u00eda? \u00bfCu\u00e1les te gustar\u00eda usar m\u00e1s?"},
   ]},
  {id:82,titulo:"Una receta de cocina",nivel:"3\u00ba",tipo:"Texto funcional",icono:"\ud83c\udf5d",color:"#EF4444",colorLight:"#FEE2E2",
   intro:"Un texto funcional esencial en la vida: una receta de cocina. \u00a1Aprende a leerla correctamente!",
   texto:`MACARRONES CON TOMATE
(Para 4 personas)

\u23f1 Tiempo: 25 minutos
\ud83d\udd25 Dificultad: F\u00e1cil

INGREDIENTES:
\u2022 400 g de macarrones
\u2022 1 bote de tomate triturado (400 g)
\u2022 1 cebolla
\u2022 2 dientes de ajo
\u2022 Aceite, sal, az\u00facar y or\u00e9gano

ELABORACI\u00d3N:
1. Pica la cebolla y el ajo muy peque\u00f1itos.
2. Sofr\u00edelos en aceite durante 5 minutos a fuego medio.
3. A\u00f1ade el tomate y una pizca de sal, az\u00facar y or\u00e9gano.
4. Cocina la salsa 15 minutos a fuego bajo.
5. Mientras tanto, cuece los macarrones en agua con sal seg\u00fan el tiempo del paquete.
6. Escurre los macarrones y m\u00e9zclales con la salsa.

CONSEJO: Puedes a\u00f1adir queso rallado por encima.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfPara cu\u00e1ntas personas es esta receta?",opciones:["2 personas","4 personas","6 personas"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos minutos se tarda en hacer esta receta?",opciones:["15 minutos","25 minutos","45 minutos"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos gramos de macarrones se necesitan?",opciones:["200 g","300 g","400 g"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1nto tiempo se cocina la salsa de tomate?",opciones:["5 minutos","10 minutos","15 minutos"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 consejo da la receta al final?",opciones:["A\u00f1adir nata para enriquecer la salsa","Servir fr\u00edo","A\u00f1adir queso rallado por encima"],correcta:2},
     {tipo:"abierta",pregunta:"\u00bfSabes cocinar alg\u00fan plato? \u00bfCu\u00e1l? \u00bfQu\u00e9 ingredientes lleva?"},
   ]},
  {id:83,titulo:"El barco hundido",nivel:"4\u00ba",tipo:"Cuento",icono:"\u2693",color:"#0369A1",colorLight:"#E0F2FE",
   intro:"Dos submarinistas explotan un barco hundido hace 300 a\u00f1os. \u00bfQu\u00e9 misterio guardan sus profundidades?",
   texto:`La profesora Vega y su alumno Carlos descendieron a 30 metros de profundidad. Sus linternas alumbraron algo enorme en el fondo arenoso.

Era un barco de madera, cubierto de coral y algas, hundido hac\u00eda siglos.

Entraron por una abertura en el casco. Dentro hab\u00eda barriles rotos, monedas de plata dispersas y, en el camarote del capit\u00e1n, un ba\u00fal cerrado.

Con mucho cuidado, Carlos abri\u00f3 el ba\u00fal. Dentro hab\u00eda cartas y mapas protegidos por una funda de cuero impermeable.

\u2014Son cartas de navegaci\u00f3n del siglo XVII \u2014susurr\u00f3 la profesora\u2014. Esto es un descubrimiento hist\u00f3rico.

Fotografiaron todo y subieron a la superficie para avisar al museo mar\u00edtimo.

Esa tarde, Carlos escribi\u00f3 en su diario: \u00abHoy el mar me cont\u00f3 un secreto de trescientos a\u00f1os.\u00bb`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfA qu\u00e9 profundidad descendieron?",opciones:["10 metros","20 metros","30 metros"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 encontraron en el fondo?",opciones:["Un avi\u00f3n hundido","Un barco de madera cubierto de coral","Un tesoro en cofres de oro"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hab\u00eda en el ba\u00fal del camarote?",opciones:["Monedas de oro","Armas antiguas","Cartas y mapas del siglo XVII"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hicieron con el descubrimiento?",opciones:["Se llevaron el ba\u00fal a casa","Fotografiaron todo y avisaron al museo mar\u00edtimo","Lo guardaron en secreto"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 escribi\u00f3 Carlos en su diario?",opciones:["Que hab\u00eda encontrado un tesoro valioso","Que el mar le hab\u00eda contado un secreto de trescientos a\u00f1os","Que quer\u00eda ser arque\u00f3logo submarino"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfTe gustar\u00eda ser explorador submarino? \u00bfQu\u00e9 crees que podr\u00edas encontrar en el fondo del mar?"},
   ]},
  {id:84,titulo:"La tortuga de las Gal\u00e1pagos",nivel:"4\u00ba",tipo:"Texto informativo",icono:"\ud83c\udf34",color:"#059669",colorLight:"#D1FAE5",
   intro:"Las tortugas gigantes de las Gal\u00e1pagos son uno de los animales m\u00e1s longevos del planeta. \u00bfCu\u00e1ntos a\u00f1os pueden vivir?",
   texto:`Las tortugas gigantes de las Islas Gal\u00e1pagos son los reptiles m\u00e1s grandes del mundo y uno de los animales m\u00e1s longevos. Pueden vivir m\u00e1s de 150 a\u00f1os.

Un ejemplar llamado Harriet vivi\u00f3 175 a\u00f1os. Lleg\u00f3 a conocer al cient\u00edfico Charles Darwin y muri\u00f3 en el a\u00f1o 2006.

Pueden llegar a pesar 400 kilogramos y medir 1,5 metros de largo. A pesar de su tama\u00f1o, son animales herb\u00edvoros y pac\u00edficos.

En el pasado, los marineros las cazaban para llev\u00e1rselas en los barcos como reserva de carne fresca, porque pod\u00edan sobrevivir meses sin comer ni beber. Esto hizo que varias subespecies se extinguieran.

Hoy en d\u00eda, gracias a programas de conservaci\u00f3n, su n\u00famero va aumentando lentamente.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos a\u00f1os pueden vivir las tortugas gigantes de Gal\u00e1pagos?",opciones:["Hasta 80 a\u00f1os","Hasta 120 a\u00f1os","M\u00e1s de 150 a\u00f1os"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1nto puede pesar una tortuga gigante?",opciones:["Hasta 100 kg","Hasta 200 kg","Hasta 400 kg"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo se llamaba la tortuga que conoci\u00f3 a Darwin?",opciones:["Harriet","Darwin Jr","Lonesome George"],correcta:0},
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 los marineros las cazaban?",opciones:["Por su concha valiosa","Como reserva de carne fresca en los barcos","Para venderlas en mercados"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 comen estas tortugas?",opciones:["Insectos y peces","Plantas, son herb\u00edvoras","Cualquier cosa que encuentren"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfPor qu\u00e9 crees que es importante proteger los animales que est\u00e1n en peligro de extinci\u00f3n?"},
   ]},
  {id:85,titulo:"El vendedor de sue\u00f1os",nivel:"3\u00ba-4\u00ba",tipo:"Cuento",icono:"\ud83d\udca4",color:"#8B5CF6",colorLight:"#EDE9FE",
   intro:"En un mercado extraordinario hay un vendedor muy especial que no vende cosas, sino sue\u00f1os.",
   texto:`En el mercado del pueblo hab\u00eda un vendedor con una carreta llena de frascos de cristal de todos los colores. En cada frasco hab\u00eda un sue\u00f1o.

\u2014\u00bfQu\u00e9 vendes? \u2014pregunt\u00f3 una ni\u00f1a llamada Irene.
\u2014Sue\u00f1os \u2014respondi\u00f3 el vendedor\u2014. Elige el que m\u00e1s te guste.

Hab\u00eda sue\u00f1os de volar, de ser invisible, de hablar con los animales, de respirar bajo el agua.

Irene mir\u00f3 todos los frascos. Por fin eligi\u00f3 uno marr\u00f3n y opaco, poco vistoso.

\u2014\u00bfEse? \u2014se sorprendi\u00f3 el vendedor\u2014. Es el de ser valiente.

\u2014S\u00ed \u2014dijo Irene\u2014. Con ese sue\u00f1o podr\u00e9 conseguir todos los dem\u00e1s yo sola.

El vendedor sonri\u00f3 y le regal\u00f3 el frasco sin cobrarle nada.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 vend\u00eda el vendedor de la carreta?",opciones:["Frascos de perfume","Sue\u00f1os en frascos de colores","Pociones m\u00e1gicas"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 tipo de sue\u00f1os hab\u00eda en los frascos?",opciones:["Solo sue\u00f1os de riqueza","Volar, ser invisible, hablar con animales, respirar bajo el agua","Solo sue\u00f1os de aventuras"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 frasco eligi\u00f3 Irene?",opciones:["El m\u00e1s brillante y colorido","El m\u00e1s grande de todos","Uno marr\u00f3n y opaco, el sue\u00f1o de ser valiente"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 eligi\u00f3 ese sue\u00f1o?",opciones:["Porque era el m\u00e1s barato","Porque con valent\u00eda podr\u00eda conseguir los dem\u00e1s por s\u00ed sola","Porque le gustaba el color marr\u00f3n"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hizo el vendedor al final?",opciones:["Le cobr\u00f3 el doble","Le regal\u00f3 el frasco sin cobrarle","Le propuso un intercambio"],correcta:1},
     {tipo:"abierta",pregunta:"Si pudieras elegir un sue\u00f1o del frasco, \u00bfcu\u00e1l elegir\u00edas? \u00bfPor qu\u00e9?"},
   ]},
  {id:86,titulo:"El ahorro de energ\u00eda",nivel:"3\u00ba",tipo:"Texto informativo",icono:"\ud83d\udca1",color:"#D97706",colorLight:"#FEF9C3",
   intro:"La energ\u00eda que usamos en casa cuesta dinero y contamina el planeta. \u00a1Descubre c\u00f3mo ahorrarla!",
   texto:`La energ\u00eda que usamos en nuestras casas viene principalmente de la quema de combustibles f\u00f3siles como el petr\u00f3leo y el gas natural. Esto produce gases que contaminan el aire y contribuyen al cambio clim\u00e1tico.

Ahorrar energ\u00eda es bueno para el planeta y para el bolsillo familiar. Hay muchas formas de hacerlo.

En iluminaci\u00f3n: usar bombillas LED, que consumen hasta un 80% menos que las bombillas normales, y apagar las luces al salir de una habitaci\u00f3n.

En calefacci\u00f3n: no superar los 20-21 grados en casa y apagar la calefacci\u00f3n cuando se abren las ventanas.

En electrodom\u00e9sticos: apagar completamente los aparatos en lugar de dejarlos en espera (el \u00abstandby\u00bb consume electricidad aunque parezca apagado).

En el transporte: usar el transporte p\u00fablico, la bicicleta o ir a pie cuando sea posible.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfDe d\u00f3nde viene principalmente la energ\u00eda que usamos en casa?",opciones:["De la energ\u00eda solar","De la quema de combustibles f\u00f3siles","Del agua de los r\u00edos"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1nto menos consumen las bombillas LED?",opciones:["Un 40% menos","Un 60% menos","Hasta un 80% menos"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 temperatura no debemos superar en casa?",opciones:["18-19 grados","20-21 grados","25 grados"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 consume electricidad aunque parezca apagado?",opciones:["El frigor\u00edfico","Los aparatos en standby","El calentador del agua"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 nos aconseja el texto sobre el transporte?",opciones:["Comprar coches el\u00e9ctricos","Usar transporte p\u00fablico, bicicleta o ir a pie","Reducir los viajes al m\u00ednimo"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 formas de ahorrar energ\u00eda ya us\u00e1is en tu casa? \u00bfQu\u00e9 podr\u00edas mejorar?"},
   ]},
  {id:87,titulo:"Los dos cuervos",nivel:"3\u00ba-4\u00ba",tipo:"F\u00e1bula",icono:"\ud83e\udeb6",color:"#1E293B",colorLight:"#F1F5F9",
   intro:"Dos cuervos discuten sobre a qui\u00e9n pertenece un trozo de carne. Un zorro ofrece mediar en la disputa... con muy malas intenciones.",
   texto:`Dos cuervos encontraron un trozo de carne y discutieron sobre a qui\u00e9n pertenec\u00eda.

Un zorro se acerc\u00f3:
\u2014Puedo solucionar vuestra disputa. Dividir\u00e9 la carne en partes iguales.

Los cuervos aceptaron. El zorro cort\u00f3 la carne en dos trozos, pero uno era m\u00e1s grande que el otro.

\u2014Para igualarlos \u2014dijo el zorro\u2014 comer\u00e9 un poco del m\u00e1s grande.

Mordisque\u00f3 el trozo grande. Pero ahora ese era el m\u00e1s peque\u00f1o.
\u2014Ahora comer\u00e9 un poco del otro para igualarlos.

As\u00ed sigui\u00f3, de un trozo al otro, hasta que se comi\u00f3 toda la carne.

\u2014\u00a1Hab\u00e9is resuelto vuestra disputa! \u2014dijo el zorro\u2014. Ahora ninguno tiene nada.

Y se march\u00f3 muy satisfecho.

Moraleja: Quien permite que otros resuelvan sus conflictos puede acabar perdiendo todo.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 discut\u00edan los dos cuervos?",opciones:["Por el mejor \u00e1rbol del bosque","Por un trozo de carne","Por qui\u00e9n cantaba mejor"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 ofreci\u00f3 hacer el zorro?",opciones:["Buscar m\u00e1s carne para todos","Dividir la carne en partes iguales","Llevarlos ante un juez"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l era el truco del zorro?",opciones:["Cortar trozos muy peque\u00f1os","Comer de un trozo y otro hasta quedarse con todo","Huir con la carne"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 les qued\u00f3 a los cuervos al final?",opciones:["La mitad de la carne","Un trozo peque\u00f1o","Nada"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 nos ense\u00f1a esta f\u00e1bula?",opciones:["Que los cuervos son tontos","Que los zorros son muy inteligentes","Que quien deja sus conflictos en manos de otros puede perderlo todo"],correcta:2},
     {tipo:"abierta",pregunta:"\u00bfC\u00f3mo deber\u00edan haber resuelto su disputa los cuervos sin necesitar al zorro?"},
   ]},
  {id:88,titulo:"El camino del viento",nivel:"3\u00ba-4\u00ba",tipo:"Poema",icono:"\ud83c\udf2c\ufe0f",color:"#6366F1",colorLight:"#E0E7FF",
   intro:"Un poema que nos invita a reflexionar sobre el viaje y el camino que cada uno elige en la vida.",
   texto:`El viento no tiene casa,
camina sin descansar,
besa las cumbres nevadas
y luego baja hacia el mar.

A veces sopla con fuerza
y a veces tan suave va
que solo mueve una hoja
y nadie lo puede ver.

El viento lleva noticias
de tierras que est\u00e1n muy lejos,
lleva el perfume del trigo
y el polvo de los desiertos.

T\u00fa tambi\u00e9n tienes un camino
que un d\u00eda deber\u00e1s andar.
Como el viento, ir\u00e1s buscando
tu propio lugar.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo describe el poema al viento?",opciones:["Como alguien que siempre descansa","Como alguien que camina sin descansar sin tener casa","Como un viajero que siempre vuelve al mismo lugar"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 lugares visita el viento seg\u00fan el poema?",opciones:["Solo las cumbres nevadas","Las cumbres nevadas y el mar","Los bosques y los r\u00edos"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 lleva el viento de tierras lejanas?",opciones:["Lluvia y nieve","Noticias, perfume de trigo y polvo de desiertos","Solo aromas de flores"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfA qui\u00e9n compara el poema con el viento al final?",opciones:["A los p\u00e1jaros migratorios","A las personas en su viaje por la vida","A los marineros"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 recurso po\u00e9tico usa \u00abbesa las cumbres nevadas\u00bb?",opciones:["Una comparaci\u00f3n","Una personificaci\u00f3n","Una met\u00e1fora"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 camino te gustar\u00eda recorrer en tu vida? \u00bfQu\u00e9 cosas te gustar\u00eda hacer o ser?"},
   ]},
  {id:89,titulo:"El planeta Tierra",nivel:"4\u00ba",tipo:"Texto informativo",icono:"\ud83c\udf0d",color:"#0D9488",colorLight:"#CCFBF1",
   intro:"La Tierra es nuestro hogar en el universo. Un texto sobre las caracter\u00edsticas m\u00e1s asombrosas de nuestro planeta.",
   texto:`La Tierra es el tercer planeta del Sistema Solar y el \u00fanico donde se ha encontrado vida. Tiene aproximadamente 4.500 millones de a\u00f1os.

Est\u00e1 formada por varias capas: la corteza (donde vivimos), el manto (roca fundida que puede salir en erupciones volc\u00e1nicas), el n\u00facleo externo (l\u00edquido) y el n\u00facleo interno (hierro s\u00f3lido a 5.000 grados).

La Tierra gira sobre s\u00ed misma en 24 horas (el d\u00eda) y da una vuelta completa al Sol en 365 d\u00edas y 6 horas (el a\u00f1o). Esas 6 horas sobrantes se acumulan y cada cuatro a\u00f1os a\u00f1adimos un d\u00eda al calendario: el a\u00f1o bisiesto.

La Luna es el \u00fanico sat\u00e9lite natural de la Tierra. Su gravedad produce las mareas en los oc\u00e9anos.

El 71% de la superficie terrestre est\u00e1 cubierta de agua, pero solo el 3% es agua dulce apta para beber.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos a\u00f1os tiene aproximadamente la Tierra?",opciones:["Mil millones de a\u00f1os","4.500 millones de a\u00f1os","Mil millones de a\u00f1os"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 produce la gravedad de la Luna?",opciones:["Las erupciones volc\u00e1nicas","Los vientos","Las mareas en los oc\u00e9anos"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 hay a\u00f1os bisiestos?",opciones:["Para corregir errores del calendario","Por las 6 horas sobrantes de cada a\u00f1o que se acumulan","Por decisi\u00f3n de los astr\u00f3nomos"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 porcentaje de la superficie terrestre es agua?",opciones:["El 30%","El 50%","El 71%"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 porcentaje de esa agua es dulce y apta para beber?",opciones:["El 3%","El 10%","El 25%"],correcta:0},
     {tipo:"abierta",pregunta:"\u00bfPor qu\u00e9 crees que es tan importante cuidar el agua dulce de nuestro planeta?"},
   ]},
  {id:90,titulo:"El d\u00eda sin pantallas",nivel:"3\u00ba-4\u00ba",tipo:"Cuento",icono:"\ud83d\udcf5",color:"#64748B",colorLight:"#F1F5F9",
   intro:"En casa de Vera, un domingo al mes es el \u00abd\u00eda sin pantallas\u00bb. \u00bfC\u00f3mo lo viven los distintos miembros de la familia?",
   texto:`El primer domingo de cada mes, en casa de Vera hab\u00eda una regla: sin pantallas. Ni m\u00f3vil, ni tablet, ni televisi\u00f3n.

Al principio, Vera protestaba.
\u2014\u00bfQu\u00e9 se supone que voy a hacer todo el d\u00eda?

Pero ese domingo, aburrida, cogi\u00f3 los l\u00e1pices de colores y dibuj\u00f3 el jard\u00edn desde la ventana. Luego su hermano le propuso jugar al ajedrez. No sab\u00eda jugar, pero le ense\u00f1\u00f3.

Por la tarde, su padre sac\u00f3 una caja de fotos antiguas. Vera vio fotos de su madre de peque\u00f1a, de su abuelo de joven, de una casa que ya no exist\u00eda.

\u2014\u00bfEse eres t\u00fa, abuelo? \u2014pregunt\u00f3 se\u00f1alando una foto.

Y el abuelo cont\u00f3 historias durante dos horas.

Al irse a dormir, Vera pens\u00f3 que hab\u00eda sido uno de los mejores domingos del a\u00f1o.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 regla hab\u00eda en casa de Vera el primer domingo de cada mes?",opciones:["Que todos salieran a pasear","Sin pantallas en todo el d\u00eda","Que cada uno cocinara algo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hizo Vera cuando se aburri\u00f3?",opciones:["Se fue a casa de una amiga","Dibuj\u00f3 el jard\u00edn con l\u00e1pices de colores","Ley\u00f3 un libro"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 jugaron Vera y su hermano?",opciones:["Al parch\u00eds","Al ajedrez","A las cartas"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hicieron por la tarde con el abuelo?",opciones:["Dieron un paseo por el parque","Miraron fotos antiguas y el abuelo cont\u00f3 historias","Cocinaron juntos"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo valor\u00f3 Vera el d\u00eda al irse a dormir?",opciones:["Lo consider\u00f3 un castigo injusto","Pens\u00f3 que hab\u00eda sido uno de los mejores domingos del a\u00f1o","Le pareci\u00f3 un d\u00eda normal"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfQu\u00e9 har\u00edas t\u00fa en un d\u00eda sin pantallas? \u00bfCrees que ser\u00eda positivo o negativo?"},
   ]},
  {id:91,titulo:"El genio de la botella",nivel:"3\u00ba",tipo:"Cuento",icono:"\ud83e\uddde",color:"#F97316",colorLight:"#FFEDD5",
   intro:"Un pescador encuentra una botella en el mar. Dentro hay un genio que conceder\u00e1 tres deseos... pero hay una trampa.",
   texto:`Un viejo pescador encontr\u00f3 una botella en la red. La destap\u00f3 y sali\u00f3 una nube de humo de la que apareci\u00f3 un genio enorme.

\u2014\u00a1Gracias por liberarme! Te concedo tres deseos.

El pescador pens\u00f3 con calma.
\u2014Para mi primer deseo: que mi familia tenga siempre comida suficiente.
\u2014Concedido \u2014dijo el genio.
\u2014Para el segundo: que todos los ni\u00f1os del pueblo tengan acceso a la escuela.
\u2014Concedido. \u00bfY el tercero?
\u2014Para el tercero \u2014dijo el pescador\u2014, quisiera que fueras libre para siempre.

El genio se qued\u00f3 paralizado.
\u2014\u00bfPor qu\u00e9 no pides oro o fama?
\u2014Porque tengo lo que necesito, y devolver la libertad a alguien vale m\u00e1s que cualquier riqueza.

El genio desapareci\u00f3 con una sonrisa de gratitud.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfD\u00f3nde encontr\u00f3 el pescador la botella?",opciones:["En la playa","En la red de pesca","Flotando en el r\u00edo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l fue el primer deseo del pescador?",opciones:["Mucho oro","Que su familia siempre tuviera comida","Un barco nuevo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 pidi\u00f3 para el segundo deseo?",opciones:["Un palacio","Un barco r\u00e1pido","Que los ni\u00f1os del pueblo tuvieran escuela"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 pidi\u00f3 en el tercer deseo?",opciones:["Fama y riqueza","La libertad del propio genio","Vivir muchos a\u00f1os"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 no pidi\u00f3 oro ni fama?",opciones:["Porque ya los ten\u00eda","Porque ten\u00eda lo que necesitaba y valor\u00f3 la libertad del genio","Porque no sab\u00eda qu\u00e9 pedir"],correcta:1},
     {tipo:"abierta",pregunta:"Si tuvieras tres deseos, \u00bfqu\u00e9 pedir\u00edas? \u00bfPor qu\u00e9?"},
   ]},
  {id:92,titulo:"El peque\u00f1o Mozart",nivel:"4\u00ba",tipo:"Texto informativo",icono:"\ud83c\udfb9",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"Wolfgang Amadeus Mozart fue un genio de la m\u00fasica. \u00bfSabes que ya compon\u00eda con solo cuatro a\u00f1os?",
   texto:`Wolfgang Amadeus Mozart naci\u00f3 en Salzburgo (Austria) el 27 de enero de 1756. Desde muy peque\u00f1o mostr\u00f3 un talento musical extraordinario.

Con tres a\u00f1os ya tocaba el clavic\u00e9mbalo. Con cuatro, compon\u00eda sus primeras piezas musicales. Con seis, toc\u00f3 para el emperado de Austria. Con doce, hab\u00eda compuesto ya \u00f3peras, sinfon\u00edas y conciertos.

Su padre, Leopold Mozart, reconoci\u00f3 su talento y lo llev\u00f3 a recorrer las cortes de Europa, donde actu\u00f3 ante los reyes m\u00e1s importantes.

Sin embargo, la vida de Mozart no fue f\u00e1cil. Aunque era un genio reconocido, tuvo graves problemas econ\u00f3micos.

Muri\u00f3 con solo 35 a\u00f1os, en 1791, dejando incompleta su \u00faltima obra: el R\u00e9quiem. Hoy es considerado uno de los compositores m\u00e1s importantes de la historia de la m\u00fasica.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfEn qu\u00e9 ciudad naci\u00f3 Mozart?",opciones:["Viena","Berl\u00edn","Salzburgo"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCon cu\u00e1ntos a\u00f1os toc\u00f3 para el emperador de Austria?",opciones:["Cuatro","Seis","Ocho"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 instrumento tocaba ya con tres a\u00f1os?",opciones:["El viol\u00edn","El clavic\u00e9mbalo","La flauta"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCon cu\u00e1ntos a\u00f1os muri\u00f3 Mozart?",opciones:["25","35","45"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1l fue la \u00faltima obra de Mozart, que qued\u00f3 incompleta?",opciones:["La Flauta M\u00e1gica","Las Bodas de F\u00edgaro","El R\u00e9quiem"],correcta:2},
     {tipo:"abierta",pregunta:"Mozart mostr\u00f3 su talento siendo muy ni\u00f1o. \u00bfHay algo en lo que destaces t\u00fa? \u00bfLo practicas?"},
   ]},
  {id:93,titulo:"El guardabosques",nivel:"4\u00ba",tipo:"Cuento",icono:"\ud83c\udf32",color:"#15803D",colorLight:"#DCFCE7",
   intro:"El guardabosques Lucas descubre que alguien est\u00e1 talando \u00e1rboles ilegalmente por la noche. \u00bfConseguir\u00e1 detenerlo?",
   texto:`Lucas llevaba veinte a\u00f1os cuidando el bosque de Pinos Altos. Conoc\u00eda cada \u00e1rbol, cada sendero, cada animal que viv\u00eda all\u00ed.

Una ma\u00f1ana encontr\u00f3 tres pinos talados y las marcas de un cami\u00f3n grande. Alguien hab\u00eda entrado de noche.

Lucas instal\u00f3 c\u00e1maras ocultas entre los \u00e1rboles y esper\u00f3.

A la semana siguiente, las c\u00e1maras grabaron un cami\u00f3n sin matr\u00edcula que se llevaba troncos en plena noche.

Con las im\u00e1genes, Lucas fue a la guardia civil. Dos d\u00edas despu\u00e9s, detuvieron al responsable: era un maderero que vend\u00eda la madera ilegalmente.

El bosque tard\u00f3 a\u00f1os en recuperar esos \u00e1rboles. Pero Lucas plant\u00f3 el doble de los que hab\u00edan talado.

\u2014Un \u00e1rbol tarda un siglo en crecer \u2014dijo\u2014 pero en una noche se puede destruir. Por eso hay que protegerlos.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos a\u00f1os llevaba Lucas cuidando el bosque?",opciones:["Diez","Veinte","Treinta"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 encontr\u00f3 una ma\u00f1ana?",opciones:["Un incendio en el bosque","Tres pinos talados y marcas de cami\u00f3n","Animales heridos"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hizo para atrapar al culpable?",opciones:["Pas\u00f3 las noches en el bosque vigilando","Instal\u00f3 c\u00e1maras ocultas entre los \u00e1rboles","Pidi\u00f3 ayuda a los vecinos del pueblo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQui\u00e9n era el responsable?",opciones:["Un cazador furtivo","Un maderero que vend\u00eda madera ilegalmente","Un agricultor del pueblo"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hizo Lucas despu\u00e9s del incidente?",opciones:["Abandon\u00f3 el bosque","Plant\u00f3 el doble de los \u00e1rboles talados","Instal\u00f3 m\u00e1s c\u00e1maras"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfPor qu\u00e9 crees que es importante proteger los bosques? \u00bfQu\u00e9 perdemos si los destruimos?"},
   ]},
  {id:94,titulo:"La historia de los colores",nivel:"3\u00ba",tipo:"Cuento",icono:"\ud83c\udfa8",color:"#EF4444",colorLight:"#FEE2E2",
   intro:"Los colores del arco\u00edris discuten sobre cu\u00e1l de ellos es el m\u00e1s importante. \u00bfC\u00f3mo se resolver\u00e1 la disputa?",
   texto:`Un d\u00eda, los colores del arco\u00edris empezaron a discutir.

\u2014Yo soy el m\u00e1s importante \u2014dijo el rojo\u2014. Represento el fuego, la sangre y el amor.
\u2014No \u2014respondi\u00f3 el amarillo\u2014. Yo represento el sol, que da vida a todo.
\u2014El verde soy yo \u2014dijo el verde\u2014. Represento la naturaleza y las plantas.
\u2014El azul \u2014dijo el azul\u2014, represento el cielo y el mar, que cubren m\u00e1s de la mitad del mundo.
\u2014Y yo, el violeta \u2014dijo el violeta\u2014, represento la sabidur\u00eda y la creatividad.

Empez\u00f3 a llover. Todos los colores se asustaron y se unieron juntos.

Cuando par\u00f3 la lluvia, los rayos del sol los uni\u00f3 en un arco\u00edris.

Y la gente, al verlo, sonri\u00f3.

\u2014Solo juntos \u2014dijo la lluvia\u2014 cre\u00e1is algo tan hermoso que hace sonre\u00edr al mundo.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 discut\u00edan los colores?",opciones:["Porque no sab\u00edan cu\u00e1ntos eran","Porque cada uno cre\u00eda ser el m\u00e1s importante","Porque la lluvia los estaba mezclando"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 representa el amarillo seg\u00fan el cuento?",opciones:["El amor y el fuego","El sol que da vida","Las plantas y la naturaleza"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 pas\u00f3 cuando empez\u00f3 a llover?",opciones:["Los colores huyeron cada uno a su sitio","Los colores se asustaron y se unieron","Los colores desaparecieron"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 crearon los colores al unirse tras la lluvia?",opciones:["Una gran mancha de pintura","Un arco\u00edris que hizo sonre\u00edr a la gente","Un cuadro precioso"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 mensaje da el cuento sobre la diversidad?",opciones:["Que cada uno debe destacar por su lado","Que solo juntos creamos algo verdaderamente hermoso","Que el rojo es siempre el mejor color"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfCrees que en un equipo o en una clase todos son importantes aunque sean diferentes? Pon un ejemplo."},
   ]},
  {id:95,titulo:"Noticias de la naturaleza",nivel:"3\u00ba-4\u00ba",tipo:"Texto funcional",icono:"\ud83c\udf3f",color:"#059669",colorLight:"#D1FAE5",
   intro:"Un texto funcional diferente: titulares de un peri\u00f3dico ambiental. \u00a1Aprende a leer noticias!",
   texto:`EL ECO VERDE \u2014 Peri\u00f3dico ambiental escolar

\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501
\ud83d\udc1d LAS ABEJAS SIGUEN EN PELIGRO
El uso de pesticidas y la destrucci\u00f3n de h\u00e1bitats ha reducido la poblaci\u00f3n de abejas en un 30% en los \u00faltimos diez a\u00f1os. Sin abejas, muchas plantas no podr\u00edan reproducirse.

\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501
\ud83c\udf0a LOS OC\u00c9ANOS ACUMULAN 150 MILLONES DE TONELADAS DE PL\u00c1STICO
Los cient\u00edficos calculan que cada a\u00f1o entran 8 millones de toneladas de pl\u00e1stico al mar. Las tortugas y delfines los confunden con comida.

\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501
\ud83c\udf31 BUENAS NOTICIAS: EL BOSQUE DEL AMAZONAS RECUPERA ZONAS DEFORESTADAS
Gracias a proyectos de reforestaci\u00f3n, 40.000 hect\u00e1reas de selva amaz\u00f3nica han vuelto a crecer en los \u00faltimos cinco a\u00f1os.

\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501
\ud83d\udce2 \u00bfSAB\u00cdAS QUE...? Una sola bolsa de tela puede reemplazar 700 bolsas de pl\u00e1stico a lo largo de su vida \u00fatil.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1nto ha disminuido la poblaci\u00f3n de abejas seg\u00fan la primera noticia?",opciones:["Un 10%","Un 20%","Un 30%"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 cantidad de pl\u00e1stico entra al mar cada a\u00f1o?",opciones:["1 mill\u00f3n de toneladas","8 millones de toneladas","50 millones de toneladas"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfA qu\u00e9 confunden los delfines y tortugas el pl\u00e1stico?",opciones:["A algas","A medusas","A comida"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntas hect\u00e1reas de selva amaz\u00f3nica se han recuperado?",opciones:["4.000 hect\u00e1reas","40.000 hect\u00e1reas","400.000 hect\u00e1reas"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfA cu\u00e1ntas bolsas de pl\u00e1stico equivale una bolsa de tela?",opciones:["100","400","700"],correcta:2},
     {tipo:"abierta",pregunta:"\u00bfCu\u00e1l de estas noticias te preocupa m\u00e1s? \u00bfQu\u00e9 podr\u00edas hacer t\u00fa para ayudar?"},
   ]},
  {id:96,titulo:"El caballero sin miedo",nivel:"4\u00ba",tipo:"Cuento",icono:"\u2694\ufe0f",color:"#DC2626",colorLight:"#FEE2E2",
   intro:"El joven Rodrigo quiere ser caballero pero le dicen que es demasiado peque\u00f1o. Tendr\u00e1 que demostrar su val\u00eda de una manera inesperada.",
   texto:`En el reino de Monteclara, el rey convoc\u00f3 un torneo para elegir a su nuevo caballero. Llegaron guerreros altos y fuertes de todo el reino.

Rodrigo ten\u00eda quince a\u00f1os y era el m\u00e1s delgado de todos. Todos se rieron cuando se present\u00f3.

El rey propuso tres pruebas: fuerza, velocidad y astucia.

En fuerza, Rodrigo qued\u00f3 el \u00faltimo. En velocidad, el tercero. Pero en astucia, el rey le pidi\u00f3 que sacara a un toro de un laberinto sin tocarlo.

Rodrigo estudi\u00f3 el laberinto, vio por d\u00f3nde entraba el viento, y coloc\u00f3 flores que ol\u00edan a campo junto a la salida. El toro las sigui\u00f3 y sali\u00f3 solo.

El rey sonri\u00f3:
\u2014Un buen caballero no necesita solo m\u00fasculos. Necesita ingenio. Bienvenido a mi guardia, Rodrigo.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfPara qu\u00e9 convoc\u00f3 el torneo el rey?",opciones:["Para celebrar su cumplea\u00f1os","Para elegir a su nuevo caballero","Para encontrar al m\u00e1s fuerte del reino"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos a\u00f1os ten\u00eda Rodrigo?",opciones:["Diez","Quince","Dieciocho"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfEn cu\u00e1l de las tres pruebas destac\u00f3 Rodrigo?",opciones:["En fuerza","En velocidad","En astucia"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo sac\u00f3 Rodrigo al toro del laberinto?",opciones:["Asust\u00e1ndolo con ruido","Usando flores olorosas para guiarlo hacia la salida","Abri\u00e9ndole un nuevo camino"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 cualidad valor\u00f3 el rey por encima de todo?",opciones:["La fuerza f\u00edsica","La velocidad","El ingenio y la astucia"],correcta:2},
     {tipo:"abierta",pregunta:"\u00bfCrees que el ingenio puede ser m\u00e1s \u00fatil que la fuerza? Pon un ejemplo de la vida real."},
   ]},
  {id:97,titulo:"El cocinero y el pato",nivel:"3\u00ba",tipo:"Cuento",icono:"\ud83e\udd86",color:"#F59E0B",colorLight:"#FEF3C7",
   intro:"El rey quiere que su cocinero prepare un fest\u00edn. Pero hay un problema: el \u00fanico ingrediente disponible es un pato que habla.",
   texto:`El rey orden\u00f3 un gran fest\u00edn para esa noche. El cocinero fue al corral a buscar el mejor animal y encontr\u00f3 un pato gordo y brillante.

\u2014Espera \u2014dijo el pato\u2014. Antes de que me conviertas en el fest\u00edn del rey, esc\u00fachame.

El cocinero, asombrado de que hablara, se qued\u00f3 quieto.

\u2014Si me dejas vivir \u2014dijo el pato\u2014, te dar\u00e9 un secreto: el rey tiene un tesoro escondido que nadie conoce. Con ese dato, podr\u00edas pedir cualquier recompensa.

El cocinero pens\u00f3. Pero luego dijo:
\u2014No. Mi trabajo es servir al rey con honestidad, no enga\u00f1arle.

Y devolvi\u00f3 el pato al corral.

Esa noche, prepar\u00f3 un fest\u00edn sin pato. El rey lo llam\u00f3 para preguntarle.

El cocinero le cont\u00f3 todo. El rey, impresionado por su honestidad, le nombr\u00f3 su consejero personal.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 pidi\u00f3 el rey?",opciones:["Una armadura nueva","Un gran fest\u00edn para esa noche","Un torneo de cocina"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 le propuso el pato al cocinero?",opciones:["Que lo dejara escapar a cambio de nada","Darle un secreto sobre el tesoro del rey a cambio de su vida","Que le preparara otra cosa"],correcta:1},
     {tipo:"opcion",pregunta:"\u00bfPor qu\u00e9 rechaz\u00f3 el cocinero la propuesta del pato?",opciones:["Porque no se fiaba del pato","Porque ya sab\u00eda d\u00f3nde estaba el tesoro","Porque su trabajo era servir al rey con honestidad"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hizo el cocinero con el pato?",opciones:["Lo convirti\u00f3 en el fest\u00edn de todas formas","Lo guard\u00f3 en secreto","Lo devolvi\u00f3 al corral"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfC\u00f3mo premi\u00f3 el rey la honestidad del cocinero?",opciones:["Con mucho oro","Nombr\u00e1ndole su consejero personal","Con un nuevo corral"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfHabr\u00eda sido m\u00e1s inteligente el cocinero si hubiera aceptado la propuesta del pato? Razona tu respuesta."},
   ]},
  {id:98,titulo:"La primera biblioteca",nivel:"4\u00ba",tipo:"Texto informativo",icono:"\ud83d\udcda",color:"#1D4ED8",colorLight:"#DBEAFE",
   intro:"\u00bfSabes cu\u00e1ndo y d\u00f3nde naci\u00f3 la primera gran biblioteca del mundo? \u00a1La respuesta te sorprender\u00e1!",
   texto:`La primera gran biblioteca del mundo fue la Biblioteca de Alejandr\u00eda, fundada en Egipto alrededor del a\u00f1o 285 a.C. por Ptolomeo I, uno de los generales de Alejandro Magno.

Su objetivo era reunir todo el conocimiento humano en un solo lugar. En su momento \u00e1lgido lleg\u00f3 a tener entre 400.000 y 700.000 rollos de papiro, que eran los libros de la antig\u00fcedad.

Para aumentar la colecci\u00f3n, se copiaban todos los libros que llegaban a los barcos que entraban en el puerto de Alejandr\u00eda.

La biblioteca cont\u00f3 con grandes sabios que trabajaron en ella: Euclides (matem\u00e1ticas), Erat\u00f3stenes (midi\u00f3 la circunferencia de la Tierra) y Arqu\u00edmedes.

La biblioteca fue destruida en varios incendios a lo largo de los siglos. Hoy existe en Alejandr\u00eda una nueva biblioteca, inaugurada en 2002, como homenaje a aquella primera.`,
   preguntas:[
     {tipo:"opcion",pregunta:"\u00bfEn qu\u00e9 pa\u00eds estaba la Biblioteca de Alejandr\u00eda?",opciones:["Grecia","Roma","Egipto"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ntos rollos de papiro pod\u00eda tener?",opciones:["Entre 4.000 y 7.000","Entre 40.000 y 70.000","Entre 400.000 y 700.000"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQu\u00e9 hac\u00edan con los libros de los barcos que llegaban al puerto?",opciones:["Los compraban","Los confiscaban","Los copiaban"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfQui\u00e9n midi\u00f3 la circunferencia de la Tierra trabajando en la biblioteca?",opciones:["Euclides","Arqu\u00edmedes","Erat\u00f3stenes"],correcta:2},
     {tipo:"opcion",pregunta:"\u00bfCu\u00e1ndo se inaugur\u00f3 la nueva biblioteca de Alejandr\u00eda?",opciones:["En 1990","En 2002","En 2010"],correcta:1},
     {tipo:"abierta",pregunta:"\u00bfVisitas la biblioteca de tu pueblo o ciudad? \u00bfQu\u00e9 cambiar\u00edas o a\u00f1adir\u00edas a tu biblioteca ideal?"},
   ]},
  {id:99,titulo:"El secreto de la abuela",nivel:"3\u00ba-4\u00ba",tipo:"Cuento",icono:"\ud83e\uddf6",color:"#DB2777",colorLight:"#FCE7F3",
   intro:"La abuela de Lena siempre lleva un jersey azul con un bolsillo especial. Cuando Lena le pregunta qu\u00e9 guarda dentro, empieza una historia muy especial.",
   texto:`La abuela de Lena siempre llevaba puesto el mismo jersey azul, viejo y ra\u00eddo. Ten\u00eda un bolsillo en el pecho que nunca abr\u00eda.

\u2014Abuela, \u00bfqu\u00e9 guardas en ese bolsillo?
\u2014Un secreto \u2014respond\u00eda siempre.

Un d\u00eda que la abuela estaba dormida, Lena se acerc\u00f3 y sac\u00f3 con cuidado lo que hab\u00eda dentro: era una fotografia peque\u00f1a, en blanco y negro, de una ni\u00f1a sonriendo.

Cuando la abuela se despert\u00f3, vio la foto en manos de Lena.
\u2014\u00bfQui\u00e9n es? \u2014pregunt\u00f3 Lena.
\u2014Soy yo \u2014dijo la abuela\u2014, el d\u00eda que fui a la escuela por primera vez. Ten\u00eda siete a\u00f1os. Era la primera de mi familia en ir a la escuela.

La abuela cerr\u00f3 los ojos un momento.
\u2014Guardo esa foto para recordar que el conocimiento es lo m\u00e1s valioso que puedes tener. Nadie puede quit\u00e1rtelo.`,

  {id:100,titulo:"Los derechos del ni\u00f1o",nivel:"4\u00ba",tipo:"Texto informativo",icono:"\ud83c\udf10",color:"#0D9488",colorLight:"#CCFBF1",
   intro:"En 1989, la ONU aprob\u00f3 la Convenci\u00f3n sobre los Derechos del Ni\u00f1o. \u00bfCu\u00e1les son tus derechos?",
   texto:`El 20 de noviembre de 1989, la Organizaci\u00f3n de las Naciones Unidas (ONU) aprob\u00f3 la Convenci\u00f3n sobre los Derechos del Ni\u00f1o. Es el tratado de derechos humanos m\u00e1s ratificado de la historia.

Todos los ni\u00f1os y ni\u00f1as del mundo, sin excepci\u00f3n, tienen los mismos derechos, con independencia de su raza, sexo, idioma, religi\u00f3n o situaci\u00f3n econ\u00f3mica.

Entre los derechos m\u00e1s importantes est\u00e1n:

Derecho a la vida y a crecer en condiciones dignas.
Derecho a la educaci\u00f3n gratuita y obligatoria.
Derecho a la salud y a recibir atenci\u00f3n m\u00e9dica.
Derecho a jugar y al ocio.
Derecho a la familia y a no ser separado de sus padres salvo en casos excepcionales.
Derecho a estar protegido de la violencia, el abuso y la explotaci\u00f3n.
Derecho a la libertad de expresi\u00f3n y a dar su opini\u00f3n.

El 20 de noviembre se celebra el D\u00eda Universal del Ni\u00f1o.`,

  {id:102,titulo:"Eduardo Porcachón",nivel:"5º",tipo:"Cuento",icono:"🐷",color:"#F97316",colorLight:"#FFEDD5",
   intro:"Eduardo es un cerdo aventurero que organiza una expedición al monte de las hayas. ¿Llegará a la cima?",
   texto:`Un día estaba Eduardo Porcachón, el cerdo aventurero, sentado en su pocilga, cuando pasó por allí la ardilla TT con ganas de charla.
—Es una pena que aquí en la granja no pase nada. Es puro aburrimiento.

Entonces pasó por allí el buey Alberto. Eduardo se puso en pie y dijo:
—Estoy planeando ponerme al frente de una expedición… mañana.
—¡Oh! —exclamó la ardilla TT—. ¿A dónde, Eduardo?
—¡Mañana subiré al monte de las hayas!

El buey Alberto dijo:
—Eso lo hace cualquiera.
—No por la ruta difícil —repuso Eduardo lleno de osadía.

A la mañana siguiente hacía frío y llovía, pero partió la expedición: Eduardo, TT, el buey Alberto y el perro Héctor. A mitad de camino, la niebla se hizo tan espesa que Eduardo se extravió.

Héctor y TT decidieron volver a la granja. El buey Alberto siguió un rato más, pero también se rindió.

Eduardo, solo en la niebla, esperó a que se despejara. Cuando por fin pudo ver, subió al monte de las hayas. ¡Lo había conseguido!`,

  {id:103,titulo:"La flor más bonita",nivel:"5º-6º",tipo:"Cuento",icono:"🌸",color:"#DB2777",colorLight:"#FCE7F3",
   intro:"Un príncipe chino que quiere casarse pone a prueba la honestidad de sus pretendientes con una semilla.",
   texto:`Hace muchos siglos, en China, un joven príncipe no podía ser coronado emperador porque estaba soltero. Decidió que la mujer que le llevara la flor más bonita del mundo sería su esposa.

El día señalado, cientos de jóvenes llegaron al palacio con flores espléndidas. Solo una joven llegó con un tiesto vacío. Era la hija de una anciana que servía en palacio.

—¿Por qué has venido con un tiesto vacío? —preguntó el príncipe.
—Sembré la semilla que me diste, la cuidé con todo mi amor, pero no creció nada. No quería engañarte trayendo otra flor que no fuera la tuya.

El príncipe sonrió y se dirigió a todos:
—Esta joven es la única honesta. Las semillas que repartí estaban tratadas para no germinar. Las demás debieron comprar otras flores. Ella dijo la verdad y eso es lo más valioso.

Y así fue como la hija de la anciana se convirtió en emperatriz.`,

  {id:104,titulo:"Con la escoba",nivel:"5º-6º",tipo:"Cuento",icono:"🧹",color:"#7C3AED",colorLight:"#EDE9FE",
   intro:"Un aprendiz sale a buscar trabajo con su escoba al hombro. ¿Qué encontrará?",
   texto:`Estaban encendiéndose las luces de la calle cuando el aprendiz, con su escoba al hombro, salió por las calles del pueblo. Iba silbando y se dirigió hacia una lucecilla. Se abrió una ventana sobre su cabeza. Era la casa del señor José y un niño de cabello dorado preguntó:
—¿Quién eres tú?
—Soy el aprendiz del tendero Ezequiel. Dile a tu padre si quiere que barra su tienda por muy poca cosa a cambio.
—¿Qué cosa a cambio?
—Solamente un trocito de carne.

El niño entró y volvió a salir muy alegre, pues aquel aprendiz silbaba una canción muy bonita.
—Pasa —dijo—. Mi padre está conforme.

Al barrer la tienda, el aprendiz encontró una moneda de oro bajo el mostrador. Se la entregó al señor José sin dudarlo. El señor José, admirado por su honradez, le dio un generoso trozo de carne y además le regaló las monedas que había ahorrado ese mes.

El aprendiz regresó silbando, con el estómago lleno y el corazón tranquilo.`,

  {id:105,titulo:"El precio del humo",nivel:"5º-6º",tipo:"Cuento",icono:"🍖",color:"#B45309",colorLight:"#FEF3C7",
   intro:"Un campesino va a una posada y el posadero quiere cobrarle algo injusto. ¿Cómo saldrá de esta?",
   texto:`Un día, un campesino fue a la ciudad a vender los productos de su cosecha. De regreso a casa, entró en una posada a descansar un rato. Como era día de mercado, la posada se encontraba llena de gente.
—¿Qué quieres comer? —le preguntó el posadero.
—Una hogaza de pan y un jarrillo de vino —respondió el campesino.

Mientras el posadero se alejaba, el campesino fijó sus ojos en una pieza que se asaba en la chimenea y que desprendía un olor delicioso. El campesino comió su pan y bebió su vino acercándose al olor del asado.

Al terminar, el posadero le reclamó el doble por haber «disfrutado del humo del asado». El campesino protestó, pero el posadero llamó a un noble para que le diera la razón.

El noble escuchó a ambos, sacó unas monedas y las hizo sonar en su mano.
—¿Las monedas? —preguntó el posadero—. ¿Acaso se comió la carne el campesino? Él solo cogió el humo. Pues para pagar el humo del asado bastará con el ruido de las monedas.

Y ante las risas de todos, el posadero no tuvo más remedio que dejar marchar tranquilamente al campesino.`,

  {id:106,titulo:"La danza de las abejas",nivel:"5º-6º",tipo:"Texto informativo",icono:"🐝",color:"#D97706",colorLight:"#FEF9C3",
   intro:"¿Sabías que las abejas tienen un lenguaje propio? Un texto científico sobre su increíble forma de comunicarse.",
   texto:`Los seres humanos necesitamos comunicarnos con los demás y transmitirles nuestros pensamientos y sentimientos. Pero, ¿sabías que los animales también se comunican entre sí?

Uno de esos «lenguajes» sorprendentes es el de las abejas. Las abejas son insectos sociales que viven en colonias compuestas por obreras, zánganos y la abeja reina. Las obreras van de flor en flor buscando néctar.

Cuando una obrera encuentra una buena cantidad de alimento, vuela hasta la colmena y se lo dice a las demás mediante una danza. Si el alimento está cerca (menos de 100 metros), la abeja describe círculos. Si está lejos, describe una figura de ocho mientras vibra su cuerpo. Cuanto más rápido baila, más cerca está el alimento.

Los científicos han comprobado que este sistema es tan preciso que las demás abejas encuentran el alimento sin problemas. ¡Ningún animal tiene un sistema de comunicación tan complejo!`,
   preguntas:[
     {tipo:"opcion",pregunta:"¿Por qué se llama a las abejas insectos sociales?",opciones:["Porque son muy simpáticas","Porque viven en colonias organizadas","Porque bailan juntas"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué hace una obrera cuando encuentra alimento?",opciones:["Come y vuelve a su casa","Vuela a la colmena y avisa bailando","Llama a gritos a las demás"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué danza indica que el alimento está cerca?",opciones:["Describe figuras de ocho","Describe círculos","Vibra sin moverse"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué indica la velocidad de la danza?",opciones:["La cantidad de alimento","La distancia al alimento","La calidad del alimento"],correcta:1},
     {tipo:"opcion",pregunta:"¿Qué podemos aprender de las abejas?",opciones:["A hacer miel","A organizarnos bien","A defendernos"],correcta:1},
     {tipo:"abierta",pregunta:"¿Crees que la comunicación es solo de las personas? Razona tu respuesta."},
   ]},
  {id:107,titulo:"El consejo de los ratones",nivel:"5º",tipo:"Fábula",icono:"🐭",color:"#6B7280",colorLight:"#F3F4F6",
   intro:"Un gato aterra a todos los ratones. En la asamblea tienen una gran idea... pero ¿quién la pondrá en práctica?",
   texto:`En un determinado lugar había un gato que era el terror de los ratones. No les dejaba vivir ni un instante. Les perseguía de día y de noche, de manera que los pobres animales no podían respirar tranquilos.

Como los ratones veían que cada día desaparecían varios compañeros en las garras del gato, decidieron celebrar una asamblea para encontrar una solución.

Después de varias horas de discusión, un ratón tuvo una gran idea:
—¡Ya sé! Le pondremos un cascabel al cuello al gato. Así, cuando se acerque, le oiremos llegar y podremos escapar.

Todos aplaudieron la magnífica solución. Pero entonces otro ratón preguntó:
—¿Y quién le pone el cascabel al gato?

Al oír estas palabras, los ratones se miraron unos a otros confusos… y empezaron a dar excusas:
—Yo no sé hacerlo.
—Yo soy muy torpe y me caería.
—Yo me voy de viaje...

Y uno a uno se marcharon a sus casas sin dar ninguna solución al problema del gato. Porque es muy fácil proponer soluciones; lo difícil es ponerlas en práctica.`,

  {id:108,titulo:"Fray Perico",nivel:"5º-6º",tipo:"Cuento",icono:"⛪",color:"#92400E",colorLight:"#FEF3C7",
   intro:"Perico es un hombre sencillo que quiere ser fraile. ¿Le admitirán en el convento?",
   texto:`Una vez estaba fray Nicanor, el superior, barriendo la iglesia, cuando llegó un hombre rústico, gordo y colorado, llamado Perico. Llevaba un pantalón de pana atado con una cuerda. Miró al padre superior, se limpió la nariz con la manga y dijo:
—Déjame la escoba, hermano. Yo te ayudaré.
—Pero si ya he terminado.
—Pues barreré otra vez.

Así lo hizo, y al terminar se acercó al padre superior y le dijo:
—Me gustaría barrer la iglesia todos los días y ser fraile como vosotros.

El superior se agarró la barba un buen rato y repuso:
—Tendrás que pasar frío.
—Lo pasaré.
—Tendrás que pasar hambre.
—La pasaré.
—Y tendrás que dormir poco.
—¡Uf! No sé si podré. Algunas veces me duermo de pie.

El abad se sonrió y le preguntó:
—¿Cómo te llamas?
—Perico.
—Pues bienvenido, fray Perico.

Los demás frailes eran sabios y conocían los libros, pero Perico no sabía leer. Sin embargo, tenía algo que los demás admiraban: una alegría contagiosa y una bondad sin límites.`,
